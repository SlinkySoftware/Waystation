# Real-client harness stack (tests/clients/README.md). Loaded by tests/clients/run.sh on top of
# Build/Containers/compose.yaml + compose.dev.yaml, as its own compose project (HARNESS_PROJECT, unique per checkout
# and format), so it never collides with `make dev-up` or another worktree. run.sh also adds a generated override
# with extra_hosts (public upstream names -> fake-upstream) and the SSRF allowance for the fake upstream's address.
#
# Variables (set by run.sh): HARNESS_PROJECT, HARNESS_RUN_DIR (per-run dir: ca/, state/), HARNESS_FIXTURES,
# HARNESS_MODE, HARNESS_FORMAT, HARNESS_HOSTS, HARNESS_ORIGINS, HARNESS_DROP_JSON_KEYS, HARNESS_STACK, HARNESS_UID,
# HARNESS_GID, HARNESS_CLIENTS_DIR (absolute path of tests/clients: relative paths would resolve against
# Build/Containers), HARNESS_ADMIN_PASSWORD (random per run: the stack's bootstrap admin, for setup.sh scripts that
# create repos).

x-client: &client
  profiles: [clients]
  working_dir: /harness
  networks: [frontend]
  volumes:
    - {type: bind, source: "${HARNESS_CLIENTS_DIR}", target: /harness, read_only: true}
    - {type: bind, source: "${HARNESS_RUN_DIR}/ca", target: /harness-ca, read_only: true}
  environment: &client-env
    HARNESS_CA: /harness-ca/ca.crt
    HARNESS_MODE: ${HARNESS_MODE}
    HARNESS_FORMAT: ${HARNESS_FORMAT}
    HARNESS_STACK: ${HARNESS_STACK:-0}
    HARNESS_ADMIN_PASSWORD: ${HARNESS_ADMIN_PASSWORD:-}
    WAYSTATION_URL: http://waystation-web:8080

x-harness-ca: &harness-ca
  type: bind
  source: "${HARNESS_RUN_DIR}/ca"
  target: /harness-ca
  read_only: true

services:
  # ---- record/replay fake upstream (all impersonated public hosts, :80 and :443)
  fake-upstream:
    build:
      context: ${HARNESS_CLIENTS_DIR}/harness
    image: waystation-harness-upstream:local
    container_name: ${HARNESS_PROJECT}-fake-upstream
    user: "${HARNESS_UID}:${HARNESS_GID}"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      HARNESS_MODE: ${HARNESS_MODE}
      HARNESS_HOSTS: ${HARNESS_HOSTS}
      HARNESS_ORIGINS: ${HARNESS_ORIGINS:-}
      HARNESS_DROP_JSON_KEYS: ${HARNESS_DROP_JSON_KEYS:-}
      HARNESS_FIXTURES: /fixtures
      HARNESS_STATE: /state
      HARNESS_CA_DIR: /harness-ca
    volumes:
      - {type: bind, source: "${HARNESS_FIXTURES}", target: /fixtures}
      - {type: bind, source: "${HARNESS_RUN_DIR}/ca", target: /harness-ca}
      - {type: bind, source: "${HARNESS_RUN_DIR}/state", target: /state}
    networks:
      frontend:
        aliases: [fake-upstream]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1/__harness/health', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30

  # ---- "live upstream" of the echo self-test format (record/live mode only)
  echo-origin:
    profiles: [origins]
    image: waystation-harness-upstream:local
    container_name: ${HARNESS_PROJECT}-echo-origin
    user: "${HARNESS_UID}:${HARNESS_GID}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "/harness/echo_origin.py"]
    networks:
      frontend:
        aliases: [echo-origin]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/hello', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30
    pull_policy: never  # same image as fake-upstream, built when that service starts

  # ---- client containers (one per client family; pinned tags). A format picks one with CLIENT= in format.env.
  client-curl:
    <<: *client
    image: curlimages/curl:8.17.0
    user: "0:0"
    environment:
      <<: *client-env
      CURL_CA_BUNDLE: /harness-ca/ca.crt
  client-node:  # npm (pnpm/yarn via corepack later)
    <<: *client
    image: node:24-trixie-slim
  client-debian:  # apt on Debian 13
    <<: *client
    image: debian:13-slim
  client-ubuntu:  # apt on Ubuntu 26.04
    <<: *client
    image: ubuntu:26.04
  client-rocky:  # dnf on Rocky Linux 10 (yum format)
    <<: *client
    image: rockylinux/rockylinux:10.2
  client-alma:  # dnf on AlmaLinux 10 (yum format)
    <<: *client
    image: almalinux:10.2
  client-helm:  # helm 3 + curl (helm format)
    <<: *client
    image: alpine/helm:3.19.0
    entrypoint: []
  client-helm4:  # helm 4 + curl (helm format)
    <<: *client
    image: alpine/helm:4.0.0
    entrypoint: []
  client-python:  # pip, uv, twine, Poetry and PDM (pypi format)
    <<: *client
    build:
      dockerfile_inline: |
        FROM ghcr.io/astral-sh/uv:0.13.7 AS uv
        FROM python:3.14-slim
        RUN pip install --no-cache-dir --root-user-action=ignore pip==26.3 twine==7.0.0 poetry==2.5.1 pdm==2.29.7
        COPY --from=uv /uv /usr/local/bin/uv
    image: waystation-harness-python:3.14-2  # bump the suffix when the Dockerfile above changes
    environment:
      <<: *client-env
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
  client-ansible:  # ansible-galaxy (ansible-core) and curl (galaxy format)
    <<: *client
    build:
      dockerfile_inline: |
        FROM python:3.14-slim
        RUN apt-get update && apt-get install -y --no-install-recommends curl && rm -rf /var/lib/apt/lists/* \
            && pip install --no-cache-dir --root-user-action=ignore ansible-core==2.22.0
    image: waystation-harness-ansible:2.22.0-1  # bump the suffix when the Dockerfile above changes
    environment:
      <<: *client-env
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      ANSIBLE_NOCOLOR: "1"
      ANSIBLE_FORCE_COLOR: "0"
  client-go:  # the go command and curl (go format)
    <<: *client
    image: golang:1.25-trixie
  client-terraform:  # terraform, tofu, curl and the TLS front of the go harness (terraform format)
    <<: *client
    build:
      context: ${HARNESS_CLIENTS_DIR}/go
      dockerfile_inline: |
        FROM hashicorp/terraform:1.17.1 AS terraform
        FROM ghcr.io/opentofu/opentofu:1.13.9-minimal AS tofu
        FROM golang:1.25-alpine AS front
        COPY tlsfront.go /src/tlsfront.go
        RUN cd /src && CGO_ENABLED=0 GOTOOLCHAIN=local go build -o /tlsfront tlsfront.go
        FROM alpine:3.22
        RUN apk add --no-cache curl
        COPY --from=terraform /bin/terraform /usr/local/bin/terraform
        COPY --from=tofu /usr/local/bin/tofu /usr/local/bin/tofu
        COPY --from=front /tlsfront /usr/local/bin/tlsfront
    image: waystation-harness-terraform:1.17.1-1  # bump the suffix when the Dockerfile above changes
    user: "0:0"
  client-skopeo:  # registry API pulls without a daemon (docker format)
    <<: *client
    image: quay.io/skopeo/stable:v1.20
    entrypoint: []
  client-docker:  # docker CLI + daemon (buildx), plus curl (setup.sh), skopeo, crane, oras and cosign (docker format)
    <<: *client
    build:
      dockerfile_inline: |
        FROM gcr.io/go-containerregistry/crane:v0.22.1@sha256:1f968817b95790bed063f71175aa6b8ff879fa17064020415f3e18bb6e6a36e1 AS crane
        FROM ghcr.io/oras-project/oras:v1.3.6@sha256:9cfb578be975b762fd898b9d004243d8003aeb807a3e15b2ed212cdd1326c9eb AS oras
        FROM ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d AS cosign
        FROM docker:29-dind
        RUN apk add --no-cache curl skopeo
        COPY --from=crane /ko-app/crane /usr/local/bin/crane
        COPY --from=oras /bin/oras /usr/local/bin/oras
        COPY --from=cosign /ko-app/cosign /usr/local/bin/cosign
    image: waystation-harness-docker:29-2  # bump the suffix when the Dockerfile above changes
    entrypoint: []  # dockerd is started by the format's setup.sh (the dind entrypoint would set DOCKER_HOST)
    privileged: true
  client-conformance:  # OCI distribution-spec conformance suite v1.1.1 (docker format: hosted repositories)
    <<: *client
    build:
      dockerfile_inline: |
        FROM golang:1.25-alpine AS build
        ARG SPEC=https://github.com/opencontainers/distribution-spec/archive/refs/tags/v1.1.1.tar.gz
        RUN wget -qO- "$$SPEC" | tar -xz -C / && cd /distribution-spec-1.1.1/conformance \
            && CGO_ENABLED=0 go test -c -o /conformance.test
        FROM alpine:3.22
        RUN apk add --no-cache curl
        COPY --from=build /conformance.test /usr/local/bin/conformance.test
    image: waystation-harness-conformance:1.1.1-1  # bump the suffix when the Dockerfile above changes
    user: "0:0"
  client-maven:  # Maven 3.9 (maven format); build plugins pre-seeded from Maven Central into /opt/m2-seed at image build
    <<: *client
    build:
      dockerfile_inline: |
        FROM maven:3.9.11-eclipse-temurin-21
        RUN set -eu; mkdir -p /tmp/seed/src/main/java/seed; cd /tmp/seed; \
            printf '%s\n' '<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>seed</groupId><artifactId>seed</artifactId><version>1</version><properties><maven.compiler.release>21</maven.compiler.release><project.build.sourceEncoding>UTF-8</project.build.sourceEncoding></properties></project>' > pom.xml; \
            printf 'package seed; public class Seed {}\n' > src/main/java/seed/Seed.java; \
            mvn -B -q -Dmaven.repo.local=/opt/m2-seed org.apache.maven.plugins:maven-dependency-plugin:3.8.1:resolve deploy -DaltDeploymentRepository=seed::file:///tmp/seed-repo; \
            rm -rf /tmp/seed /tmp/seed-repo /opt/m2-seed/seed; \
            find /opt/m2-seed \( -name _remote.repositories -o -name '*.lastUpdated' -o -name resolver-status.properties -o -name 'maven-metadata-*.xml' \) -delete; \
            chmod -R a+rX /opt/m2-seed
    image: waystation-harness-maven:3.9.11-1  # bump the suffix when the Dockerfile above changes

  # ---- Waystation stack under test: own container names, no published port, trusts the harness CA.
  web:
    container_name: ${HARNESS_PROJECT}-web
    ports: !reset []
  server:
    container_name: ${HARNESS_PROJECT}-server
    environment:
      WAYSTATION_EXTRA_CA_FILE: /harness-ca/ca.crt
    volumes:
      - *harness-ca
  worker:
    container_name: ${HARNESS_PROJECT}-worker
    environment:
      WAYSTATION_EXTRA_CA_FILE: /harness-ca/ca.crt
    volumes:
      - *harness-ca
  init:
    container_name: ${HARNESS_PROJECT}-init
    environment:
      WAYSTATION_BOOTSTRAP_ADMIN_PASSWORD: ${HARNESS_ADMIN_PASSWORD:-}  # per-run random, for setup.sh (ws_login)
  mongodb:
    container_name: ${HARNESS_PROJECT}-mongodb
  valkey:
    container_name: ${HARNESS_PROJECT}-valkey
