zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: db8944dd23b24e89a316782c21c174d0
      name: Templates/Applications
  templates:
    - uuid: 5194c4f3bc274cfb9358c328b57e7ab7
      template: 'Waystation by HTTP'
      name: 'Waystation by HTTP'
      description: |
        Waystation artifact repository, monitored with HTTP agent items against /healthz, /readyz and the
        Prometheus /metrics endpoint (Documents/Operations/MONITORING.md).

        Setup: set {$WAYSTATION.URL} to the base URL (e.g. https://registry.example.com). For /metrics either add
        the Zabbix server's or proxy's address (as the Waystation web container sees it) to
        WAYSTATION_METRICS_ALLOW_CIDRS, or set {$WAYSTATION.METRICS.TOKEN} to an API token with the "metrics"
        scope; otherwise /metrics answers 404.
      vendor:
        name: Waystation
        version: 7.0-3
      groups:
        - name: Templates/Applications
      items:
        - uuid: 2ecc2dd6bbd7415394bb2f1056e1b088
          name: 'Waystation: Liveness'
          type: HTTP_AGENT
          key: waystation.healthz
          delay: 1m
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'GET /healthz: the server process answers. "ok" when alive.'
          timeout: 5s
          url: '{$WAYSTATION.URL}/healthz'
          status_codes: ''
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
              error_handler: CUSTOM_VALUE
              error_handler_params: unavailable
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 10974ea93dc144fc9a8b2f2eb7c7b6ff
              expression: 'last(/Waystation by HTTP/waystation.healthz)<>"ok"'
              name: 'Waystation: server is down'
              event_name: 'Waystation: server is down (/healthz answered "{ITEM.LASTVALUE1}")'
              priority: HIGH
              description: 'The web tier or the server does not answer /healthz with "ok".'
              tags:
                - tag: scope
                  value: availability
            - uuid: cb1bd1da3b5f47d3b3d8d114ece63b20
              expression: 'nodata(/Waystation by HTTP/waystation.healthz,5m)=1'
              name: 'Waystation: unreachable'
              priority: HIGH
              description: 'No answer from {$WAYSTATION.URL}/healthz for 5 minutes (connection refused, DNS, TLS or a proxy in front).'
              tags:
                - tag: scope
                  value: availability
        - uuid: eb53be07901d487cbefece926b58674e
          name: 'Waystation: Readiness'
          type: HTTP_AGENT
          key: waystation.readyz
          delay: 1m
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'GET /readyz: "ok" when MongoDB and Valkey both answered within 2 s, "unavailable" (HTTP 503) otherwise.'
          timeout: 5s
          url: '{$WAYSTATION.URL}/readyz'
          status_codes: '200,503'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
              error_handler: CUSTOM_VALUE
              error_handler_params: unavailable
          tags:
            - tag: component
              value: health
          triggers:
            - uuid: 2188776dde2946b88cbc24431a690735
              expression: 'count(/Waystation by HTTP/waystation.readyz,3m,"ne","ok")>=2'
              name: 'Waystation: MongoDB or Valkey unavailable'
              priority: HIGH
              description: '/readyz reported "unavailable" at least twice in 3 minutes: the server cannot reach MongoDB or Valkey.'
              dependencies:
                - name: 'Waystation: server is down'
                  expression: 'last(/Waystation by HTTP/waystation.healthz)<>"ok"'
              tags:
                - tag: scope
                  value: availability
        - uuid: 6fcfae07ca2f4b4cac86dc5e7f4cc6a2
          name: 'Waystation: Get metrics'
          type: HTTP_AGENT
          key: waystation.metrics.get
          delay: '{$WAYSTATION.METRICS.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Raw Prometheus text from /metrics (master item; not stored).'
          timeout: 10s
          url: '{$WAYSTATION.URL}/metrics'
          headers:
            - name: Authorization
              value: 'Bearer {$WAYSTATION.METRICS.TOKEN}'
          tags:
            - tag: component
              value: raw
        - uuid: 8feac1abffc24a29973e0e8eb6b651b7
          name: 'Waystation: Requests per second'
          type: DEPENDENT
          key: waystation.requests.rate
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: req/s
          description: 'Format requests answered by the proxy engine, all repositories.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_requests_total
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: requests
        - uuid: c2a43a62c47d435f83c4c1cf767f8153
          name: 'Waystation: Requests from cache per second'
          type: DEPENDENT
          key: waystation.requests.cache.rate
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: req/s
          description: 'Requests answered from the blob store (cache states HIT, REVALIDATED, STALE).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'waystation_requests_total{cache=~"HIT|REVALIDATED|STALE"}'
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: requests
        - uuid: 630929a4207c48cea3d96e51d97f12d4
          name: 'Waystation: Upstream errors per second'
          type: DEPENDENT
          key: waystation.requests.error.rate
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: req/s
          description: 'Requests that failed because of the upstream (cache state ERROR, HTTP 502).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'waystation_requests_total{cache="ERROR"}'
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: upstream
        - uuid: 58f03447d9d24232a41f1cc9f989ba87
          name: 'Waystation: Cache hit ratio'
          type: CALCULATED
          key: waystation.cache.hit.ratio
          delay: '{$WAYSTATION.METRICS.INTERVAL}'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '100*last(//waystation.requests.cache.rate)/max(last(//waystation.requests.rate),0.000001)'
          description: 'Requests answered from cache / all requests over the last interval (0 when idle).'
          tags:
            - tag: component
              value: requests
        - uuid: 651b0a00d0f347b7a889fd4d72f5e3a6
          name: 'Waystation: Upstream error ratio'
          type: CALCULATED
          key: waystation.error.ratio
          delay: '{$WAYSTATION.METRICS.INTERVAL}'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '100*last(//waystation.requests.error.rate)/max(last(//waystation.requests.rate),0.000001)'
          description: 'Upstream errors / all requests over the last interval (0 when idle).'
          tags:
            - tag: component
              value: upstream
          triggers:
            - uuid: 3c5a62ccfb9146f18dadbb4e3bc0f646
              expression: 'min(/Waystation by HTTP/waystation.error.ratio,10m)>{$WAYSTATION.ERROR.RATIO.WARN}'
              name: 'Waystation: upstream error ratio above {$WAYSTATION.ERROR.RATIO.WARN}% for 10 minutes'
              event_name: 'Waystation: upstream error ratio {ITEM.LASTVALUE1} for 10 minutes'
              priority: AVERAGE
              description: 'Across all repositories, more than {$WAYSTATION.ERROR.RATIO.WARN}% of requests failed because of upstreams. See the per-repository triggers and the Waystation dashboard.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 50ce9deca5654ebf8d05950b65092009
          name: 'Waystation: Bytes served from cache per second'
          type: DEPENDENT
          key: waystation.bytes.out_cache.rate
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: Bps
          description: 'Bytes sent to clients from the blob store: upstream bandwidth saved.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'waystation_bytes_total{direction="out_cache"}'
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: traffic
        - uuid: 5a6870a86a6b43a5b0c54a468142c18c
          name: 'Waystation: Bytes served while fetching per second'
          type: DEPENDENT
          key: waystation.bytes.out_upstream.rate
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: Bps
          description: 'Bytes sent to clients while they were being fetched from upstream (cache misses).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'waystation_bytes_total{direction="out_upstream"}'
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: traffic
        - uuid: 82359827d76a4ea58476ee4edb4ec833
          name: 'Waystation: Bytes fetched from upstream per second'
          type: DEPENDENT
          key: waystation.bytes.in_upstream.rate
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: Bps
          description: 'Bytes downloaded from upstream registries.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'waystation_bytes_total{direction="in_upstream"}'
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: traffic
        - uuid: 8e082a252e90414f9bd5c93f72bfa6e7
          name: 'Waystation: Transfers in flight'
          type: DEPENDENT
          key: waystation.transfers.inflight
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Live transfers (cache fills and coalesced followers) right now.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_inflight_transfers
                - value
                - ''
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: traffic
          triggers:
            - uuid: 088b2bfec6784379aaddced54c6a194f
              expression: 'nodata(/Waystation by HTTP/waystation.transfers.inflight,10m)=1'
              name: 'Waystation: no metrics for 10 minutes'
              priority: WARNING
              description: '/metrics did not answer with data (the raw master item is not stored, so this watches an item derived from it). A 404 means this Zabbix server or proxy is not in WAYSTATION_METRICS_ALLOW_CIDRS.'
              dependencies:
                - name: 'Waystation: unreachable'
                  expression: 'nodata(/Waystation by HTTP/waystation.healthz,5m)=1'
              tags:
                - tag: scope
                  value: availability
        - uuid: 5b80dc150b96406385b3f0c326311ea3
          name: 'Waystation: Coalesced followers per second'
          type: DEPENDENT
          key: waystation.coalesce.followers.rate
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: '/s'
          description: 'Requests that joined another request''s upstream fetch instead of fetching again (coalescing events tail and wait).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - 'waystation_coalesce_total{event=~"tail|wait"}'
                - function
                - sum
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: requests
        - uuid: 938934014abe41129e9f11f044d752a1
          name: 'Waystation: Workers'
          type: DEPENDENT
          key: waystation.workers
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Workers with a heartbeat in the last 60 s (waystation_workers). No value while MongoDB is unavailable to the server.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_workers
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: jobs
          triggers:
            - uuid: bdbb3d6d335844ed9bc6b1f3e55733f6
              expression: 'max(/Waystation by HTTP/waystation.workers,5m)<{$WAYSTATION.WORKERS.MIN}'
              name: 'Waystation: fewer than {$WAYSTATION.WORKERS.MIN} workers for 5 minutes'
              event_name: 'Waystation: {ITEM.LASTVALUE1} live workers for 5 minutes'
              priority: HIGH
              description: 'Indexes, cleanup, statistics rollups and prefetch run in the workers. Check the worker containers (docker ps, their health status and logs).'
              tags:
                - tag: scope
                  value: availability
        - uuid: eec2b30bd1a046a1b335fae6a0e5d8a9
          name: 'Waystation: Scheduler leaders'
          type: DEPENDENT
          key: waystation.scheduler.leaders
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Live workers holding the scheduler lease (1 expected).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_scheduler_leaders
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: jobs
          triggers:
            - uuid: 2e4097d8abd54b51a8cdeca553bafe72
              expression: 'max(/Waystation by HTTP/waystation.scheduler.leaders,5m)=0'
              name: 'Waystation: no scheduler leader for 5 minutes'
              priority: AVERAGE
              description: 'No live worker holds the scheduler lease, so scheduled jobs (statistics rollups, cleanup) do not start.'
              dependencies:
                - name: 'Waystation: fewer than {$WAYSTATION.WORKERS.MIN} workers for 5 minutes'
                  expression: 'max(/Waystation by HTTP/waystation.workers,5m)<{$WAYSTATION.WORKERS.MIN}'
              tags:
                - tag: scope
                  value: availability
        - uuid: 36bc92db2a73404486529c78c08d4585
          name: 'Waystation: Jobs waiting'
          type: DEPENDENT
          key: waystation.jobs.waiting
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Jobs queued and not yet picked up by a worker, all queues.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_jobs_waiting
                - function
                - sum
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: jobs
        - uuid: 8a4404e6ef044c7ca138795792008829
          name: 'Waystation: Jobs running'
          type: DEPENDENT
          key: waystation.jobs.running
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Jobs delivered to a worker and not finished, all queues.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_jobs_running
                - function
                - sum
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: jobs
        - uuid: 39330e4251ab460184d915db684e068f
          name: 'Waystation: Oldest waiting job'
          type: DEPENDENT
          key: waystation.jobs.oldest
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: s
          description: 'Age of the oldest job not yet picked up, any queue (0 when none waits).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_jobs_oldest_waiting_seconds
                - function
                - max
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: jobs
          triggers:
            - uuid: 0879c005c2e449b3affb399d71eb7f79
              expression: 'min(/Waystation by HTTP/waystation.jobs.oldest,10m)>{$WAYSTATION.JOBS.AGE.WARN}'
              name: 'Waystation: jobs waiting longer than {$WAYSTATION.JOBS.AGE.WARN}s'
              event_name: 'Waystation: oldest waiting job is {ITEM.LASTVALUE1} old'
              priority: WARNING
              description: 'Jobs are queued but not picked up: the workers are down, stuck or overloaded (see the Workers item and the worker logs).'
              dependencies:
                - name: 'Waystation: fewer than {$WAYSTATION.WORKERS.MIN} workers for 5 minutes'
                  expression: 'max(/Waystation by HTTP/waystation.workers,5m)<{$WAYSTATION.WORKERS.MIN}'
              tags:
                - tag: scope
                  value: performance
        - uuid: 02f5b59c161141fa8afa6245225551a9
          name: 'Waystation: Dead letters'
          type: DEPENDENT
          key: waystation.jobs.dead
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Entries in the dead-letter stream: jobs that failed every attempt (kept up to about 10000).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_jobs_dead_letters
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: jobs
          triggers:
            - uuid: 19626d11d9184e29a6c4a98dd164ec77
              expression: 'change(/Waystation by HTTP/waystation.jobs.dead)>0'
              name: 'Waystation: a job was dead-lettered'
              event_name: 'Waystation: {ITEM.LASTVALUE1} dead-lettered jobs'
              priority: WARNING
              manual_close: 'YES'
              description: 'A job failed every attempt and was moved to the dead-letter stream. The worker logs say why.'
              tags:
                - tag: scope
                  value: notice
        - uuid: e85635376d3e4b799af22a618a841f27
          name: 'Waystation: Blob store free space'
          type: DEPENDENT
          key: waystation.blobstore.free
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'Free bytes on the data directory filesystem.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_blobstore_free_bytes
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: storage
        - uuid: ee558c3456e64da4b5b10e8b0ed41066
          name: 'Waystation: Blob store filesystem size'
          type: DEPENDENT
          key: waystation.blobstore.size
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'Size of the data directory filesystem.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_blobstore_size_bytes
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: storage
        - uuid: 278c77fa2a58470ebb1c1be510d8f057
          name: 'Waystation: Blob store free-space guard'
          type: DEPENDENT
          key: waystation.blobstore.min_free
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'WAYSTATION_MIN_FREE_GB in bytes: new cache and upload writes are refused below this much free space.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_blobstore_min_free_bytes
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: c0db76b87a004a78bff622ec2b95557c
              expression: 'last(/Waystation by HTTP/waystation.blobstore.free)<=last(/Waystation by HTTP/waystation.blobstore.min_free)'
              name: 'Waystation: blob store full (below the free-space guard)'
              priority: HIGH
              description: 'Free space on the data directory is at or below WAYSTATION_MIN_FREE_GB: new cache fills and uploads are refused (clients get errors for content not cached yet). Free space, run cleanup or grow the filesystem.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: cc49921db9944e22af160c73cdb81ac4
          name: 'Waystation: Blob store free space %'
          type: CALCULATED
          key: waystation.blobstore.free.pct
          delay: '{$WAYSTATION.METRICS.INTERVAL}'
          history: 7d
          value_type: FLOAT
          units: '%'
          params: '100*last(//waystation.blobstore.free)/max(last(//waystation.blobstore.size),1)'
          description: 'Free share of the data directory filesystem.'
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: a8fcb26003564d0f8c13ef0f2675fd17
              expression: 'max(/Waystation by HTTP/waystation.blobstore.free.pct,5m)<{$WAYSTATION.DISK.FREE.WARN}'
              name: 'Waystation: low disk space (below {$WAYSTATION.DISK.FREE.WARN}% free)'
              event_name: 'Waystation: low disk space ({ITEM.LASTVALUE1} free)'
              priority: WARNING
              description: 'The data directory filesystem has less than {$WAYSTATION.DISK.FREE.WARN}% free. Below WAYSTATION_MIN_FREE_GB new writes are refused.'
              dependencies:
                - name: 'Waystation: blob store full (below the free-space guard)'
                  expression: 'last(/Waystation by HTTP/waystation.blobstore.free)<=last(/Waystation by HTTP/waystation.blobstore.min_free)'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 15d5e921099f46a59e878e7bde0d2f47
          name: 'Waystation: Blob store used'
          type: DEPENDENT
          key: waystation.blobstore.used
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: B
          description: 'Bytes held by blobs (each stored once).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_blobstore_used_bytes
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: storage
        - uuid: 6d5cfd16422346feb34feaa73a6717a7
          name: 'Waystation: Blobs'
          type: DEPENDENT
          key: waystation.blobstore.blobs
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Blobs in the blob store.'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_blobstore_blobs
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: storage
        - uuid: c32ad2f96e4a42e49fb08cef56197827
          name: 'Waystation: Blob GC runs'
          type: DEPENDENT
          key: waystation.gc.runs
          delay: '0'
          history: 7d
          value_type: FLOAT
          description: 'Blob GC runs completed (running total of the installation, from Valkey maintenance:totals).'
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - waystation_gc_runs_total
                - value
                - ''
              error_handler: DISCARD_VALUE
          master_item:
            key: waystation.metrics.get
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: 3d78a842236e4d2395526e65c26b3451
              expression: 'count(/Waystation by HTTP/waystation.gc.runs,1h:now-1d)>0 and (max(/Waystation by HTTP/waystation.gc.runs,1d)-min(/Waystation by HTTP/waystation.gc.runs,1d))<1'
              name: 'Waystation: blob GC has not run for a day'
              priority: WARNING
              description: 'No blob GC run completed in the last 24 hours (the built-in schedule runs it every 6 hours), so deleted and unreferenced blobs are not freed. Check the workers, the scheduler leader and the blob.gc job runs. Disable this trigger if the GC schedule was deliberately set longer than a day.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 8460ed00f1394128868701e10b601199
          name: 'Waystation: Bytes freed by blob GC per second'
