            - uuid: be8fea57cc0c497aba9569795e03b9d4
              name: 'Waystation: {#REPO}: Cache hit ratio'
              type: CALCULATED
              key: 'waystation.repo.cache.hit.ratio["{#REPO}"]'
              delay: '{$WAYSTATION.METRICS.INTERVAL}'
              history: 7d
              value_type: FLOAT
              units: '%'
              params: '100*last(//waystation.repo.requests.cache.rate["{#REPO}"])/max(last(//waystation.repo.requests.rate["{#REPO}"]),0.000001)'
              tags:
                - tag: component
                  value: requests
                - tag: repository
                  value: '{#REPO}'
            - uuid: 1ff29aad36604b498005ce48248c726c
              name: 'Waystation: {#REPO}: Upstream error ratio'
              type: CALCULATED
              key: 'waystation.repo.error.ratio["{#REPO}"]'
              delay: '{$WAYSTATION.METRICS.INTERVAL}'
              history: 7d
              value_type: FLOAT
              units: '%'
              params: '100*last(//waystation.repo.requests.error.rate["{#REPO}"])/max(last(//waystation.repo.requests.rate["{#REPO}"]),0.000001)'
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
              trigger_prototypes:
                - uuid: a2c09f8c26114729b40863e254c038fb
                  expression: 'min(/Waystation by HTTP/waystation.repo.error.ratio["{#REPO}"],5m)>={$WAYSTATION.UPSTREAM.ERROR.HIGH}'
                  name: 'Waystation: upstream of {#REPO} is down'
                  event_name: 'Waystation: upstream of {#REPO} is down (error ratio {ITEM.LASTVALUE1} for 5 minutes)'
                  priority: HIGH
                  description: 'At least {$WAYSTATION.UPSTREAM.ERROR.HIGH}% of requests to {#REPO} failed because of its upstream for 5 minutes. Cached content is still served (stale-on-error); new content is not.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: repository
                      value: '{#REPO}'
                - uuid: 5fd6d8b5f0bc40a08940fcea2963c3d8
                  expression: 'min(/Waystation by HTTP/waystation.repo.error.ratio["{#REPO}"],5m)>{$WAYSTATION.UPSTREAM.ERROR.WARN}'
                  name: 'Waystation: upstream of {#REPO} is degraded'
                  event_name: 'Waystation: upstream of {#REPO} is degraded (error ratio {ITEM.LASTVALUE1} for 5 minutes)'
                  priority: WARNING
                  description: 'More than {$WAYSTATION.UPSTREAM.ERROR.WARN}% of requests to {#REPO} failed because of its upstream for 5 minutes.'
                  dependencies:
                    - name: 'Waystation: upstream of {#REPO} is down'
                      expression: 'min(/Waystation by HTTP/waystation.repo.error.ratio["{#REPO}"],5m)>={$WAYSTATION.UPSTREAM.ERROR.HIGH}'
                  tags:
                    - tag: scope
                      value: performance
                    - tag: repository
                      value: '{#REPO}'
            - uuid: 976c772b953345a39cba6703401efdea
              name: 'Waystation: {#REPO}: Bytes served from cache per second'
