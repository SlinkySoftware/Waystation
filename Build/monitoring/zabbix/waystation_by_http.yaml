          triggers:
            - uuid: 863a0131e85046c6b12bcd1442c78191
              expression: 'max(/Waystation by HTTP/waystation.metrics.sources.up,10m)=0'
              name: 'Waystation: cluster figures unavailable for 10 minutes'
              priority: WARNING
              description: 'The server could not read Valkey, MongoDB or the data filesystem while answering /metrics, so worker, job, storage or upstream figures are missing.'
              dependencies:
                - name: 'Waystation: MongoDB or Valkey unavailable'
                  expression: 'count(/Waystation by HTTP/waystation.readyz,3m,"ne","ok")>=2'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: e29d3f9490224ca89109f6bffaa0e93a
          name: 'Repositories discovery'
          type: DEPENDENT
          key: waystation.repo.discovery
          delay: '0'
          description: 'Repositories that have answered requests since the server started (labels of waystation_requests_total).'
          lifetime: 7d
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - waystation_requests_total
              error_handler: CUSTOM_VALUE
              error_handler_params: '[]'
            - type: JAVASCRIPT
              parameters:
                - |
                  var seen = {}, out = [];
                  JSON.parse(value).forEach(function (m) {
                      var repo = m.labels && m.labels.repo;
                      if (repo && !seen[repo]) {
                          seen[repo] = true;
                          out.push({'{#REPO}': repo, '{#FORMAT}': m.labels.format || ''});
                      }
                  });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: waystation.metrics.get
          item_prototypes:
            - uuid: ee2e12c3a5834366b9c2eefdfe42c2e1
              name: 'Waystation: {#REPO}: Requests per second'
              type: DEPENDENT
              key: 'waystation.repo.requests.rate["{#REPO}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: req/s
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_requests_total{repo="{#REPO}"}'
                    - function
                    - sum
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: requests
                - tag: repository
                  value: '{#REPO}'
            - uuid: 97c5813c5ec0413b8b8563f1839470ca
              name: 'Waystation: {#REPO}: Requests from cache per second'
              type: DEPENDENT
              key: 'waystation.repo.requests.cache.rate["{#REPO}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: req/s
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_requests_total{repo="{#REPO}",cache=~"HIT|REVALIDATED|STALE"}'
                    - function
                    - sum
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: requests
                - tag: repository
                  value: '{#REPO}'
            - uuid: f085fef505ff4a1c8f7a77668d7add4f
              name: 'Waystation: {#REPO}: Upstream errors per second'
              type: DEPENDENT
              key: 'waystation.repo.requests.error.rate["{#REPO}"]'
              delay: '0'
