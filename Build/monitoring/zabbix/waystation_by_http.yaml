                - tag: component
                  value: traffic
                - tag: repository
                  value: '{#REPO}'
            - uuid: 4d04eb907a0545bcb9f1383498818dd7
              name: 'Waystation: {#REPO}: Bytes fetched from upstream per second'
              type: DEPENDENT
              key: 'waystation.repo.bytes.in_upstream.rate["{#REPO}"]'
              delay: '0'
