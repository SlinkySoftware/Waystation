              name: 'Waystation: API slower than {$WAYSTATION.API.LATENCY.WARN}s on average for 10 minutes'
              event_name: 'Waystation: API latency {ITEM.LASTVALUE1} for 10 minutes'
              priority: WARNING
              description: 'REST API requests take longer than usual: MongoDB or Valkey slow or overloaded, or the server is CPU-bound.'
              tags:
