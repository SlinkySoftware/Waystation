          triggers:
            - uuid: 3376144b6884469c80e1e45a5ef4e08a
              expression: 'max(/Waystation by HTTP/waystation.storage.refusals.rate,5m)>0'
              name: 'Waystation: writes refused for lack of disk space'
              priority: AVERAGE
              description: 'The free-space guard refused cache or upload writes in the last 5 minutes.'
              dependencies:
                - name: 'Waystation: blob store full (below the free-space guard)'
