                - tag: repository
                  value: '{#REPO}'
            - uuid: 8b9c6259e21945e099f97760bfe95bdb
              name: 'Waystation: {#REPO}: Upstream latency sum per second'
              type: DEPENDENT
              key: 'waystation.repo.upstream.latency.sum.rate["{#REPO}"]'
              delay: '0'
              history: 1d
              value_type: FLOAT
              description: 'Helper for the average upstream latency.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_upstream_latency_seconds_sum{repo="{#REPO}"}'
                    - function
                    - sum
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
            - uuid: 10b0aa94272e46da978294f72aafdaaa
              name: 'Waystation: {#REPO}: Upstream responses per second'
              type: DEPENDENT
              key: 'waystation.repo.upstream.latency.count.rate["{#REPO}"]'
              delay: '0'
              history: 1d
              value_type: FLOAT
              units: '/s'
              description: 'Upstream requests that received response headers.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_upstream_latency_seconds_count{repo="{#REPO}"}'
                    - function
                    - sum
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
            - uuid: 083fc467bcc147fd9e780b97ef0e429d
              name: 'Waystation: {#REPO}: Upstream latency (average)'
              type: CALCULATED
              key: 'waystation.repo.upstream.latency.avg["{#REPO}"]'
              delay: '{$WAYSTATION.METRICS.INTERVAL}'
              history: 7d
              value_type: FLOAT
              units: s
              params: 'last(//waystation.repo.upstream.latency.sum.rate["{#REPO}"])/max(last(//waystation.repo.upstream.latency.count.rate["{#REPO}"]),0.000001)'
              description: 'Average time from an upstream request to its response headers over the last interval (0 when idle).'
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
        - uuid: 1455973f83894983ad1bc58c36300d20
          name: 'Upstreams discovery'
          type: DEPENDENT
          key: waystation.upstream.discovery
          delay: '0'
          description: 'Proxy repositories (labels of waystation_upstream_state), whether or not they answered requests yet.'
          lifetime: 7d
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - waystation_upstream_state
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var out = [];
                  JSON.parse(value).forEach(function (m) {
                      if (m.labels && m.labels.repo) {
                          out.push({'{#REPO}': m.labels.repo});
                      }
                  });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: waystation.metrics.get
          item_prototypes:
            - uuid: f929412218154e0da990e01c996c6f18
              name: 'Waystation: {#REPO}: Upstream state'
              type: DEPENDENT
              key: 'waystation.upstream.state["{#REPO}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              description: 'Upstream state as shown in the Waystation UI: 0 ok, 1 degraded (failed in the last 10 minutes, no success since), 2 blocked, 3 offline (switched offline by an administrator).'
              valuemap:
                name: 'Waystation upstream state'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_upstream_state{repo="{#REPO}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
              trigger_prototypes:
                - uuid: af2a3029edda43b180aecc7b2b555f4a
                  expression: 'last(/Waystation by HTTP/waystation.upstream.state["{#REPO}"])=2'
                  name: 'Waystation: upstream of {#REPO} is blocked'
                  priority: HIGH
                  description: 'Waystation stopped contacting the upstream of {#REPO}. Cached content is still served; new content is not.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: repository
                      value: '{#REPO}'
                - uuid: 4591982633734dbe93fcc8ac9f5adb0c
                  expression: 'min(/Waystation by HTTP/waystation.upstream.state["{#REPO}"],{$WAYSTATION.UPSTREAM.STATE.PERIOD})=1'
                  name: 'Waystation: upstream of {#REPO} is failing'
                  event_name: 'Waystation: upstream of {#REPO} is failing for {$WAYSTATION.UPSTREAM.STATE.PERIOD}'
                  priority: WARNING
                  description: 'Requests to the upstream of {#REPO} have failed, without a success since, for {$WAYSTATION.UPSTREAM.STATE.PERIOD} (state degraded). The repository''s Upstream health in the Waystation UI shows the last error.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: repository
                      value: '{#REPO}'
                - uuid: e01aa59f0646437db65aaef2e0e80084
                  expression: 'last(/Waystation by HTTP/waystation.upstream.state["{#REPO}"])=3'
                  name: 'Waystation: {#REPO} is offline'
                  priority: INFO
                  description: 'An administrator switched {#REPO} offline: it serves only what is cached.'
                  tags:
                    - tag: scope
                      value: notice
                    - tag: repository
                      value: '{#REPO}'
            - uuid: 91d68cfec01e4f548c92f5541f93d39d
              name: 'Waystation: {#REPO}: Upstream consecutive failures'
              type: DEPENDENT
              key: 'waystation.upstream.failures["{#REPO}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              description: 'Upstream failures since its last success.'
              preprocessing:
