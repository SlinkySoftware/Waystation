                  parameters:
                    - 'waystation_requests_total{repo="{#REPO}",cache="ERROR"}'
                    - function
                    - sum
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
