                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
            - uuid: 82d00fbd9c2542d094062609da6af2d0
              name: 'Waystation: {#REPO}: Upstream rate limit'
              type: DEPENDENT
              key: 'waystation.upstream.ratelimit.limit["{#REPO}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              description: 'Latest rate limit the upstream reported (Docker Hub ratelimit-limit). No data when the upstream reports none.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_upstream_ratelimit_limit{repo="{#REPO}"}'
                    - value
