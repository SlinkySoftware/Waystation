                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
            - uuid: d4bcb20f43bf4a5e97d80461e93ebb6b
              name: 'Waystation: {#REPO}: Upstream rate limit remaining'
              type: DEPENDENT
              key: 'waystation.upstream.ratelimit.remaining["{#REPO}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              description: 'Latest remaining requests the upstream reported (Docker Hub ratelimit-remaining). No data when the upstream reports none.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_upstream_ratelimit_remaining{repo="{#REPO}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: upstream
                - tag: repository
                  value: '{#REPO}'
              trigger_prototypes:
                - uuid: a72ceedb78f34262bfa31990762ea17d
                  expression: 'last(/Waystation by HTTP/waystation.upstream.ratelimit.remaining["{#REPO}"])<last(/Waystation by HTTP/waystation.upstream.ratelimit.limit["{#REPO}"])*{$WAYSTATION.RATELIMIT.REMAINING.WARN}/100'
                  name: 'Waystation: {#REPO}: upstream rate limit below {$WAYSTATION.RATELIMIT.REMAINING.WARN}%'
                  event_name: 'Waystation: {#REPO}: {ITEM.LASTVALUE1} upstream requests left of {ITEM.LASTVALUE2}'
                  priority: WARNING
                  description: 'The upstream (Docker Hub) will soon refuse pulls of content not cached yet. Configure upstream credentials with a higher limit, or prefetch less.'
                  tags:
                    - tag: scope
                      value: capacity
                    - tag: repository
                      value: '{#REPO}'
        - uuid: 56ff597c1fef45ce98b24ac394984482
          name: 'Job queues discovery'
          type: DEPENDENT
          key: waystation.queue.discovery
          delay: '0'
          description: 'Job queues (labels of waystation_jobs_waiting).'
          lifetime: 7d
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - waystation_jobs_waiting
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - |
                  var out = [];
                  JSON.parse(value).forEach(function (m) {
                      if (m.labels && m.labels.queue) {
                          out.push({'{#QUEUE}': m.labels.queue});
                      }
                  });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: waystation.metrics.get
          item_prototypes:
            - uuid: bc05cfa87e7a493aa70c38712f5ef5d3
              name: 'Waystation: queue {#QUEUE}: Jobs waiting'
              type: DEPENDENT
              key: 'waystation.queue.waiting["{#QUEUE}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_jobs_waiting{queue="{#QUEUE}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: jobs
                - tag: queue
                  value: '{#QUEUE}'
            - uuid: 26aafbbee1aa4f23a61fd4b664b5a55b
              name: 'Waystation: queue {#QUEUE}: Jobs running'
              type: DEPENDENT
              key: 'waystation.queue.running["{#QUEUE}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_jobs_running{queue="{#QUEUE}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: jobs
                - tag: queue
                  value: '{#QUEUE}'
            - uuid: 90d2bead039440b6878a53733fd729d2
              name: 'Waystation: queue {#QUEUE}: Jobs delayed'
              type: DEPENDENT
              key: 'waystation.queue.delayed["{#QUEUE}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              description: 'Jobs waiting for a retry backoff or a later start time.'
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_jobs_delayed{queue="{#QUEUE}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: jobs
                - tag: queue
                  value: '{#QUEUE}'
            - uuid: 127b7d984ce94e65af5becb061b95300
              name: 'Waystation: queue {#QUEUE}: Oldest waiting job'
              type: DEPENDENT
              key: 'waystation.queue.oldest["{#QUEUE}"]'
              delay: '0'
              history: 7d
              value_type: FLOAT
              units: s
              preprocessing:
                - type: PROMETHEUS_PATTERN
                  parameters:
                    - 'waystation_jobs_oldest_waiting_seconds{queue="{#QUEUE}"}'
                    - value
                    - ''
                  error_handler: DISCARD_VALUE
              master_item:
                key: waystation.metrics.get
              tags:
                - tag: component
                  value: jobs
                - tag: queue
                  value: '{#QUEUE}'
      tags:
        - tag: class
          value: application
        - tag: target
          value: waystation
      macros:
        - macro: '{$WAYSTATION.URL}'
          value: 'https://registry.example.com'
          description: 'Waystation base URL (WAYSTATION_BASE_URL), no trailing slash.'
        - macro: '{$WAYSTATION.METRICS.TOKEN}'
          type: SECRET_TEXT
          description: 'API token with the "metrics" scope (owner holds stats-read). Leave empty when this Zabbix server or proxy is in WAYSTATION_METRICS_ALLOW_CIDRS.'
        - macro: '{$WAYSTATION.METRICS.INTERVAL}'
          value: 1m
          description: 'How often /metrics is scraped and the ratios are computed.'
        - macro: '{$WAYSTATION.ERROR.RATIO.WARN}'
          value: '5'
          description: 'Overall upstream error ratio (%) that raises a trigger after 10 minutes.'
        - macro: '{$WAYSTATION.UPSTREAM.ERROR.WARN}'
          value: '10'
          description: 'Per-repository upstream error ratio (%) for "degraded" after 5 minutes.'
        - macro: '{$WAYSTATION.UPSTREAM.ERROR.HIGH}'
          value: '50'
          description: 'Per-repository upstream error ratio (%) for "down" after 5 minutes.'
        - macro: '{$WAYSTATION.UPSTREAM.STATE.PERIOD}'
          value: 10m
          description: 'How long an upstream must stay degraded (failing, no success since) before "upstream is failing" fires.'
        - macro: '{$WAYSTATION.RATELIMIT.REMAINING.WARN}'
          value: '10'
          description: 'Upstream rate limit left (% of the limit) below which a trigger fires (Docker Hub).'
        - macro: '{$WAYSTATION.WORKERS.MIN}'
          value: '1'
          description: 'Fewest live workers expected.'
        - macro: '{$WAYSTATION.JOBS.AGE.WARN}'
          value: '1800'
          description: 'Age (seconds) of the oldest waiting job that raises a trigger after 10 minutes.'
        - macro: '{$WAYSTATION.DISK.FREE.WARN}'
          value: '15'
          description: 'Free space (% of the data filesystem) below which "low disk space" fires.'
        - macro: '{$WAYSTATION.API.LATENCY.WARN}'
          value: '1'
          description: 'Average REST API latency (seconds) that raises a trigger after 10 minutes.'
      valuemaps:
        - uuid: 7da7e917e11a46649a3a5f45d22a001b
          name: 'Waystation upstream state'
          mappings:
            - value: '0'
              newvalue: OK
            - value: '1'
              newvalue: Degraded
            - value: '2'
              newvalue: Blocked
            - value: '3'
              newvalue: Offline
