        - uuid: 3498463ea42049f8880f210d6a743eae
          name: 'Waystation: API latency (average)'
          type: CALCULATED
          key: waystation.api.latency.avg
          delay: '{$WAYSTATION.METRICS.INTERVAL}'
          history: 7d
          value_type: FLOAT
          units: s
