# Waystation web tier: main nginx config. The site config is rendered at start from
# /etc/nginx/templates/waystation.conf.template into /tmp/nginx-conf/ (root filesystem stays read-only).
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # JSON access log. Never log Authorization or Cookie headers, nor query strings (they can carry tokens).
    log_format waystation escape=json
        '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time","request_id":"$request_id","ua":"$http_user_agent"}';
    access_log /dev/stdout waystation;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    include /tmp/nginx-conf/*.conf;
}
