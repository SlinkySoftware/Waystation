# authentik test configuration for `make test-integration-authentik` (T-A02): an OAuth2/OpenID provider and
# application for Waystation, a group and a user. Throwaway values and documentation names only. Applied by the test
# once authentik's default flows and its self-signed key exist (test_oidc_providers_integration.authentik_ready).
version: 1
metadata:
  name: Waystation test
entries:
  - model: authentik_core.group
    id: ops
    identifiers:
      name: ops
    attrs:
      name: ops
  - model: authentik_core.user
    identifiers:
      username: alice
    attrs:
      name: Alice Example
      email: alice@example.com
      path: users
      password: Alice-Passw0rd1
      groups:
        - !KeyOf ops
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: waystation
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: waystation
      client_secret: waystation-test-client-secret
      redirect_uris:
        - matching_mode: regex
          url: 'https://registry\.example\.com/auth/oidc/.*'
        - matching_mode: strict
          url: https://registry.example.com/ui/sign-in
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    identifiers:
      slug: waystation
    attrs:
      name: Waystation
      provider: !KeyOf provider
