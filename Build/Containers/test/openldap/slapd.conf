# OpenLDAP test directory with a FreeIPA-like tree (make test-integration). Throwaway values only.
include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/nis.schema
include /etc/ldap/schema/inetorgperson.schema

modulepath /usr/lib/ldap
moduleload back_mdb
moduleload memberof
moduleload refint
moduleload ppolicy

pidfile /run/slapd/slapd.pid
argsfile /run/slapd/slapd.args

# TLS (StartTLS on 389, LDAPS on 636); the entrypoint copies the generated certificate here.
#TLS TLSCACertificateFile /run/slapd/tls/ca.crt
#TLS TLSCertificateFile /run/slapd/tls/server.crt
#TLS TLSCertificateKeyFile /run/slapd/tls/server.key

database mdb
maxsize 104857600
suffix "dc=example,dc=com"
rootdn "cn=Manager,dc=example,dc=com"
directory /var/lib/ldap
index objectClass eq
index uid,cn,member,memberOf eq

overlay memberof
memberof-group-oc groupOfNames
memberof-member-ad member
memberof-memberof-ad memberOf
memberof-refint TRUE

overlay refint
refint_attributes member

overlay ppolicy
ppolicy_default "cn=default,ou=policies,dc=example,dc=com"

# Root DSE (StartTLS/supportedExtension discovery).
access to dn.base="" by * read
access to dn.base="cn=Subschema" by * read
# Passwords: only for binding (and the owner may change their own).
access to attrs=userPassword
  by self =xw
  by anonymous auth
  by * none
# Everything else: the service account and signed-in users may read; anonymous may not.
access to dn.subtree="dc=example,dc=com"
  by dn.exact="uid=waystation-svc,cn=sysaccounts,cn=etc,dc=example,dc=com" read
  by users read
  by * none
