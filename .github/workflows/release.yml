# Release images (T-F03, Documents/Operations/CI.md): a `vX.Y.Z` tag builds the server, worker and web images for
# linux/amd64 and linux/arm64 and pushes them to GHCR with an SBOM and SLSA provenance attached to each image index,
# plus a GitHub artifact attestation. Uses only GITHUB_TOKEN. Actions are pinned by commit SHA.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: ${{ matrix.role }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        role: [server, worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cat VERSION)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match VERSION $version (make set-version V=X.Y.Z)"
            exit 1
          fi
      - name: Image name (registry paths are lower case)
        id: image
        env:
          ROLE: ${{ matrix.role }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/waystation-${ROLE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Build/Containers/${{ matrix.role }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.role }}
          cache-to: type=gha,scope=release-${{ matrix.role }},mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
