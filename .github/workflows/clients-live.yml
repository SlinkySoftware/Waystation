# Nightly live-upstream smoke for the real-client harness (SPECIFICATION §11, tests/clients/README.md).
# Runs every format's client script against the live upstreams through the fake upstream in `live` mode (forward,
# store nothing). PR-time replay runs and the rest of CI arrive with T-F03.
name: clients-live

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Live-upstream client smoke (all formats)
        run: make clients-test FORMAT=all MODE=live
