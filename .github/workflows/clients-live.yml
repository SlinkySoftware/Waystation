# Nightly live-upstream smoke for the real-client harness (SPECIFICATION §11, tests/clients/README.md).
# Runs every format's client script against the live upstreams through the fake upstream in `live` mode (forward,
# store nothing). PR-time replay runs are in ci.yml.
name: clients-live

on:
  # Manual only: GitHub Actions cost money (no nightly schedule).
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Live-upstream client smoke (all formats)
        run: make clients-test FORMAT=all MODE=live
