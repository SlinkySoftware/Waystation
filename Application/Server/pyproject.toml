[project]
name = "waystation-server"
version = "0.1.0"
description = "Waystation server: format protocols, REST API, SSE, data plane."
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
dependencies = ["waystation-common", "fastapi>=0.120", "uvicorn[standard]>=0.38", "httpx[http2]>=0.28", "argon2-cffi>=25.1", "prometheus-client>=0.23", "ldap3>=2.9", "joserfc>=1.3", "defusedxml>=0.7"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
