  # ---------------------------------------------------------------- tasks and workers (T-O04; all need `admin`)
  /tasks/scheduled:
    get:
      tags: [tasks]
      operationId: listScheduledTasks
      summary: Scheduled tasks (job definitions) with their schedule, last run and next fire (needs `admin`)
      responses:
        '200':
          description: Tasks by id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledTaskList' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/scheduled/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    patch:
      tags: [tasks]
      operationId: updateScheduledTask
      summary: Change a task's schedule or enable / disable it (needs `admin`)
      description: |
        A changed schedule (or re-enabling) restarts the task's timer: the next fire is derived from the new
        schedule, missed fires do not run. A cleanup policy's schedule belongs to the policy (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledTaskUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledTask' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /tasks/scheduled/{task_id}/run:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [tasks]
      operationId: runScheduledTask
      summary: Run a scheduled task now (a worker job; needs `admin`)
      responses:
        '202':
          description: Queued (or merged into a pending run of the same task)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /tasks/runs:
    get:
      tags: [tasks]
      operationId: listJobRuns
      summary: Job runs (one per attempt), newest first (needs `admin`)
      description: Routine housekeeping (the 10 s stats rollup) is left out unless `include_routine`, `task` or `job` is given.
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 5
            items: { $ref: '#/components/schemas/RunStatus' }
        - name: kind
          in: query
          schema: { type: string, maxLength: 64 }
        - name: queue
          in: query
          schema: { $ref: '#/components/schemas/JobQueue' }
        - name: task
          in: query
          description: Runs of one scheduled task
          schema: { type: string, maxLength: 128 }
        - name: job
          in: query
          description: Attempts of one job
          schema: { type: string, maxLength: 64 }
        - name: include_routine
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: A page of runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRunPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /tasks/runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [tasks]
      operationId: getJobRun
      summary: One run with its progress, result and log (the last 500 lines; needs `admin`)
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRun' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tasks/workers:
    get:
      tags: [tasks]
      operationId: getWorkers
      summary: Workers (host, version, queues, running jobs, heartbeat), queue figures and the dead-letter count (needs `admin`)
      responses:
        '200':
          description: Workers and queues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerOverview' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/dead-letters:
    get:
      tags: [tasks]
      operationId: listDeadLetters
      summary: Jobs that ran out of attempts, newest first (needs `admin`)
      parameters:
        - name: cursor
          in: query
          description: The last entry id of the previous page
          schema: { type: string, pattern: '^\d{1,20}-\d{1,20}$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: A page of dead letters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadLetterPage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tasks/dead-letters/{letter_id}:
    parameters:
      - $ref: '#/components/parameters/LetterId'
    delete:
      tags: [tasks]
      operationId: discardDeadLetter
      summary: Discard a dead letter (idempotent; needs `admin`)
      responses:
        '204': { description: Discarded (or already gone) }

  /tasks/dead-letters/{letter_id}/retry:
    parameters:
      - $ref: '#/components/parameters/LetterId'
    post:
      tags: [tasks]
      operationId: retryDeadLetter
      summary: Queue a dead-lettered job again with fresh attempts (idempotent; needs `admin`)
      description: |
        The dead letter is removed and its work queued as a new job (attempt counting starts again; the usual dedupe
        applies). Retrying the same dead letter again answers `merged` with the job the first retry queued.
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /webhooks:
    get:
      tags: [webhooks]
      operationId: listWebhooks
      summary: Webhooks by name with their latest delivery, and the events they can subscribe to (needs `admin`)
      responses:
        '200':
          description: Webhooks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [webhooks]
      operationId: createWebhook
      summary: Create a webhook (needs `admin`; audited as `webhook.create`)
      description: |
        `secret` is required and write-only (AES-GCM at rest under `WAYSTATION_SECRET_KEYS`); custom header values
        are write-only too. A URL with a literal private or reserved address needs `allow_private`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /webhooks/{webhook_id}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [webhooks]
      operationId: getWebhook
      summary: One webhook
      responses:
        '200':
          description: The webhook
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [webhooks]
      operationId: updateWebhook
      summary: Replace a webhook (null `secret` / `headers` keep the stored ones; audited as `webhook.update`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook and its delivery log (pending deliveries are dropped; audited as `webhook.delete`)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/test:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [webhooks]
      operationId: testWebhook
      summary: Send a `webhook.ping` event now (one attempt, whether the webhook is on or off; audited as `webhook.test`)
      responses:
        '202':
          description: The delivery was recorded and a worker attempts it within seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [webhooks]
      operationId: listWebhookDeliveries
      summary: The delivery log, newest first (kept 30 days)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WebhookDeliveryStatus' }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Deliveries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/deliveries/{delivery_id}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
      - $ref: '#/components/parameters/DeliveryId'
    get:
      tags: [webhooks]
      operationId: getWebhookDelivery
      summary: One delivery with the request it sends and every attempt (status, latency, the first KiB of the answer)
      responses:
        '200':
          description: The delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/{webhook_id}/deliveries/{delivery_id}/redeliver:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
      - $ref: '#/components/parameters/DeliveryId'
    post:
      tags: [webhooks]
      operationId: redeliverWebhookDelivery
      summary: Send a delivery's document again as a new delivery (same event id; audited as `webhook.redeliver`)
      responses:
        '202':
          description: The new delivery was recorded and a worker attempts it within seconds
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDeliveryAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search packages, images and files across every repository the principal can browse
      description: |
        Name search: `q` is `<name prefix>[ <version prefix>]`, case-insensitive; the name prefix matches a full name
        or its last `/` segment (`nginx` finds `library/nginx`, `node` finds `@types/node`). Sources: docker tags,
        npm packages, apt and yum index listings, cached files (by file name; not docker layers). Results are ordered
        by the matched name. An empty `q` lists everything.
        Digest search: `sha256:<8-64 hex digits>` or 64 hex digits finds every cached file with that blob in any
        repository and format, and the docker tags pointing at it.
        Hidden repositories are never searched: they appear in no result, count or facet value.
        Facets (first page): counts per value with every other filter applied.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 256, default: '' }
        - name: format
          in: query
          description: Repeat to select several (OR)
          schema:
            type: array
            maxItems: 20
            items: { $ref: '#/components/schemas/Format' }
        - name: repository
          in: query
          description: Repository names; repeat to select several (OR)
          schema:
            type: array
            maxItems: 50
            items: { type: string }
        - name: kind
          in: query
          schema:
            type: array
            maxItems: 3
            items: { $ref: '#/components/schemas/SearchKind' }
        - name: type
          in: query
          description: Repository types
          schema:
            type: array
            maxItems: 3
            items: { $ref: '#/components/schemas/RepositoryType' }
        - name: cached
          in: query
          description: Only what is in the cache (leaves out apt/yum index listings; downloaded packages are still found as files)
          schema: { type: boolean, default: false }
        - name: facets
          in: query
          description: Facet counts on the first page
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: One page of results (and facets on the first page)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400':
          description: Invalid cursor
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /stats/summary:
    get:
      tags: [stats]
      operationId: getStatsSummary
      summary: Dashboard KPIs with a sparkline per KPI over the range
      parameters:
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          description: KPI summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSummary' }

  /stats/traffic:
    get:
      tags: [stats]
      operationId: getTraffic
      summary: Traffic over time, split by cache (hit vs upstream) or by format
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/TrafficMetric'
        - name: split
          in: query
          schema: { type: string, enum: [cache, format], default: cache }
        - name: repo
          in: query
          description: Restrict to one repository
          schema: { type: string }
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSeries' }

  /stats/storage:
    get:
      tags: [stats]
      operationId: getStorage
      summary: Data directory usage and stored bytes by format and repository
      responses:
        '200':
          description: Storage summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSummary' }

  /storage/guard:
    get:
      tags: [stats]
      operationId: getStorageGuard
      summary: The low-disk guard's settings and live state (any signed-in user; the UI shows a banner while it is tripped)
      responses:
        '200':
          description: Guard settings, free space and whether new writes are refused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageGuard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [admin]
      operationId: updateStorageGuard
      summary: Change the low-disk guard (needs `settings-admin`; every replica applies it within seconds)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageGuardSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageGuard' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /stats/upstreams:
    get:
      tags: [stats]
      operationId: listUpstreamHealth
      summary: Health of every proxy repository's upstream (incl. Docker Hub rate limit)
      responses:
        '200':
          description: One entry per proxy repository
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UpstreamHealth' }

  /transfers:
    get:
      tags: [live]
      operationId: listTransfers
      summary: Current in-flight transfers (the state a client loads before following the event stream)
      parameters:
        - { name: repo, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { $ref: '#/components/schemas/Format' } }
      responses:
        '200':
          description: Active transfers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferList' }

  /activity:
    get:
      tags: [live]
      operationId: listActivity
      summary: Recent activity, newest first
      description: |
        Filters combine (AND). A page holds at most `limit` events; with a sparse filter it may hold fewer while
        `next_cursor` is still set (the server bounds how much history one call reads), so keep paging until
        `next_cursor` is null. Only repositories the caller may see are included.
      parameters:
        - $ref: '#/components/parameters/ActivityRepo'
        - $ref: '#/components/parameters/ActivityKindParam'
        - $ref: '#/components/parameters/ActivityFormat'
        - $ref: '#/components/parameters/ActivityPrincipal'
        - $ref: '#/components/parameters/ActivityCache'
        - $ref: '#/components/parameters/ActivityOutcome'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /activity/export:
    get:
      tags: [live]
      operationId: exportActivity
      summary: The filtered activity as CSV (download)
      description: |
        Same filters as `GET /activity`, streamed newest first as `text/csv` (UTF-8, CRLF, header row:
        `time,kind,outcome,repository,format,artifact,path,principal,cache,bytes,duration_ms,summary,id`), at most
        100,000 rows. Text cells that a spreadsheet would read as a formula are prefixed with `'`.
      parameters:
        - $ref: '#/components/parameters/ActivityRepo'
        - $ref: '#/components/parameters/ActivityKindParam'
        - $ref: '#/components/parameters/ActivityFormat'
        - $ref: '#/components/parameters/ActivityPrincipal'
        - $ref: '#/components/parameters/ActivityCache'
        - $ref: '#/components/parameters/ActivityOutcome'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
      responses:
        '200':
          description: 'CSV file, sent as an attachment'
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /events/stream:
    get:
      tags: [live]
      operationId: streamEvents
      summary: Server-Sent Events stream (live transfers, stats ticks, activity)
      description: |
        One long-lived `text/event-stream` per browser tab. Topics (comma-separated `topics` query parameter):
        `transfers` (live transfer state), `stats` (1 Hz KPI ticks), `activity` (durable events),
        `tasks` (job runs: `job.update`, `job.progress`, `job.log`; workers: `worker.update`; needs `admin`, 403
        otherwise), `repo:<name>` (transfers and activity restricted to one repository). Every topic is RBAC-filtered
        per subscriber.

        Framing: each message has `event: <LiveEvent.type>` and `data: <JSON LiveEvent>`. Only events from the
        durable activity stream carry an `id:`; send it back as `Last-Event-ID` on reconnect to resume. Live
        transfer state is not replayed: on (re)connect the server first sends one `transfers.snapshot` event with the
        current state of every in-flight transfer. `transfer.progress` is coalesced to at most 4 Hz per transfer.
        A comment line (`: hb`) is sent every 15 s as a heartbeat. The server suggests `retry: 3000`.
      parameters:
        - name: topics
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, pattern: '^(transfers|stats|activity|tasks|repo:[A-Za-z0-9][A-Za-z0-9._-]{1,62})$' }
        - name: Last-Event-ID
          in: header
          description: Sent by the browser on automatic reconnects
          schema: { type: string }
        - name: last_event_id
          in: query
          description: Same as the header, for clients that reopen the stream themselves (EventSource cannot set headers)
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Event stream. The payload of each `data:` line is a `LiveEvent`.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/LiveEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /provisioning:
    get:
      tags: [admin]
      operationId: getProvisioning
      summary: Whether a provisioning file is configured and how its last apply went (needs `admin`)
      responses:
        '200':
          description: Provisioning status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /provisioning/plan:
    post:
      tags: [admin]
      operationId: planProvisioning
      summary: What applying the configured provisioning file would change (needs `admin`; nothing is written)
      description: |
        Always the file named by `WAYSTATION_PROVISION_FILE` (no document is accepted). Items are `create`, `update`
        (with field changes), `unchanged` or `prune`; a changed secret appears only as `redacted`. An invalid file
        (`valid: false`) lists its `errors`. 409 when no file is configured.
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /provisioning/apply:
    post:
      tags: [admin]
      operationId: applyProvisioning
      summary: Apply the configured provisioning file (needs `admin`)
      description: |
        Plans, then makes the changes when the whole file is valid (nothing otherwise). Each change is audited with
        its usual action and `details.source = provisioning`; `items[].outcome` says what happened.
      responses:
        '200':
          description: What was applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvisioningPlan' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ws_session
      description: Session cookie set by `POST /auth/login`; unsafe methods also need `X-CSRF-Token`.
    bearer:
      type: http
      scheme: bearer
      description: API token

  parameters:
    RepoName:
      name: name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RepositoryName' }
    ProviderId:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Range:
      name: range
      in: query
      schema: { $ref: '#/components/schemas/StatsRange' }
    ActivityRepo:
      name: repo
      in: query
      description: Repository name (exact)
      schema: { type: string }
    ActivityKindParam:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/ActivityKind' }
    ActivityFormat:
      name: format
      in: query
      schema: { $ref: '#/components/schemas/Format' }
    ActivityPrincipal:
      name: principal
      in: query
      description: User name or client address (case-insensitive substring)
      schema: { type: string, maxLength: 128 }
    ActivityCache:
      name: cache
      in: query
      schema: { $ref: '#/components/schemas/CacheState' }
    ActivityOutcome:
      name: outcome
      in: query
      schema: { type: string, enum: [success, failure, info] }
    Since:
      name: since
      in: query
      description: Only events at or after this time (RFC 3339)
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      description: Only events at or before this time (RFC 3339)
      schema: { type: string, format: date-time }
    TrafficMetric:
      name: metric
      in: query
      schema: { type: string, enum: [bytes, requests], default: bytes }
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    LetterId:
      name: letter_id
      in: path
      required: true
      description: Dead-letter entry id
      schema: { type: string, pattern: '^\d{1,20}-\d{1,20}$' }
    TokenId:
      name: token_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    RoleId:
      name: role_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    DockerImage:
      name: image
      in: query
      required: true
      description: Image name within the repository, e.g. `library/nginx`
      schema: { type: string, maxLength: 255 }

    AuditFrom:
      name: from
      in: query
      description: Records at or after this time (RFC 3339)
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: Records before this time (RFC 3339)
      schema: { type: string, format: date-time }
    AuditActor:
      name: actor
      in: query
      description: Who acted, by name (`admin`, `ci-bot`, `anonymous`) or id
      schema: { type: string, maxLength: 256 }
    AuditAction:
      name: action
      in: query
      description: An action (`token.create`) or a category wildcard (`token.*`); repeat for several
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items: { type: string, maxLength: 64 }
    AuditTarget:
      name: target
      in: query
      description: The object acted on, by name (`dockerhub-proxy`) or id
      schema: { type: string, maxLength: 256 }
    AuditOutcome:
      name: outcome
      in: query
      schema: { $ref: '#/components/schemas/AuditOutcome' }

  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in but not allowed (only for objects the principal can see)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Does not exist or is not visible to the principal
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with an existing object (e.g. repository name taken, case-insensitively)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Request body failed validation; `errors[]` has field-level detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadGateway:
      description: A remote system the request depends on failed (the reason is in `detail`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    ManagedBy:
      description: '`provisioning`: declared in the provisioning file; changes made here are overwritten by its next apply'
      anyOf:
        - { type: string, const: provisioning }
        - { type: 'null' }
    ProvisioningStatus:
      type: object
      required: [configured, file, last_apply]
      properties:
        configured: { type: boolean, description: '`WAYSTATION_PROVISION_FILE` is set' }
        file: { type: [string, 'null'] }
        last_apply:
          oneOf:
            - $ref: '#/components/schemas/ProvisioningLastApply'
            - type: 'null'
    ProvisioningLastApply:
      type: object
      required: [at, by, sha256, outcome, summary]
      properties:
        at: { $ref: '#/components/schemas/Timestamp' }
        by: { type: string, description: '`init`, `cli`, or the administrator who applied it' }
        sha256: { type: [string, 'null'] }
        outcome: { type: string, enum: [applied, invalid, failed] }
        summary: { $ref: '#/components/schemas/ProvisioningSummary' }
    ProvisioningSummary:
      type: object
      properties:
        create: { type: integer }
        update: { type: integer }
        unchanged: { type: integer }
        prune: { type: integer }
        failed: { type: integer }
    ProvisioningChange:
      type: object
      required: [field]
      properties:
        field: { type: string }
        before: {}
        after: {}
        redacted: { type: boolean, description: 'A secret: before/after only say whether it is set' }
    ProvisioningItem:
      type: object
      required: [kind, name, action]
      properties:
        kind:
          type: string
          enum: [role, cleanup_policy, repository, group, service_account, auth_provider, webhook, settings]
        name: { type: string }
        action: { type: string, enum: [create, update, unchanged, prune] }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ProvisioningChange' }
        note: { type: [string, 'null'] }
        outcome:
          description: 'Apply only: what happened to this item'
          oneOf:
            - { type: string, enum: [applied, failed, skipped] }
            - { type: 'null' }
        error: { type: [string, 'null'] }
    ProvisioningProblem:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: 'Dotted path into the file, or `file`' }
        message: { type: string }
    ProvisioningPlan:
      type: object
      required: [file, sha256, valid]
      properties:
        file: { type: string }
        sha256: { type: [string, 'null'] }
        valid: { type: boolean }
        applied: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ProvisioningProblem' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ProvisioningItem' }
        summary: { $ref: '#/components/schemas/ProvisioningSummary' }
    # ---------------------------------------------------------------- common
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: { type: string, description: 'URI reference identifying the problem type; `about:blank` when generic' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: 'Stable machine code (`permission_required`: a signed-in principal lacks the permission; `password_change_required`, `totp_setup_required`, `second_factor_expired`...)' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: 'Dotted path into the request body, e.g. `proxy.upstream_url`' }
        message: { type: string }
        code: { type: string, description: 'Machine-readable reason, e.g. `required`, `pattern`, `taken`' }
    Format:
      type: string
      description: Package format. M0 implements docker, npm, apt and raw; the rest are reserved.
      enum: [docker, npm, apt, raw, yum, pypi, maven, go, helm, terraform, galaxy, swift, nuget, cargo, rubygems, composer, conda, apk, huggingface]
    RepositoryType:
      type: string
      enum: [proxy, hosted, group]
    RepositoryStatus:
      type: string
      description: '`ok`, `degraded` (serving stale / errors), `blocked` (auto-blocked upstream), `offline` (offline mode or disabled)'
      enum: [ok, degraded, blocked, offline]
    CacheState:
      type: string
      enum: [HIT, FETCHING, COALESCED, STALE, REVALIDATED, ERROR]
    StatsRange:
      type: string
      enum: [15m, 1h, 24h, 7d, 30d]
      default: 24h
    RepositoryName:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,62}$'
    Timestamp:
      type: string
      format: date-time

    # ---------------------------------------------------------------- config & auth
    UiConfig:
      type: object
      required: [instance_name, base_url, version, docker]
      properties:
        instance_name: { type: string, description: Shown in the top bar and the sign-in page }
        base_url: { type: string, format: uri, description: '`WAYSTATION_BASE_URL`, used to build client URLs' }
        version: { type: string }
        docker:
          type: object
          required: [registry_host, default_repo]
          properties:
            registry_host: { type: string, description: 'Host (and port) docker clients use, e.g. `registry.example.com`' }
            default_repo: { type: [string, 'null'], description: Repository receiving unprefixed names and mirror-mode pulls }
    AuthProvider:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind: { type: string, enum: [local, ldap, oidc] }
        name: { type: string, description: 'Display name ("Continue with <name>" for OIDC)' }
        login_url: { type: [string, 'null'], description: 'OIDC only; the browser navigates here (append `?next=<SPA path>`)' }
    LogoutResult:
      type: object
      required: [end_session_url]
      properties:
        end_session_url: { type: [string, 'null'], description: "The OIDC provider's sign-out page (RP-initiated logout), if any" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        provider: { type: string, description: 'Provider id when several password providers exist; default: resolved automatically' }
    Preferences:
      type: object
      required: [theme, density]
      properties:
        theme: { type: string, enum: [light, dark, system] }
        density: { type: string, enum: [comfortable, compact] }
    User:
      type: object
      required: [id, username, display_name, source]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        source: { type: string, description: '`local`, `ldap:<provider>` or `oidc:<provider>`' }
    Session:
      type: object
      required: [user, csrf_token, capabilities, preferences, expires_at, must_change_password, totp_setup_required]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string, description: Echo in `X-CSRF-Token` on unsafe methods }
        capabilities:
          type: array
          description: |
            Coarse UI hints derived from the principal's grants (which menu items and buttons to show). They never
            replace server-side checks. Values: `repositories.create`, `repositories.manage`, `repositories.browse`
            (browse or read on some repository: Repositories, Browse, Search), `stats.read`, `audit.read`, `users.admin`,
            `settings.admin`, `admin`. Empty for a user without roles (the UI shows its "no access yet" landing).
          items: { type: string }
        preferences: { $ref: '#/components/schemas/Preferences' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        must_change_password:
          type: boolean
          description: The account holds a one-time password; change it (`POST /auth/me/password`) before anything else
        totp_setup_required:
          type: boolean
          description: |
            Two-factor sign-in is required for this account (local administrators, when the policy is on) and not set
            up yet: set it up (`POST /auth/me/totp/setup`, then `/confirm`) before anything else (403 otherwise)
    SecondFactorRequired:
      type: object
      required: [second_factor, expires_at]
      properties:
        second_factor: { type: string, const: totp, description: 'Send the code to `POST /auth/login/totp`' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    SecondFactorLogin:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 32
          writeOnly: true
          description: The 6-digit code from the authenticator app, or a recovery code (`xxxxx-xxxxx`)

    # ---------------------------------------------------------------- API tokens and service accounts
    TokenScope:
      type: string
      description: |
        What a token may be used for; it never exceeds the owner's own grants. `read`: browse, pull, download,
        install. `write`: + push/upload. `delete`: + delete. `manage`: + repository settings. `stats-read`:
        dashboards and stats API. `metrics`: the Prometheus `/metrics` endpoint. `admin`: everything the owner may do.
      enum: [read, write, delete, manage, stats-read, metrics, admin]
    TokenOwnerRef:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, service_account] }
        id: { type: string }
        name: { type: string }
    ApiToken:
      type: object
      required: [id, name, prefix, owner, scopes, repositories, status, expires_at, created_at, last_used_at, last_used_ip, revoked_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 'The first characters of the token, for recognising it (`wst_` + 8)' }
        owner: { $ref: '#/components/schemas/TokenOwnerRef' }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/TokenScope' }
        repositories:
          type: array
          description: Repository patterns the token is limited to; empty = all
          items: { type: string }
        status: { type: string, enum: [active, expired, revoked] }
        expires_at: { type: [string, 'null'], format: date-time, description: null = never expires }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at: { type: [string, 'null'], format: date-time, description: Recorded at most once a minute }
        last_used_ip: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiTokenList:
      type: object
      required: [items, available_scopes]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiToken' }
        available_scopes:
          type: array
          description: Scopes the owner may put on a new token
          items: { $ref: '#/components/schemas/TokenScope' }
    ApiTokenCreate:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 'What the token is for, e.g. `CI pipeline`' }
        scopes:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: '#/components/schemas/TokenScope' }
        repositories:
          type: array
          maxItems: 20
          description: 'Limit the token to these repositories: names, globs (`docker-*`), `format:<f>`, `type:<t>`'
          items: { type: string }
        expires_at: { type: [string, 'null'], format: date-time, description: null = never expires }
    ApiTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret: { type: string, description: The token. Shown only in this response; store it now }
    ServiceAccount:
      type: object
      required: [id, name, description, roles, disabled, active_tokens, created_at]
      properties:
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        roles:
          type: array
          items: { type: string }
        disabled: { type: boolean }
        active_tokens: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ServiceAccountCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 63, description: 'Lower case letters, digits, `.`, `_`, `-`' }
        description: { type: string, maxLength: 500, default: '' }
        roles:
          type: array
          maxItems: 20
          items: { type: string, description: 'Role ids (`GET /roles`): built-in or custom' }
    ServiceAccountUpdate:
      type: object
      additionalProperties: false
      properties:
        description: { type: [string, 'null'], maxLength: 500 }
        roles:
          type: [array, 'null']
          maxItems: 20
          items: { type: string }
        disabled: { type: [boolean, 'null'] }

    # ---------------------------------------------------------------- own account
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        email: { type: [string, 'null'], maxLength: 256, description: null clears it }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        new_password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true, description: At least 12 characters }
    TotpStatus:
      type: object
      required: [available, enabled, enabled_at, required, recovery_codes_left]
      properties:
        available: { type: boolean, description: The account can use two-factor sign-in (a local account with a password) }
        enabled: { type: boolean }
        enabled_at: { type: [string, 'null'], format: date-time }
        required: { type: boolean, description: Policy requires it for this account and it is not set up yet }
        recovery_codes_left: { type: integer }
    TotpSetupRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    TotpSetup:
      type: object
      required: [secret, otpauth_uri, issuer, account, expires_at]
      properties:
        secret: { type: string, description: The shared secret (base32) for typing into an app by hand. Shown once. }
        otpauth_uri: { type: string, description: '`otpauth://totp/...` for a QR code (render it locally, never via a service)' }
        issuer: { type: string }
        account: { type: string }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
    TotpCode:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, minLength: 6, maxLength: 32, writeOnly: true }
    TotpDisable:
      type: object
      required: [password, code]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        code: { type: string, minLength: 6, maxLength: 32, writeOnly: true, description: A code from the app or a recovery code }
    TotpRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: Single-use codes for when the app is not at hand. Shown once.
          items: { type: string }
    SessionInfo:
      type: object
      required: [id, current, created_at, last_seen_at, expires_at, ip, user_agent, provider_id]
      properties:
        id: { type: string, description: Opaque; derived from the stored session id }
        current: { type: boolean, description: The session this request was made with }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_seen_at: { $ref: '#/components/schemas/Timestamp' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }
        ip: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        provider_id: { type: [string, 'null'], description: The OIDC provider the session was signed in through, if any }
    SessionsRevoked:
      type: object
      required: [revoked]
      properties:
        revoked: { type: integer }

    # ---------------------------------------------------------------- RBAC: effective permissions
    Action:
      type: string
      description: 'Repository actions: browse, read, write, delete, manage. Global actions (scope `*` only): admin, user-admin, audit-read, stats-read, settings-admin.'
      enum: [browse, read, write, delete, manage, admin, user-admin, audit-read, stats-read, settings-admin]
    PrincipalRef:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, service_account, anonymous] }
        id: { type: string }
        name: { type: string }
    EffectiveRole:
      type: object
      required: [id, name, via]
      properties:
        id: { type: string }
        name: { type: string }
        via:
          type: array
          description: '`direct`, or the names of the groups the role comes from'
          items: { type: string }
    GrantedPermission:
      type: object
      required: [action, scope]
      properties:
        action: { $ref: '#/components/schemas/Action' }
        scope: { type: string }
    RepositoryAccess:
      type: object
      required: [name, format, type, actions]
      properties:
        name: { type: string }
        format: { type: string }
        type: { type: string }
        actions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
    EffectivePermissions:
      type: object
      required: [principal, roles, permissions, global_actions, repositories, narrowed_by_token]
      properties:
        principal: { $ref: '#/components/schemas/PrincipalRef' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/EffectiveRole' }
        permissions:
          type: array
          description: Every (action, scope) held, implied ones included
          items: { $ref: '#/components/schemas/GrantedPermission' }
        global_actions:
          type: array
          items: { $ref: '#/components/schemas/Action' }
        repositories:
          type: array
          description: Repositories with at least one allowed action
          items: { $ref: '#/components/schemas/RepositoryAccess' }
        narrowed_by_token: { type: boolean, description: 'The request used an API token, which narrows the grants shown' }

    # ---------------------------------------------------------------- administration: users and groups
    UserSummary:
      type: object
      required: [id, username, display_name, email, source, disabled, locked, totp_enabled, roles, groups, last_login, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        source: { type: string, description: '`local`, or the provider that created or linked the user (`ldap:<id>`)' }
        disabled: { type: boolean }
        locked: { type: boolean, description: Locked out after failed sign-ins (local accounts) }
        totp_enabled: { type: boolean, description: Two-factor sign-in (TOTP) is on (local accounts) }
        roles:
          type: array
          description: Roles held directly
          items: { type: string }
        groups:
          type: array
          description: Local group ids
          items: { type: string }
        last_login: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        next_cursor: { type: [string, 'null'] }
    GroupRef:
      type: object
      required: [id, name, source]
      properties:
        id: { type: string }
        name: { type: string }
        source: { type: string, description: '`local`, `ldap` or `oidc` (mapped from a provider)' }
    ExternalGroupBody:
      type: object
      required: [provider, id, name]
      properties:
        provider: { type: string, description: 'Provider source, `ldap:<id>` or `oidc:<id>`' }
        id: { type: string }
        name: { type: string }
    LinkedIdentityBody:
      type: object
      required: [provider, subject, linked_at, last_login]
      properties:
        provider: { type: string }
        subject: { type: string, description: LDAP entry DN or OIDC `sub` }
        linked_at: { $ref: '#/components/schemas/Timestamp' }
        last_login: { type: [string, 'null'], format: date-time }
    UserDetail:
      type: object
      required: [id, username, display_name, email, source, disabled, locked, totp_enabled, roles, groups, last_login, created_at,
                 locked_until, must_change_password, has_password, group_refs, external_groups, identities, effective_roles]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        source: { type: string }
        disabled: { type: boolean }
        locked: { type: boolean }
        totp_enabled: { type: boolean, description: Two-factor sign-in (TOTP) is on (local accounts) }
        roles:
          type: array
          items: { type: string }
        groups:
          type: array
          items: { type: string }
        last_login: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        locked_until: { type: [string, 'null'], format: date-time }
        must_change_password: { type: boolean }
        has_password: { type: boolean, description: A local password is set (local accounts) }
        group_refs:
          type: array
          description: Local groups and mapped provider groups the user is in
          items: { $ref: '#/components/schemas/GroupRef' }
        external_groups:
          type: array
          description: Groups providers reported at the last sign-in
          items: { $ref: '#/components/schemas/ExternalGroupBody' }
        identities:
          type: array
          items: { $ref: '#/components/schemas/LinkedIdentityBody' }
        effective_roles:
          type: array
          description: Own roles plus those of its groups
          items: { type: string }
    UserCreate:
      type: object
      required: [username]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 128, description: 'Lower case; letters, digits, `.`, `_`, `@`, `-`' }
        display_name: { type: string, maxLength: 256, default: '' }
        email: { type: [string, 'null'], maxLength: 256 }
        password:
          type: [string, 'null']
          maxLength: 1024
          writeOnly: true
          description: At least 12 characters. Omit for an account that signs in through LDAP/OIDC (linked by username)
        must_change_password: { type: boolean, default: true, description: The user must change the password at the next sign-in }
        roles:
          type: array
          maxItems: 20
          items: { type: string }
        groups:
          type: array
          maxItems: 100
          description: Local group ids
          items: { type: string }
    UserUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: [string, 'null'], minLength: 1, maxLength: 256 }
        email: { type: [string, 'null'], maxLength: 256, description: null clears it }
        disabled: { type: [boolean, 'null'] }
        roles:
          type: [array, 'null']
          maxItems: 20
          items: { type: string }
        groups:
          type: [array, 'null']
          maxItems: 100
          description: Local group ids
          items: { type: string }
    PasswordReset:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true, description: At least 12 characters }
        must_change_password: { type: boolean, default: true }
    ProviderRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: [string, 'null'], description: null when the provider no longer exists }
    Group:
      type: object
      required: [id, name, description, source, provider, external_group, roles, member_count, created_at, updated_at]
      properties:
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        source: { type: string, enum: [local, ldap, oidc] }
        provider:
          description: The provider of a mapped group
          oneOf:
            - $ref: '#/components/schemas/ProviderRef'
            - type: 'null'
        external_group: { type: [string, 'null'], description: The provider group DN or name a mapped group matches }
        roles:
          type: array
          items: { type: string }
        member_count: { type: [integer, 'null'], description: 'Local groups; null for mapped groups (membership is per sign-in)' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    GroupCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 'Letters, digits, spaces, `.`, `_`, `-`' }
        description: { type: string, maxLength: 500, default: '' }
        roles:
          type: array
          maxItems: 20
          items: { type: string }
    GroupUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, 'null'], minLength: 1, maxLength: 64, description: Local groups only }
        description: { type: [string, 'null'], maxLength: 500, description: Local groups only }
        roles:
          type: [array, 'null']
          maxItems: 20
          items: { type: string }
    GroupMembersAdd:
      type: object
      required: [user_ids]
      additionalProperties: false
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }

    # ---------------------------------------------------------------- administration: sign-in providers, roles
    InstanceSettings:
      type: object
      required: [general, security, limits, updated_at, updated_by]
      properties:
        general: { $ref: '#/components/schemas/GeneralSettings' }
        security: { $ref: '#/components/schemas/SecuritySettings' }
        limits: { $ref: '#/components/schemas/EnvironmentLimits' }
        updated_at: { type: [string, 'null'], format: date-time, description: null until first saved }
        updated_by: { type: [string, 'null'], description: Username of the last change }
    InstanceSettingsWrite:
      type: object
      required: [general]
      additionalProperties: false
      properties:
        general: { $ref: '#/components/schemas/GeneralSettings' }
        security:
          description: Omit to keep the current security settings
          oneOf:
            - $ref: '#/components/schemas/SecuritySettings'
            - type: 'null'
    SecuritySettings:
      type: object
      required: [require_totp_for_admins]
      additionalProperties: false
      properties:
        require_totp_for_admins:
          type: boolean
          description: Local administrators must set up two-factor sign-in (TOTP) before they can do anything else
    GeneralSettings:
      type: object
      required: [instance_name]
      additionalProperties: false
      properties:
        instance_name:
          type: string
          minLength: 1
          maxLength: 64
          description: Shown in the top bar, the sign-in page and the browser title (default `WAYSTATION_INSTANCE_NAME`)
    EnvironmentLimits:
      type: object
      description: Set with environment variables (SPECIFICATION §9); shown for reference
      required: [session_idle_minutes, session_max_hours, login_rate_limit, login_lockout_failures, login_lockout_minutes,
                 token_failure_limit, audit_retention_days, stats_minute_retention_days, max_upload_bytes, min_free_bytes]
      properties:
        session_idle_minutes: { type: integer }
        session_max_hours: { type: integer }
        login_rate_limit: { type: integer, description: Sign-in attempts per client address per 5 minutes }
        login_lockout_failures: { type: integer }
        login_lockout_minutes: { type: integer }
        token_failure_limit: { type: integer, description: Rejected API tokens per client address per 5 minutes }
        audit_retention_days: { type: integer }
        stats_minute_retention_days: { type: integer, description: Per-minute statistics are kept this long }
        max_upload_bytes: { type: integer, description: Largest single upload or cached file }
        min_free_bytes: { type: integer, description: New cache and upload writes are refused below this much free space }
    SystemInfo:
      type: object
      required: [version, python, started_at, components, storage]
      properties:
        version: { type: string }
        python: { type: string, description: Python version of the server process }
        started_at: { $ref: '#/components/schemas/Timestamp', description: When the answering server process started }
        components:
          type: array
          items: { $ref: '#/components/schemas/SystemComponent' }
        storage: { $ref: '#/components/schemas/SystemStorage' }
    SystemComponent:
      type: object
      required: [name, status, version, latency_ms, detail]
      properties:
        name: { type: string, enum: [mongodb, valkey] }
        status: { type: string, enum: [ok, unavailable] }
        version: { type: [string, 'null'] }
        latency_ms: { type: [number, 'null'], description: Round trip of a ping }
        detail: { type: [string, 'null'], description: Why it is unavailable (the error class only) }
    SystemStorage:
      type: object
      required: [path, total_bytes, used_bytes, free_bytes, min_free_bytes]
      properties:
        path: { type: string, description: The data directory (`WAYSTATION_DATA_DIR`) }
        total_bytes: { type: [integer, 'null'], description: null when the volume cannot be read }
        used_bytes: { type: [integer, 'null'] }
        free_bytes: { type: [integer, 'null'] }
        min_free_bytes: { type: integer, description: New writes are refused below this much free space }
    AnonymousAccess:
      type: object
      required: [roles]
      additionalProperties: false
      properties:
        roles:
          type: array
          maxItems: 20
          description: |
            `anonymous` (browse and read proxy repositories, the default) and/or roles holding repository permissions
            only; empty = no anonymous access.
          items: { type: string }
    RolePermission:
      type: object
      required: [action, scope]
      additionalProperties: false
      properties:
        action: { $ref: '#/components/schemas/Action' }
        scope:
          type: string
          minLength: 1
          maxLength: 140
          description: '`*`, a repository name, a glob (`docker-*`), `format:<format>` or `type:<type>`; global actions only `*`'
    Role:
      type: object
      required: [id, name, description, builtin, permissions]
      properties:
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
        id: { type: string, description: 'Role id used in grants and group mappings, e.g. `deployer`' }
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean, description: Built-in roles are read-only }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/RolePermission' }
    RoleUsage:
      type: object
      required: [users, groups, service_accounts]
      properties:
        users: { type: integer }
        groups: { type: integer }
        service_accounts: { type: integer }
    RoleDetail:
      type: object
      required: [id, name, description, builtin, permissions, usage]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/RolePermission' }
        usage: { $ref: '#/components/schemas/RoleUsage', description: Who holds the role directly }
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
    RoleWrite:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 500, default: '' }
        permissions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/RolePermission' }
    RoleCreate:
      type: object
      required: [id, name, permissions]
      additionalProperties: false
      properties:
        id: { type: string, minLength: 2, maxLength: 48, description: 'Lower-case letters, digits and `-`; what users and groups store' }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, maxLength: 500, default: '' }
        permissions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/RolePermission' }
    LdapConnection:
      type: object
      required: [servers, security]
      description: Servers are tried in order; one that cannot be reached is skipped for 30 s (failover).
      properties:
        servers:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
          description: '`host`, `host:port`, `ldap://host[:port]` or `ldaps://host[:port]`'
        security: { type: string, enum: [ldaps, starttls, none], description: '`none` sends passwords in clear text (testing only)' }
        ca_pem: { type: [string, 'null'], maxLength: 65536, description: 'PEM CA bundle to trust instead of the system store' }
        bind_dn: { type: [string, 'null'], maxLength: 1024, description: 'Service account for searches; empty = anonymous search' }
        bind_password: { type: [string, 'null'], writeOnly: true, maxLength: 1024, description: 'Omit or null on update to keep the stored password' }
        bind_password_set: { type: boolean, readOnly: true }
        connect_timeout_s: { type: number, minimum: 1, maximum: 30, default: 5 }
        timeout_s: { type: number, minimum: 1, maximum: 60, default: 10 }
    LdapUsers:
      type: object
      required: [base_dn]
      properties:
        base_dn: { type: string, minLength: 1, maxLength: 1024 }
        filter: { type: string, maxLength: 1024, default: '(objectClass=person)', description: 'ANDed with `(<username_attribute>=<name>)`' }
        username_attribute: { type: string, maxLength: 128, default: uid }
        display_name_attribute: { type: string, maxLength: 128, default: cn }
        email_attribute: { type: string, maxLength: 128, default: mail }
    LdapGroups:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [none, member_of, search], description: '`member_of` reads the user''s `member_of_attribute`; `search` finds groups that list the user' }
        base_dn: { type: [string, 'null'], maxLength: 1024, description: Needed for `search` }
        filter: { type: string, maxLength: 1024, default: '(objectClass=groupOfNames)' }
        member_attribute: { type: string, maxLength: 128, default: member }
        member_value: { type: string, enum: [dn, username], default: dn, description: '`username` for `posixGroup` / `memberUid`' }
        name_attribute: { type: string, maxLength: 128, default: cn }
        member_of_attribute: { type: string, maxLength: 128, default: memberOf }
        nested: { type: boolean, default: false, description: Also follow groups that are members of groups }
        require_group: { type: [string, 'null'], maxLength: 1024, description: 'Only members of this group (DN or name) may sign in' }
    LdapConfig:
      type: object
      required: [connection, users, groups]
      properties:
        connection: { $ref: '#/components/schemas/LdapConnection' }
        users: { $ref: '#/components/schemas/LdapUsers' }
        groups: { $ref: '#/components/schemas/LdapGroups' }
        cache_ttl_s: { type: integer, minimum: 0, maximum: 900, default: 60, description: 'How long a successful password check is reused by format clients (0 = never)' }
    GroupMapping:
      type: object
      required: [external_group, roles]
      properties:
        external_group: { type: string, minLength: 1, maxLength: 1024, description: 'Group DN or name (case-insensitive)' }
        roles:
          type: array
          maxItems: 20
          items: { type: string }
    OidcConfig:
      type: object
      required: [issuer, client_id]
      description: |
        OpenID Connect provider (authorization code + PKCE S256). Register `redirect_uri` (and
        `post_logout_redirect_uri` for RP-initiated logout) at the provider.
      properties:
        issuer: { type: string, minLength: 1, maxLength: 2048, description: 'Issuer URL exactly as the provider states it; discovery reads `<issuer>/.well-known/openid-configuration`. http only with `allow_private`.' }
        client_id: { type: string, minLength: 1, maxLength: 256 }
        client_secret: { type: [string, 'null'], writeOnly: true, maxLength: 4096, description: 'Omit or null on update to keep the stored secret' }
        client_secret_set: { type: boolean, readOnly: true }
        client_auth: { type: string, enum: [client_secret_basic, client_secret_post, none], default: client_secret_basic, description: '`none` = public client (PKCE only)' }
        scopes:
          type: array
          maxItems: 20
          default: [openid, profile, email]
          items: { type: string, minLength: 1, maxLength: 128 }
          description: '`openid` is always sent'
        username_claim: { type: string, minLength: 1, maxLength: 256, default: preferred_username }
        display_name_claim: { type: string, minLength: 1, maxLength: 256, default: name }
        email_claim: { type: string, minLength: 1, maxLength: 256, default: email }
        groups_claim: { type: [string, 'null'], minLength: 1, maxLength: 256, default: groups, description: 'Claim listing the groups (dotted path allowed, e.g. `realm_access.roles`); null = no group sync' }
        require_group: { type: [string, 'null'], maxLength: 1024, description: Only members of this group may sign in }
        auto_provision: { type: boolean, default: true, description: Create a Waystation user at the first sign-in }
        use_userinfo: { type: boolean, default: false, description: Also read claims from the userinfo endpoint }
        rp_logout: { type: boolean, default: true, description: Also sign out at the provider when it supports RP-initiated logout }
        allow_private: { type: boolean, default: false, description: 'The provider may resolve to private addresses (SSRF guard)' }
        signing_algs:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: string, enum: [RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512, EdDSA, Ed25519] }
          description: 'Accepted ID token algorithms (asymmetric only; `none` and HMAC are never accepted)'
        timeout_s: { type: number, minimum: 1, maximum: 60, default: 10 }
        redirect_uri: { type: string, readOnly: true, description: Register at the provider }
        post_logout_redirect_uri: { type: string, readOnly: true, description: Register at the provider }
    AuthProviderWrite:
      type: object
      required: [kind, name]
      description: '`ldap` for kind `ldap`, `oidc` for kind `oidc` (the other one omitted or null)'
      properties:
        kind: { type: string, enum: [ldap, oidc] }
        name: { type: string, minLength: 1, maxLength: 64, description: Shown on the sign-in page }
        enabled: { type: boolean, default: true }
        order: { type: integer, minimum: 0, maximum: 1000, default: 100, description: Sign-in order (lowest first) }
        ldap: { oneOf: [{ $ref: '#/components/schemas/LdapConfig' }, { type: 'null' }] }
        oidc: { oneOf: [{ $ref: '#/components/schemas/OidcConfig' }, { type: 'null' }] }
        group_mapping:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/GroupMapping' }
    AuthProviderConfig:
      type: object
      required: [id, kind, name, enabled, order, ldap, oidc, group_mapping, created_at, updated_at]
      properties:
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
        id: { type: string }
        kind: { type: string, enum: [ldap, oidc] }
        name: { type: string }
        enabled: { type: boolean }
        order: { type: integer }
        ldap: { oneOf: [{ $ref: '#/components/schemas/LdapConfig' }, { type: 'null' }] }
        oidc: { oneOf: [{ $ref: '#/components/schemas/OidcConfig' }, { type: 'null' }] }
        group_mapping:
          type: array
          items: { $ref: '#/components/schemas/GroupMapping' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AuthProviderTestRequest:
      type: object
      required: [provider]
      properties:
        id: { type: [string, 'null'], maxLength: 64, description: 'Saved provider whose bind password is reused when `provider` omits it' }
        provider: { $ref: '#/components/schemas/AuthProviderWrite' }
        username: { type: [string, 'null'], maxLength: 256, description: Needed by test-user }
        password: { type: [string, 'null'], writeOnly: true, maxLength: 1024, description: 'test-user only; also check this password' }
    ProviderCheck:
      type: object
      required: [name, ok, message]
      properties:
        name: { type: string, description: '`connect`, `tls`, `bind`, `user_base`, `group_base`, `search`, `password`, `groups`, `require_group`' }
        ok: { type: boolean }
        message: { type: string }
    LdapServerTest:
      type: object
      required: [server, ok, latency_ms, checks]
      properties:
        server: { type: string }
        ok: { type: boolean }
        latency_ms: { type: [number, 'null'] }
        tls: { type: [string, 'null'], description: 'Negotiated protocol and certificate subject' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ProviderCheck' }
    AuthProviderConnectionTest:
      type: object
      required: [ok, servers]
      properties:
        ok: { type: boolean, description: Every server passed }
        servers:
          type: array
          description: 'LDAP: one entry per server. OIDC: one entry (the issuer) with the discovery checks'
          items: { $ref: '#/components/schemas/LdapServerTest' }
        discovery: { oneOf: [{ $ref: '#/components/schemas/OidcDiscovery' }, { type: 'null' }], description: 'OIDC: what discovery found' }
    OidcDiscovery:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri, userinfo_endpoint, end_session_endpoint, signing_algs, scopes_supported, keys, redirect_uri, post_logout_redirect_uri]
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        jwks_uri: { type: string }
        userinfo_endpoint: { type: [string, 'null'] }
        end_session_endpoint: { type: [string, 'null'], description: 'RP-initiated logout; null = sign-out stays local' }
        signing_algs:
          type: [array, 'null']
          items: { type: string }
          description: '`id_token_signing_alg_values_supported`'
        scopes_supported:
          type: [array, 'null']
          items: { type: string }
        keys: { type: integer, description: Signing keys usable with the accepted algorithms }
        redirect_uri: { type: string, description: Register this redirect URI at the provider }
        post_logout_redirect_uri: { type: string }
    ExternalGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: Group DN (LDAP) or claim value (OIDC) }
        name: { type: string }
    DirectoryUser:
      type: object
      required: [dn, username, display_name, email]
      properties:
        dn: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'] }
    AuthProviderUserTest:
      type: object
      required: [ok, found, server, user, groups, require_group_ok, password, roles, checks]
      properties:
        ok: { type: boolean, description: 'Found, the password matched (when given) and the require-group gate passed' }
        found: { type: boolean }
        server: { type: [string, 'null'], description: The server that answered }
        user: { oneOf: [{ $ref: '#/components/schemas/DirectoryUser' }, { type: 'null' }] }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ExternalGroup' }
        require_group_ok: { type: [boolean, 'null'], description: null when no group is required }
        password: { type: string, enum: [not_tested, ok, failed] }
        roles:
          type: array
          description: Roles the group mapping gives this user
          items: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ProviderCheck' }

    # ---------------------------------------------------------------- repositories
    UpstreamAuth:
      type: object
      required: [kind]
      description: Upstream credentials. Secrets are write-only; reads return `secret_set` instead.
      properties:
        kind: { type: string, enum: [none, basic, bearer] }
        username: { type: [string, 'null'], maxLength: 256 }
        secret: { type: [string, 'null'], writeOnly: true, maxLength: 4096, description: 'Password or token. Omit or null on update to keep the stored secret.' }
        secret_set: { type: boolean, readOnly: true }
    ProxyConfig:
      type: object
      required: [upstream_url]
      properties:
        upstream_url: { type: string, format: uri, maxLength: 2048 }
        auth: { $ref: '#/components/schemas/UpstreamAuth' }
        metadata_max_age_s: { type: integer, minimum: 0, default: 1800 }
        content_max_age_s: { type: [integer, 'null'], minimum: 0, description: 'null = forever (immutable content)' }
        negative_ttl_s: { type: integer, minimum: 0, default: 600 }
        stale_on_error: { type: boolean, default: true }
        offline: { type: boolean, default: false }
        allow_private_upstream: { type: boolean, default: false }
        ca_pem: { type: [string, 'null'], maxLength: 262144, description: 'Extra CA certificates (PEM) trusted for this upstream, in addition to the system ones' }
        http_proxy: { type: [string, 'null'], maxLength: 2048, description: 'Outbound HTTP proxy for this upstream (`http://host:port`, no credentials); null = the server-wide proxy' }
        auto_block: { $ref: '#/components/schemas/AutoBlockConfig' }
    AutoBlockConfig:
      type: object
      description: 'Stop calling a failing upstream for a while (SPEC §4.1): after `failures` consecutive failures (connection, timeout, 5xx, 429) block it for `initial_s`, doubling after every failed probe up to `max_s`'
      properties:
        enabled: { type: boolean, default: true }
        failures: { type: integer, minimum: 1, maximum: 1000, default: 5, description: Consecutive upstream failures that block it }
        initial_s: { type: integer, minimum: 1, maximum: 86400, default: 30, description: First block period (seconds) }
        max_s: { type: integer, minimum: 1, maximum: 604800, default: 1800, description: 'Longest block period (seconds); the period doubles after every failed probe' }
    WritePolicy:
      type: string
      enum: [allow_redeploy, disable_redeploy, read_only]
      description: '`allow_redeploy`: versions/tags may be overwritten; `disable_redeploy`: never; `read_only`: no uploads at all'
    HostedConfig:
      type: object
      description: Hosted repositories only (defaults when omitted)
      properties:
        write_policy: { $ref: '#/components/schemas/WritePolicy' }
        immutable_tag_patterns:
          type: array
          maxItems: 50
          description: 'Docker: regular expressions (full match); a matching tag never moves once pushed, e.g. `v[0-9]+\.[0-9]+\.[0-9]+`'
          items: { type: string, minLength: 1, maxLength: 256 }
    GroupConfig:
      type: object
      required: [members]
      description: Group repositories only (required for them)
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 50
          description: Member repository names in resolution order (same format; proxy or hosted)
          items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,62}$' }
        writable_member: { type: [string, 'null'], description: 'Docker: the hosted member that receives pushes sent to the group; null = the group is read-only' }
    DockerOptions:
      type: object
      properties:
        aliases:
          type: array
          description: 'Upstream aliases routed to this repo, e.g. `docker.io`, `ghcr.io` (SPEC §4.4)'
          items: { type: string, maxLength: 253 }
        docker_hub: { type: boolean, description: 'Upstream is Docker Hub: token auth, `library/` prefix, rate-limit tracking', default: false }
        default_repo: { type: boolean, description: 'Make this the default docker repository (mirror mode, unprefixed names)', default: false }
    NpmOptions:
      type: object
      properties:
        audit_passthrough: { type: boolean, default: true, description: Proxy npm audit requests to the upstream }
    AptOptions:
      type: object
      required: [distribution]
      properties:
        distribution: { type: string, maxLength: 100, description: 'Informational default suite, e.g. `trixie`' }
        flat: { type: boolean, default: false, description: Flat repository layout (no `dists/`) }
    RawOptions:
      type: object
      properties:
        metadata_path_regex: { type: [string, 'null'], maxLength: 512, description: 'Paths matching this regex are mutable metadata (revalidated)' }
        content_disposition: { type: string, enum: [inline, attachment], default: attachment }
    YumOptions:
      type: object
      properties:
        repo_path: { type: string, maxLength: 200, default: '', description: 'Path of the yum repository (the directory holding `repodata/`) below the upstream URL, e.g. `$releasever/BaseOS/$basearch/os/`. Empty: derived for well-known upstreams, else the repository root. Only used by "Set me up" and "test upstream"' }
        gpg_key: { type: [string, 'null'], maxLength: 500, description: '`gpgkey` for the "Set me up" `.repo` file. Empty: the distribution key for well-known upstreams' }
    MavenArtifact:
      type: object
      required: [group_id, artifact_id, version_count]
      properties:
        group_id: { type: string }
        artifact_id: { type: string }
        latest: { type: [string, 'null'], description: Highest version held (Maven order) }
        version_count: { type: integer }
        updated_at: { type: [string, 'null'], format: date-time }
    MavenArtifactPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MavenArtifact' }
        next_cursor: { type: [string, 'null'] }
    MavenVersion:
      type: object
      required: [version, snapshot, path, file_count, size_bytes]
      properties:
        version: { type: string }
        snapshot: { type: boolean }
        path: { type: string, description: The version folder (browse it for the files) }
        file_count: { type: integer }
        size_bytes: { type: integer }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        uploaded_by: { type: [string, 'null'], description: 'Hosted: who deployed it last' }
    MavenVersionPage:
      type: object
      required: [group_id, artifact_id, items, next_cursor]
      properties:
        group_id: { type: string }
        artifact_id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/MavenVersion' }
        next_cursor: { type: [string, 'null'] }
    MavenOptions:
      type: object
      properties:
        version_policy: { type: string, enum: [release, snapshot, mixed], default: release, description: 'Which versions the repository holds: releases, SNAPSHOTs or both (groups: not used)' }
        layout_policy: { type: string, enum: [strict, permissive], default: strict, description: 'strict: only Maven layout paths (artifacts, checksums, signatures, maven-metadata.xml); permissive: any path' }
    PypiOptions:
      type: object
      properties:
        json_api: { type: boolean, default: true, description: 'Proxy the legacy JSON API (`/pypi/<project>/json`) to the upstream (proxy repositories)' }
    GoOptions:
      type: object
      properties:
        sumdb_proxy: { type: boolean, default: true, description: 'Proxy the checksum database at `sumdb/<name>/` so clients verify modules without direct access to it (proxy repositories; groups use their first proxy member that does)' }
        sumdb_name: { type: string, maxLength: 200, default: sum.golang.org, description: Name of the checksum database (GOSUMDB) }
        sumdb_url: { type: string, maxLength: 500, default: 'https://sum.golang.org', description: URL of the checksum database (the SSRF guard applies as for the upstream) }
        verify_checksums: { type: boolean, default: true, description: 'Verify `.mod` and `.zip` files against the checksum database before caching them (modules matching `nosumdb` are not looked up)' }
        nosumdb:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 200 }
          description: 'Module path patterns never looked up in the checksum database (GONOSUMDB syntax: a glob per path prefix, e.g. `example.com/private/*`): private modules'
    HelmOptions:
      type: object
      description: 'Helm (classic chart repositories): no options yet'
      properties: {}
    GalaxyOptions:
      type: object
      properties:
        collections_path: { type: string, maxLength: 200, default: 'api/v3/plugin/ansible/content/published/collections/index/', description: 'Upstream path (relative to the upstream URL) under which `<namespace>/<name>/` collection documents live (proxy repositories). Galaxy NG and galaxy.ansible.com: `api/v3/plugin/ansible/content/published/collections/index/`; servers with the plain v3 layout: `api/v3/collections/`' }
        roles: { type: boolean, default: true, description: 'Proxy the legacy v1 roles API read-only, role archives cached as content (proxy repositories)' }
    TerraformOptions:
      type: object
      properties:
        origins:
          type: array
          maxItems: 50
          items: { type: string, minLength: 1, maxLength: 253 }
          default: [registry.terraform.io, registry.opentofu.org]
          description: "Provider registry host names this mirror serves providers of (the first part of a provider address, e.g. `registry.terraform.io/hashicorp/null`). The upstream URL's host is always allowed too"
        verify_signatures: { type: boolean, default: true, description: "Verify each version's SHA256SUMS against its OpenPGP signature and the signing keys the origin registry publishes before anything of that version is served" }
    FormatOptions:
      description: Format-specific options; the shape follows the repository's `format`
      oneOf:
        - $ref: '#/components/schemas/DockerOptions'
        - $ref: '#/components/schemas/NpmOptions'
        - $ref: '#/components/schemas/AptOptions'
        - $ref: '#/components/schemas/RawOptions'
        - $ref: '#/components/schemas/YumOptions'
        - $ref: '#/components/schemas/MavenOptions'
        - $ref: '#/components/schemas/PypiOptions'
        - $ref: '#/components/schemas/GoOptions'
        - $ref: '#/components/schemas/HelmOptions'
        - $ref: '#/components/schemas/GalaxyOptions'
        - $ref: '#/components/schemas/TerraformOptions'
    QuotaMode:
      type: string
      enum: [soft, hard]
      description: '`soft`: warn at 80 % and 100 %; `hard`: also refuse uploads and new cache fills once reached (cached content is still served; proxy downloads pass through uncached)'
    StorageConfig:
      type: object
      description: Stored-bytes quota (proxy and hosted repositories). Usage counts every asset the repository holds; a blob shared with other repositories counts in each of them
      properties:
        quota_bytes: { type: [integer, 'null'], minimum: 1, maximum: 9007199254740992, description: 'Quota in bytes; null = no quota (group repositories: always null)' }
        quota_mode: { $ref: '#/components/schemas/QuotaMode' }
    RepositoryQuota:
      type: object
      required: [quota_bytes, mode, used_bytes, used_ratio, state]
      properties:
        quota_bytes: { type: integer }
        mode: { $ref: '#/components/schemas/QuotaMode' }
        used_bytes: { type: integer, description: Sum of the sizes of the assets the repository holds (shared blobs count) }
        used_ratio: { type: number, minimum: 0, description: used_bytes / quota_bytes (above 1 when over the quota) }
        state: { type: string, enum: [ok, warning, exceeded], description: '`warning` from 80 %; `exceeded` at or over the quota (hard: new writes refused)' }
    StorageGuardSettings:
      type: object
      required: [min_free_bytes]
      properties:
        min_free_bytes: { type: integer, minimum: 0, maximum: 9007199254740992, description: Refuse new cache fills and uploads below this many free bytes }
        min_free_percent: { type: number, minimum: 0, maximum: 90, default: 0, description: '... or below this percentage of the filesystem (the larger floor wins)' }
    StorageGuard:
      type: object
      required: [min_free_bytes, min_free_percent, floor_bytes, free_bytes, total_bytes, low]
      properties:
        min_free_bytes: { type: integer }
        min_free_percent: { type: number }
        floor_bytes: { type: integer, description: 'The effective floor: the larger of the two settings' }
        free_bytes: { type: integer }
        total_bytes: { type: integer }
        low: { type: boolean, description: 'Free space is below the floor: new cache fills and uploads are refused' }
        low_since: { type: [string, 'null'], format: date-time, description: When the worker first reported low disk (null when it has not) }
        updated_at: { type: [string, 'null'], format: date-time }
    RepositoryWrite:
      type: object
      required: [name, format, type, online]
      properties:
        name: { $ref: '#/components/schemas/RepositoryName' }
        format: { $ref: '#/components/schemas/Format' }
        type: { $ref: '#/components/schemas/RepositoryType' }
        online: { type: boolean, description: Accepts requests }
        description: { type: string, maxLength: 500 }
        proxy: { $ref: '#/components/schemas/ProxyConfig' }
        hosted: { $ref: '#/components/schemas/HostedConfig' }
        group: { $ref: '#/components/schemas/GroupConfig' }
        storage: { $ref: '#/components/schemas/StorageConfig' }
        format_options: { $ref: '#/components/schemas/FormatOptions' }
    RepositorySummaryStats:
      type: object
      required: [size_bytes, artifact_count, hit_ratio_24h, requests_24h, bytes_served_24h, requests_spark_24h, last_activity_at]
      properties:
        size_bytes: { type: integer }
        artifact_count: { type: integer }
        hit_ratio_24h: { type: [number, 'null'], minimum: 0, maximum: 1, description: null when there were no requests }
        requests_24h: { type: integer }
        bytes_served_24h: { type: integer }
        bytes_saved_24h: { type: integer }
        requests_spark_24h:
          type: array
          description: Requests per hour, oldest first (24 values)
          items: { type: integer }
        last_activity_at: { type: [string, 'null'], format: date-time }
    Repository:
      type: object
      required: [name, format, type, online, status, url, created_at, updated_at, stats]
      properties:
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
        name: { $ref: '#/components/schemas/RepositoryName' }
        format: { $ref: '#/components/schemas/Format' }
        type: { $ref: '#/components/schemas/RepositoryType' }
        online: { type: boolean }
        description: { type: string }
        status: { $ref: '#/components/schemas/RepositoryStatus' }
        url: { type: string, format: uri, description: 'Client URL, `<base>/repository/<name>/`' }
        proxy: { $ref: '#/components/schemas/ProxyConfig' }
        hosted: { $ref: '#/components/schemas/HostedConfig' }
        group: { $ref: '#/components/schemas/GroupConfig' }
        storage: { $ref: '#/components/schemas/StorageConfig' }
        quota:
          description: Stored bytes against the quota; null when the repository has no quota
          oneOf:
            - $ref: '#/components/schemas/RepositoryQuota'
            - type: 'null'
        format_options: { $ref: '#/components/schemas/FormatOptions' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        stats: { $ref: '#/components/schemas/RepositorySummaryStats' }
    RepositoryPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Repository' }
        next_cursor: { type: [string, 'null'] }
        total: { type: integer, description: Matching repositories across all pages }
    UpstreamTestRequest:
      type: object
      required: [format, proxy]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        repository: { type: string, description: 'Existing repository name: reuse its stored secret when `proxy.auth.secret` is omitted' }
        proxy: { $ref: '#/components/schemas/ProxyConfig' }
        format_options: { $ref: '#/components/schemas/FormatOptions' }
    UpstreamTestResult:
      type: object
      required: [reachable, latency_ms, checks]
      properties:
        reachable: { type: boolean }
        http_status: { type: [integer, 'null'] }
        latency_ms: { type: [number, 'null'] }
        auth: { type: string, enum: [anonymous, authenticated, failed, not_required] }
        tls: { type: [string, 'null'], description: 'Negotiated protocol and certificate subject, e.g. `TLSv1.3, CN=registry-1.docker.io`' }
        checks:
          type: array
          items:
            type: object
            required: [name, ok, message]
            properties:
              name: { type: string, description: 'e.g. `dns`, `ssrf`, `tls`, `http`, `auth`, `protocol`' }
              ok: { type: boolean }
              message: { type: string }
        rate_limit: { oneOf: [{ $ref: '#/components/schemas/RateLimit' }, { type: 'null' }] }
    SetupSnippet:
      type: object
      required: [id, title, language, content]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        language: { type: string, description: 'Highlighting hint: `shell`, `json`, `ini`, `toml`, `yaml`, `text`' }
        filename: { type: [string, 'null'], description: 'Where the snippet goes, e.g. `/etc/docker/daemon.json`' }
        os: { type: [string, 'null'], enum: [linux, macos, windows, null] }
        content: { type: string, description: 'May contain `{{TOKEN}}` / `{{USERNAME}}` placeholders' }
    SetupClient:
      type: object
      required: [id, label, snippets]
      properties:
        id: { type: string, description: 'e.g. `docker`, `podman`, `containerd`, `npm`, `pnpm`, `yarn`, `apt`, `curl`' }
        label: { type: string }
        snippets:
          type: array
          items: { $ref: '#/components/schemas/SetupSnippet' }
    SetupGuide:
      type: object
      required: [repository, format, clients]
      properties:
        repository: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        clients:
          type: array
          items: { $ref: '#/components/schemas/SetupClient' }
        notes:
          type: array
          items: { type: string }

    # ---------------------------------------------------------------- import from Nexus (T-M01)
    NexusImportRequest:
      type: object
      additionalProperties: false
      required: [url, username, password]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Nexus base URL (with its context path, if any), e.g. `https://nexus.example.com`
        username: { type: string, minLength: 1, maxLength: 256, description: A Nexus administrator (reads the configuration) }
        password: { type: string, format: password, minLength: 1, maxLength: 1024, writeOnly: true }
        allow_private:
          type: boolean
          default: false
          description: Allow a Nexus on a private or loopback address (SSRF guard exception)
        ca_pem:
          type: [string, 'null']
          maxLength: 262144
          description: Extra CA certificates (PEM) trusted for the Nexus TLS certificate
        docker_aliases:
          type: boolean
          default: true
          description: Give each docker proxy its upstream host as an alias (`docker.io` for Docker Hub, `ghcr.io`, ...)
        default_docker_repo:
          type: [string, 'null']
          maxLength: 63
          description: Nexus docker repository to make the default docker repository; null = detect it
    NexusApplyRequest:
      type: object
      additionalProperties: false
      required: [url, username, password]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Nexus base URL (with its context path, if any), e.g. `https://nexus.example.com`
        username: { type: string, minLength: 1, maxLength: 256, description: A Nexus administrator (reads the configuration) }
        password: { type: string, format: password, minLength: 1, maxLength: 1024, writeOnly: true }
        allow_private:
          type: boolean
          default: false
          description: Allow a Nexus on a private or loopback address (SSRF guard exception)
        ca_pem:
          type: [string, 'null']
          maxLength: 262144
          description: Extra CA certificates (PEM) trusted for the Nexus TLS certificate
        docker_aliases:
          type: boolean
          default: true
          description: Give each docker proxy its upstream host as an alias (`docker.io` for Docker Hub, `ghcr.io`, ...)
        default_docker_repo:
          type: [string, 'null']
          maxLength: 63
          description: Nexus docker repository to make the default docker repository; null = detect it
        repositories:
          type: [array, 'null']
          maxItems: 1000
          items: { type: string }
          description: Names to import (from the preview); null = every repository the preview would create
    ImportDifference:
      type: object
      required: [field, nexus, waystation, note]
      properties:
        field: { type: string, description: Waystation field or Nexus setting }
        nexus: { type: [string, 'null'] }
        waystation: { type: [string, 'null'] }
        note: { type: string }
    NexusImportAction:
      type: string
      enum: [create, exists, unsupported, invalid]
    NexusImportOutcome:
      type: string
      enum: [created, exists, unsupported, invalid, failed, not_selected]
    NexusImportItem:
      type: object
      required: [name, nexus_format, nexus_type, format, type, action, outcome, reason, repository, differences, notes]
      properties:
        name: { type: string }
        nexus_format: { type: string }
        nexus_type: { type: string }
        format:
          oneOf:
            - $ref: '#/components/schemas/Format'
            - type: 'null'
        type:
          oneOf:
            - $ref: '#/components/schemas/RepositoryType'
            - type: 'null'
        action: { $ref: '#/components/schemas/NexusImportAction' }
        outcome:
          description: 'Apply only: what happened'
          oneOf:
            - $ref: '#/components/schemas/NexusImportOutcome'
            - type: 'null'
        reason: { type: [string, 'null'] }
        repository:
          description: The Waystation repository; created when `action` is `create`, for `exists` what the import would have created
          oneOf:
            - $ref: '#/components/schemas/RepositoryWrite'
            - type: 'null'
        differences:
          type: array
          items: { $ref: '#/components/schemas/ImportDifference' }
        notes:
          type: array
          items: { type: string }
    DefaultDockerChoice:
      type: object
      required: [name, reason]
      properties:
        name: { type: [string, 'null'], description: Repository that receives unprefixed docker names after the import }
        reason: { type: string }
    ImportSummary:
      type: object
      required: [total, create, exists, unsupported, invalid, created, failed]
      properties:
        total: { type: integer }
        create: { type: integer }
        exists: { type: integer }
        unsupported: { type: integer }
        invalid: { type: integer }
        created: { type: integer }
        failed: { type: integer }
    NexusImportReport:
      type: object
      required: [applied, nexus_version, items, summary, default_docker_repo]
      properties:
        applied: { type: boolean }
        nexus_version: { type: [string, 'null'], description: From the Nexus `Server` header, when it sends one }
        items:
          type: array
          items: { $ref: '#/components/schemas/NexusImportItem' }
        summary: { $ref: '#/components/schemas/ImportSummary' }
        default_docker_repo:
          oneOf:
            - $ref: '#/components/schemas/DefaultDockerChoice'
            - type: 'null'

    # ---------------------------------------------------------------- browse
    FolderEntry:
      type: object
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [folder, file] }
        size: { type: [integer, 'null'] }
        content_type: { type: [string, 'null'] }
        sha256: { type: [string, 'null'] }
        last_modified: { type: [string, 'null'], format: date-time }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        download_count: { type: [integer, 'null'] }
        child_count: { type: [integer, 'null'], description: Folders only }
    FolderListing:
      type: object
      required: [path, entries, next_cursor]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/FolderEntry' }
        next_cursor: { type: [string, 'null'] }
    Platform:
      type: object
      required: [os, architecture]
      properties:
        os: { type: string }
        architecture: { type: string }
        variant: { type: [string, 'null'] }
    DockerImage:
      type: object
      required: [name, tag_count, size_bytes]
      properties:
        name: { type: string }
        tag_count: { type: integer }
        size_bytes: { type: integer, description: Unique bytes stored for this image }
        last_pulled_at: { type: [string, 'null'], format: date-time }
        pulls: { type: integer }
    DockerImagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DockerImage' }
        next_cursor: { type: [string, 'null'] }
    DockerTag:
      type: object
      required: [tag, digest, media_type, platforms, size_bytes, updated_at]
      properties:
        tag: { type: string }
        digest: { type: string }
        media_type: { type: string }
        platforms:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
        size_bytes: { type: integer }
        created_at: { type: [string, 'null'], format: date-time, description: Image config `created` }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        last_pulled_at: { type: [string, 'null'], format: date-time }
        pulls: { type: integer }
    DockerTagPage:
      type: object
      required: [image, items, next_cursor]
      properties:
        image: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/DockerTag' }
        next_cursor: { type: [string, 'null'] }
    DockerLayer:
      type: object
      required: [digest, size, media_type]
      properties:
        digest: { type: string }
        size: { type: integer }
        media_type: { type: string }
        cached: { type: boolean, description: Blob present in the blob store }
        created_by: { type: [string, 'null'], description: 'History entry (`created_by`) for this layer' }
    DockerPlatformManifest:
      type: object
      required: [platform, digest, size]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        digest: { type: string }
        size: { type: integer }
    DockerManifest:
      type: object
      required: [image, reference, digest, media_type, is_index, manifests, layers, total_size]
      properties:
        image: { type: string }
        reference: { type: string }
        digest: { type: string, description: Digest of the requested reference (index digest for multi-arch) }
        media_type: { type: string }
        is_index: { type: boolean }
        manifests:
          type: array
          description: Index entries (empty for a single-platform manifest)
          items: { $ref: '#/components/schemas/DockerPlatformManifest' }
        platform: { oneOf: [{ $ref: '#/components/schemas/Platform' }, { type: 'null' }], description: Platform whose layers are listed }
        platform_digest: { type: [string, 'null'] }
        config_digest: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        layers:
          type: array
          items: { $ref: '#/components/schemas/DockerLayer' }
        total_size: { type: integer, description: Sum of layer sizes for the selected platform }
        labels:
          type: object
          additionalProperties: { type: string }
        pull_by_tag: { type: string }
        pull_by_digest: { type: string }
    NpmPackage:
      type: object
      required: [name, latest, version_count, cached_versions, size_bytes]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        latest: { type: string }
        version_count: { type: integer, description: Versions in the upstream packument }
        cached_versions: { type: integer, description: Versions whose tarball is cached }
        size_bytes: { type: integer }
        license: { type: [string, 'null'] }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    NpmPackagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NpmPackage' }
        next_cursor: { type: [string, 'null'] }
    NpmVersion:
      type: object
      required: [version, published_at, cached]
      properties:
        version: { type: string }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        size_bytes: { type: [integer, 'null'], description: Tarball size }
        unpacked_size: { type: [integer, 'null'] }
        cached: { type: boolean }
        downloads: { type: integer }
        deprecated: { type: [string, 'null'], description: Deprecation message }
        integrity: { type: [string, 'null'] }
        dist_tags:
          type: array
          items: { type: string }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
    NpmVersionPage:
      type: object
      required: [package, items, next_cursor]
      properties:
        package: { $ref: '#/components/schemas/NpmPackage' }
        dist_tags:
          type: object
          additionalProperties: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/NpmVersion' }
        next_cursor: { type: [string, 'null'] }
    PypiProject:
      type: object
      required: [name, display_name, version_count, files, size_bytes]
      properties:
        name: { type: string, description: Normalised project name (PEP 503) }
        display_name: { type: string }
        summary: { type: [string, 'null'] }
        latest: { type: [string, 'null'], description: 'Newest final release (PEP 440), else the newest version' }
        version_count: { type: integer, description: Versions on the project page }
        files: { type: integer, description: 'Distribution files held: cached (proxy) or uploaded (hosted)' }
        size_bytes: { type: integer }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    PypiProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PypiProject' }
        next_cursor: { type: [string, 'null'] }
    PypiFile:
      type: object
      required: [filename, kind, cached]
      properties:
        filename: { type: string }
        kind: { type: string, enum: [wheel, sdist, other] }
        size: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'] }
        requires_python: { type: [string, 'null'] }
        yanked: { type: boolean }
        yanked_reason: { type: [string, 'null'] }
        core_metadata: { type: boolean, description: 'A PEP 658 `.metadata` file is available' }
        cached: { type: boolean, description: 'Held by this repository (cached or uploaded)' }
        uploaded_at: { type: [string, 'null'], format: date-time }
        uploaded_by: { type: [string, 'null'], description: 'Hosted: who uploaded the file' }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    PypiVersion:
      type: object
      required: [version, prerelease, yanked, files, cached_files, size_bytes]
      properties:
        version: { type: string }
        prerelease: { type: boolean }
        yanked: { type: boolean, description: Every file of the version is yanked }
        files:
          type: array
          items: { $ref: '#/components/schemas/PypiFile' }
        cached_files: { type: integer }
        size_bytes: { type: integer, description: Bytes of the files held }
    PypiVersionPage:
      type: object
      required: [project, items, next_cursor]
      properties:
        project: { $ref: '#/components/schemas/PypiProject' }
        items:
          type: array
          description: Newest first (PEP 440)
          items: { $ref: '#/components/schemas/PypiVersion' }
        next_cursor: { type: [string, 'null'] }
    PypiYank:
      type: object
      required: [project, version, yanked]
      properties:
        project: { type: string, maxLength: 200 }
        version: { type: string, maxLength: 200 }
        yanked: { type: boolean, description: 'True: yank every file of the version (PEP 592); false: un-yank' }
        reason: { type: [string, 'null'], maxLength: 500 }
    PypiYankResult:
      type: object
      required: [project, version, yanked, files]
      properties:
        project: { type: string }
        version: { type: string }
        yanked: { type: boolean }
        files: { type: integer, description: Files changed }
    GoModule:
      type: object
      required: [module, version_count, cached_versions, size_bytes]
      properties:
        module: { type: string, description: 'Module path (decoded: upper-case letters as they are)' }
        latest: { type: [string, 'null'], description: 'Newest release in the cached version list, else the newest version' }
        version_count: { type: integer, description: 'Versions in the cached version list (`@v/list`)' }
        cached_versions: { type: integer, description: Versions whose module zip is cached }
        size_bytes: { type: integer, description: Bytes of the cached module zips }
    GoModulePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GoModule' }
        next_cursor: { type: [string, 'null'] }
    GoFile:
      type: object
      required: [kind, size, sha256]
      properties:
        kind: { type: string, enum: [info, mod, zip] }
        size: { type: integer }
        sha256: { type: string }
        cached_at: { type: [string, 'null'], format: date-time }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    GoVersion:
      type: object
      required: [version, prerelease, pseudo, incompatible, listed, cached, files, size_bytes]
      properties:
        version: { type: string }
        time: { type: [string, 'null'], format: date-time, description: 'Commit time from the cached `.info`' }
        prerelease: { type: boolean }
        pseudo: { type: boolean, description: A pseudo-version (an untagged commit) }
        incompatible: { type: boolean, description: '`+incompatible`: a v2+ version of a module without a go.mod' }
        listed: { type: boolean, description: In the cached version list (tagged) }
        cached: { type: boolean, description: The module zip is cached }
        files:
          type: array
          description: Files of the version held by this repository
          items: { $ref: '#/components/schemas/GoFile' }
        size_bytes: { type: integer }
    GoVersionPage:
      type: object
      required: [module, items, next_cursor]
      properties:
        module: { $ref: '#/components/schemas/GoModule' }
        items:
          type: array
          description: Newest first (semantic version order)
          items: { $ref: '#/components/schemas/GoVersion' }
        next_cursor: { type: [string, 'null'] }
    HelmChart:
      type: object
      required: [name, latest_version, version_count]
      properties:
        name: { type: string }
        latest_version: { type: string }
        app_version: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        icon: { type: [string, 'null'], description: "The chart's icon URL (http/https), as its metadata gives it" }
        deprecated: { type: boolean, default: false }
        version_count: { type: integer }
    HelmChartPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HelmChart' }
        next_cursor: { type: [string, 'null'] }
    HelmVersion:
      type: object
      required: [version, cached, path, download_url]
      properties:
        version: { type: string }
        app_version: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        digest: { type: [string, 'null'], description: 'sha256 of the chart package (hex), when known' }
        size_bytes: { type: [integer, 'null'] }
        cached: { type: boolean, description: 'The chart package is stored (always true in hosted repositories)' }
        deprecated: { type: boolean, default: false }
        path: { type: string, description: Path of the chart package in the repository }
        download_url: { type: string }
    HelmVersionPage:
      type: object
      required: [chart, items, next_cursor]
      properties:
        chart: { $ref: '#/components/schemas/HelmChart' }
        items:
          type: array
          items: { $ref: '#/components/schemas/HelmVersion' }
        next_cursor: { type: [string, 'null'] }
    GalaxyNamespace:
      type: object
      required: [namespace, collection_count]
      properties:
        namespace: { type: string }
        collection_count: { type: integer }
    GalaxyNamespacePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GalaxyNamespace' }
        next_cursor: { type: [string, 'null'] }
    GalaxyCollection:
      type: object
      required: [namespace, name, latest_version, version_count]
      properties:
        namespace: { type: string }
        name: { type: string }
        latest_version: { type: string }
        description: { type: [string, 'null'] }
        requires_ansible: { type: [string, 'null'], description: 'ansible-core versions the newest version supports (meta/runtime.yml)' }
        version_count: { type: integer }
    GalaxyCollectionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GalaxyCollection' }
        next_cursor: { type: [string, 'null'] }
    GalaxyVersion:
      type: object
      required: [version, cached, path, download_url]
      properties:
        version: { type: string }
        prerelease: { type: boolean, default: false }
        created_at: { type: [string, 'null'], format: date-time }
        requires_ansible: { type: [string, 'null'] }
        sha256: { type: [string, 'null'], description: 'sha256 of the collection artifact (hex), when known' }
        size_bytes: { type: [integer, 'null'] }
        cached: { type: boolean, description: 'The artifact is stored (always true in hosted repositories)' }
        dependencies:
          type: object
          additionalProperties: { type: string }
          description: Collection name -> version range
        uploaded_by: { type: [string, 'null'] }
        path: { type: string, description: Path of the artifact in the repository }
        download_url: { type: string }
    GalaxyVersionPage:
      type: object
      required: [collection, items, next_cursor]
      properties:
        collection: { $ref: '#/components/schemas/GalaxyCollection' }
        items:
          type: array
          items: { $ref: '#/components/schemas/GalaxyVersion' }
        next_cursor: { type: [string, 'null'] }
    TerraformProvider:
      type: object
      required: [provider, version_count, cached_archives, size_bytes]
      properties:
        provider: { type: string, description: 'Provider address: `<hostname>/<namespace>/<type>`' }
        latest: { type: [string, 'null'], description: 'Newest release in the cached version list, else the newest version' }
        version_count: { type: integer, description: Versions in the cached registry version list }
        cached_archives: { type: integer, description: 'Provider archives (one per version and platform) cached' }
        size_bytes: { type: integer, description: Bytes of the cached archives }
    TerraformProviderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TerraformProvider' }
        next_cursor: { type: [string, 'null'] }
    TerraformArchive:
      type: object
      required: [os, arch, filename, size, sha256]
      properties:
        os: { type: string }
        arch: { type: string }
        filename: { type: string }
        size: { type: integer }
        sha256: { type: string }
        h1: { type: [string, 'null'], description: '`h1:` hash of the archive contents (as in the lock file)' }
        cached_at: { type: [string, 'null'], format: date-time }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    TerraformVersion:
      type: object
      required: [version, prerelease, protocols, platforms, listed, archives, size_bytes]
      properties:
        version: { type: string }
        prerelease: { type: boolean }
        protocols:
          type: array
          description: Plugin protocol versions the registry lists
          items: { type: string }
        platforms:
          type: array
          description: '`<os>_<arch>` platforms the registry lists'
          items: { type: string }
        listed: { type: boolean, description: In the cached registry version list }
        archives:
          type: array
          description: Archives of the version held by this repository
          items: { $ref: '#/components/schemas/TerraformArchive' }
        size_bytes: { type: integer }
    TerraformVersionPage:
      type: object
      required: [provider, items, next_cursor]
      properties:
        provider: { $ref: '#/components/schemas/TerraformProvider' }
        items:
          type: array
          description: Newest first (semantic version order)
          items: { $ref: '#/components/schemas/TerraformVersion' }
        next_cursor: { type: [string, 'null'] }
    AptSuite:
      type: object
      required: [suite, components, architectures]
      properties:
        suite: { type: string }
        origin: { type: [string, 'null'] }
        codename: { type: [string, 'null'] }
        components:
          type: array
          items: { type: string }
        architectures:
          type: array
          items: { type: string }
        release_date: { type: [string, 'null'], format: date-time }
        last_refreshed_at: { type: [string, 'null'], format: date-time }
        package_count: { type: integer }
        cached_package_count: { type: integer }
    AptPackage:
      type: object
      required: [name, version, architecture, component, filename, cached]
      properties:
        name: { type: string }
        version: { type: string }
        architecture: { type: string }
        component: { type: string }
        section: { type: [string, 'null'] }
        size: { type: [integer, 'null'] }
        filename: { type: string, description: 'Path under the repository, `pool/...`' }
        sha256: { type: [string, 'null'] }
        cached: { type: boolean }
        verified: { type: [boolean, 'null'], description: Cached file matched the index hash; null if not cached }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    AptPackagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AptPackage' }
        next_cursor: { type: [string, 'null'] }

    # ---------------------------------------------------------------- search
    SearchKind:
      type: string
      enum: [package, image, file]
    SearchBrowseLink:
      type: object
      required: [repository, query]
      properties:
        repository: { type: string }
        query:
          type: object
          description: 'Query of the repository Browse view: `image` + `ref` (docker), `package` (npm), `suite` + `arch` + `q` (apt), `path` (the folder listing of every other format)'
          additionalProperties: { type: string }
    SearchHit:
      type: object
      required: [kind, format, repository, repository_type, name, version, qualifier, path, size, sha256, updated_at, cached, browse]
      properties:
        kind: { $ref: '#/components/schemas/SearchKind' }
        format: { $ref: '#/components/schemas/Format' }
        repository: { type: string }
        repository_type: { $ref: '#/components/schemas/RepositoryType' }
        name: { type: string, description: 'Package, image or file name' }
        version: { type: [string, 'null'], description: Version (packages) or tag (images) }
        qualifier: { type: [string, 'null'], description: 'Where it is listed: suite/component and architecture (apt), arch (yum)' }
        path: { type: [string, 'null'], description: File path in the repository (files, apt/yum packages) }
        size: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'], description: Blob sha256 (files) or manifest digest (images) }
        updated_at: { type: [string, 'null'], format: date-time }
        cached: { type: [boolean, 'null'], description: In the cache (a listed apt/yum package may not be); null if unknown }
        browse: { $ref: '#/components/schemas/SearchBrowseLink' }
    SearchFacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    SearchFacets:
      type: object
      required: [format, repository, kind, type, total, capped]
      properties:
        format:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        repository:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        kind:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        type:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        total: { type: integer, description: Matches with every filter applied }
        capped: { type: boolean, description: 'Counting stopped early: counts are lower bounds' }
    SearchPage:
      type: object
      required: [mode, items, next_cursor, facets]
      properties:
        mode: { type: string, enum: [name, digest], description: '`digest` when the query is a sha256 digest (or a prefix of one)' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        next_cursor: { type: [string, 'null'] }
        facets: { oneOf: [{ $ref: '#/components/schemas/SearchFacets' }, { type: 'null' }], description: 'First page only, unless `facets=false`' }

    # ---------------------------------------------------------------- stats
    Sparks:
      type: object
      description: Sparkline values per KPI over the range, oldest first, equally spaced (`step_s`)
      required: [requests_per_s, hit_ratio, bytes_served, bytes_saved, storage_used, artifacts, active_transfers]
      properties:
        requests_per_s: { type: array, items: { type: number } }
        hit_ratio: { type: array, items: { type: [number, 'null'] } }
        bytes_served: { type: array, items: { type: number } }
        bytes_saved: { type: array, items: { type: number } }
        storage_used: { type: array, items: { type: number } }
        artifacts: { type: array, items: { type: number } }
        active_transfers: { type: array, items: { type: number } }
    StatsSummary:
      type: object
      required: [range, step_s, generated_at, requests_per_s, requests, hit_ratio, bytes_served, bytes_saved, bytes_upstream, storage, artifacts_cached, active_transfers, sparks]
      properties:
        range: { $ref: '#/components/schemas/StatsRange' }
        step_s: { type: integer }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        requests_per_s: { type: number, description: Current rate (last 10 s) }
        requests: { type: integer, description: Requests in the range }
        hit_ratio: { type: [number, 'null'], description: Hits / (hits + misses) in the range }
        bytes_served: { type: integer, description: Bytes sent to clients in the range }
        bytes_saved: { type: integer, description: Bytes served from cache in the range (upstream traffic avoided) }
        bytes_upstream: { type: integer, description: Bytes fetched from upstreams in the range }
        storage:
          type: object
          required: [used_bytes, free_bytes, total_bytes]
          properties:
            used_bytes: { type: integer, description: Bytes held by blobs }
            free_bytes: { type: integer, description: Free space on the data directory filesystem }
            total_bytes: { type: integer }
        artifacts_cached: { type: integer }
        active_transfers: { type: integer }
        sparks: { $ref: '#/components/schemas/Sparks' }
    TimeSeries:
      type: object
      required: [range, step_s, unit, timestamps, series]
      properties:
        range: { $ref: '#/components/schemas/StatsRange' }
        step_s: { type: integer, description: 'Bucket width: 15m→10 s, 1h→1 min, 24h→10 min, 7d→1 h, 30d→6 h' }
        unit: { type: string, enum: [bytes, requests] }
        timestamps:
          type: array
          description: Bucket start times, oldest first
          items: { $ref: '#/components/schemas/Timestamp' }
        series:
          type: array
          items:
            type: object
            required: [key, label, values]
            properties:
              key: { type: string, description: '`hit`/`upstream` (split=cache) or a format name (split=format)' }
              label: { type: string }
              values: { type: array, items: { type: number } }
    StorageSummary:
      type: object
      required: [used_bytes, free_bytes, total_bytes, blob_count, dedup_saved_bytes, by_format, by_repository]
      properties:
        used_bytes: { type: integer }
        free_bytes: { type: integer }
        total_bytes: { type: integer }
        blob_count: { type: integer }
        dedup_saved_bytes: { type: integer }
        by_format:
          type: array
          items:
            type: object
            required: [format, bytes, artifacts]
            properties:
              format: { $ref: '#/components/schemas/Format' }
              bytes: { type: integer }
              artifacts: { type: integer }
        by_repository:
          type: array
          items:
            type: object
            required: [repository, format, bytes, artifacts]
            properties:
              repository: { type: string }
              format: { $ref: '#/components/schemas/Format' }
              bytes: { type: integer }
              artifacts: { type: integer }
    RateLimit:
      type: object
      required: [limit, remaining]
      properties:
        limit: { type: integer }
        remaining: { type: integer }
        window_s: { type: [integer, 'null'] }
        reset_at: { type: [string, 'null'], format: date-time }
        source: { type: string, description: 'e.g. `docker-hub`' }
    UpstreamHealth:
      type: object
      required: [repository, format, upstream_url, status, error_rate, requests_1h]
      properties:
        repository: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        upstream_url: { type: string }
        status: { $ref: '#/components/schemas/RepositoryStatus' }
        error_rate: { type: number, minimum: 0, maximum: 1, description: Upstream errors / upstream requests, last hour }
        requests_1h: { type: integer, description: Upstream requests in the last hour }
        p95_latency_ms: { type: [number, 'null'] }
        last_error: { type: [string, 'null'] }
        last_error_at: { type: [string, 'null'], format: date-time }
        blocked_until: { type: [string, 'null'], format: date-time, description: Auto-block ends (status `blocked`) }
        rate_limit: { oneOf: [{ $ref: '#/components/schemas/RateLimit' }, { type: 'null' }] }

    # ---------------------------------------------------------------- live
    Transfer:
      type: object
      description: One in-flight (or just finished) transfer
      required: [id, repository, format, direction, artifact, client, cache, bytes_done, bytes_total, rate_bps, started_at, updated_at, state]
      properties:
        id: { type: string }
        repository: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        direction: { type: string, enum: [download, upload] }
        artifact: { type: string, description: 'Display name, e.g. `library/nginx@sha256:…` layer, `lodash-4.17.21.tgz`, `pool/main/c/curl/curl_8.14.1-2_amd64.deb`' }
        path: { type: string, description: Asset path within the repository }
        component: { type: [string, 'null'], description: 'Component coordinates when known, e.g. `nginx:1.27`' }
        client:
          type: object
          required: [ip]
          properties:
            ip: { type: string }
            user: { type: [string, 'null'] }
            agent: { type: [string, 'null'], description: 'Client product, e.g. `docker/27.3`, `npm/11.6`, `apt/3.0`' }
        cache: { $ref: '#/components/schemas/CacheState' }
        followers: { type: integer, description: 'FETCHING: requests coalesced onto this fetch. COALESCED: 0', default: 0 }
        bytes_done: { type: integer }
        bytes_total: { type: [integer, 'null'], description: null when the upstream sends no length }
        rate_bps: { type: number, description: Bytes per second (smoothed) }
        upstream_latency_ms: { type: [number, 'null'], description: Time to first byte from the upstream (misses only) }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        state: { type: string, enum: [active, finished, failed] }
        error: { type: [string, 'null'] }
    TransferList:
      type: object
      required: [items, as_of]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
        as_of: { $ref: '#/components/schemas/Timestamp' }
    ActivityKind:
      type: string
      enum: [download, upload, delete, cache_miss, upstream_state, repository, cleanup, auth, error, storage]
    ActivityEvent:
      type: object
      required: [id, ts, kind, summary, outcome]
      properties:
        id: { type: string, description: Stream id; also the SSE `id:` }
        ts: { $ref: '#/components/schemas/Timestamp' }
        kind: { $ref: '#/components/schemas/ActivityKind' }
        summary: { type: string, description: Plain-text one-liner (never rendered as HTML) }
        outcome: { type: string, enum: [success, failure, info] }
        repository: { type: [string, 'null'] }
        format: { oneOf: [{ $ref: '#/components/schemas/Format' }, { type: 'null' }] }
        artifact: { type: [string, 'null'] }
        path: { type: [string, 'null'], description: Full path of the asset in the repository, when there is one }
        principal: { type: [string, 'null'], description: 'Username, `anonymous`, or a client IP' }
        cache: { oneOf: [{ $ref: '#/components/schemas/CacheState' }, { type: 'null' }] }
        bytes: { type: [integer, 'null'] }
        duration_ms: { type: [number, 'null'] }
    ActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        next_cursor: { type: [string, 'null'] }

    # ---------------------------------------------------------------- SSE events (ARCH §8)
    LiveEvent:
      description: One SSE message; `type` equals the SSE `event:` field.
      oneOf:
        - $ref: '#/components/schemas/TransfersSnapshotEvent'
        - $ref: '#/components/schemas/TransferStartedEvent'
        - $ref: '#/components/schemas/TransferProgressEvent'
        - $ref: '#/components/schemas/TransferFinishedEvent'
        - $ref: '#/components/schemas/TransferFailedEvent'
        - $ref: '#/components/schemas/StatsTickEvent'
        - $ref: '#/components/schemas/UpstreamStateEvent'
        - $ref: '#/components/schemas/ActivityStreamEvent'
        - $ref: '#/components/schemas/JobUpdateEvent'
        - $ref: '#/components/schemas/JobProgressEvent'
        - $ref: '#/components/schemas/JobLogEvent'
        - $ref: '#/components/schemas/WorkerUpdateEvent'
      discriminator:
        propertyName: type
        mapping:
          transfers.snapshot: '#/components/schemas/TransfersSnapshotEvent'
          transfer.started: '#/components/schemas/TransferStartedEvent'
          transfer.progress: '#/components/schemas/TransferProgressEvent'
          transfer.finished: '#/components/schemas/TransferFinishedEvent'
          transfer.failed: '#/components/schemas/TransferFailedEvent'
          stats.tick: '#/components/schemas/StatsTickEvent'
          upstream.state: '#/components/schemas/UpstreamStateEvent'
          activity: '#/components/schemas/ActivityStreamEvent'
          job.update: '#/components/schemas/JobUpdateEvent'
          job.progress: '#/components/schemas/JobProgressEvent'
          job.log: '#/components/schemas/JobLogEvent'
          worker.update: '#/components/schemas/WorkerUpdateEvent'
    TransfersSnapshotEvent:
      type: object
      required: [type, ts, transfers]
      properties:
        type: { type: string, const: transfers.snapshot }
        ts: { $ref: '#/components/schemas/Timestamp' }
        transfers:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
    TransferStartedEvent:
      type: object
      required: [type, ts, transfer]
      properties:
        type: { type: string, const: transfer.started }
        ts: { $ref: '#/components/schemas/Timestamp' }
        transfer: { $ref: '#/components/schemas/Transfer' }
    TransferProgressEvent:
      type: object
      description: Coalesced to ≤ 4 Hz per transfer. Carries only the fields that change.
      required: [type, ts, id, bytes_done, rate_bps]
      properties:
        type: { type: string, const: transfer.progress }
        ts: { $ref: '#/components/schemas/Timestamp' }
        id: { type: string }
        bytes_done: { type: integer }
        bytes_total: { type: [integer, 'null'] }
        rate_bps: { type: number }
        cache: { $ref: '#/components/schemas/CacheState' }
        followers: { type: integer }
        upstream_latency_ms: { type: [number, 'null'] }
    TransferFinishedEvent:
      type: object
      required: [type, ts, id, bytes_done, duration_ms]
      properties:
        type: { type: string, const: transfer.finished }
        ts: { $ref: '#/components/schemas/Timestamp' }
        id: { type: string }
        bytes_done: { type: integer }
        duration_ms: { type: number }
        cache: { $ref: '#/components/schemas/CacheState' }
    TransferFailedEvent:
      type: object
      required: [type, ts, id, error]
      properties:
        type: { type: string, const: transfer.failed }
        ts: { $ref: '#/components/schemas/Timestamp' }
        id: { type: string }
        bytes_done: { type: integer }
        error: { type: string }
    StatsTickEvent:
      type: object
      description: 1 Hz rolling counters for the KPI tiles (last 10 s window for rates)
      required: [type, ts, requests_per_s, bytes_out_per_s, bytes_upstream_per_s, hit_ratio_1m, active_transfers]
      properties:
        type: { type: string, const: stats.tick }
        ts: { $ref: '#/components/schemas/Timestamp' }
        requests_per_s: { type: number }
        bytes_out_per_s: { type: number, description: Bytes per second sent to clients }
        bytes_upstream_per_s: { type: number, description: Bytes per second fetched from upstreams }
        bytes_saved_per_s: { type: number, description: Bytes per second served from cache }
        hit_ratio_1m: { type: [number, 'null'] }
        active_transfers: { type: integer }
        storage_used_bytes: { type: integer }
        artifacts_cached: { type: integer }
    UpstreamStateEvent:
      type: object
      required: [type, ts, health]
      properties:
        type: { type: string, const: upstream.state }
        ts: { $ref: '#/components/schemas/Timestamp' }
        health: { $ref: '#/components/schemas/UpstreamHealth' }
    ActivityStreamEvent:
      type: object
      description: A durable activity event (SSE `id:` = `event.id`, resumable with `Last-Event-ID`)
      required: [type, ts, event]
      properties:
        type: { type: string, const: activity }
        ts: { $ref: '#/components/schemas/Timestamp' }
        event: { $ref: '#/components/schemas/ActivityEvent' }

    # ---------------------------------------------------------------- cleanup and blob GC (T-O01, T-O02)
    CleanupFormat:
      type: string
      description: The format a policy applies to, or `*` for every format
      enum: ['*', docker, npm, apt, raw, yum, pypi, maven, go, helm, terraform, galaxy, swift, nuget, cargo, rubygems, composer, conda, apk, huggingface]
    CleanupCriteria:
      type: object
      description: |
        Every criterion that is set must match (AND); at least one selecting criterion is required. Docker policies
        select tags (name = image, version = tag); `untagged_older_than_days` also removes manifests no tag reaches.
        Only content is removed (never indexes or packuments); blob GC reclaims the space later.
      additionalProperties: false
      properties:
        last_downloaded_older_than_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Not downloaded for this many days (never downloaded = counted from when it was cached)
        published_older_than_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Cached or published more than this many days ago (docker - tag last updated)
        keep_latest_n_versions:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: Always keep the newest N versions of each component (format version order; docker - tags by recency)
        name_include: { type: [string, 'null'], maxLength: 256, description: Regular expression the component name must contain a match of }
        name_exclude: { type: [string, 'null'], maxLength: 256, description: Regular expression that protects matching names }
        version_include: { type: [string, 'null'], maxLength: 256, description: Regular expression the version or tag must contain a match of }
        version_exclude: { type: [string, 'null'], maxLength: 256, description: Regular expression that protects matching versions or tags }
        prerelease_only: { type: boolean, default: false, description: 'Only pre-release versions (semver `-rc.1`, Debian `~beta`, tags such as `nightly`)' }
        untagged_older_than_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Docker only - manifests no tag reaches, updated more than this many days ago
    CleanupPolicyWrite:
      type: object
      required: [name, format, criteria]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/RepositoryName' }
        description: { type: string, maxLength: 500 }
        format: { $ref: '#/components/schemas/CleanupFormat' }
        criteria: { $ref: '#/components/schemas/CleanupCriteria' }
        schedule:
          type: [string, 'null']
          maxLength: 100
          description: 'When it runs: 5-field UTC cron (`0 3 * * *`) or a macro such as `@daily`; null = manual only'
        enabled: { type: boolean, default: true, description: Scheduled runs happen only while enabled }
    JobProgress:
      type: object
      required: [done, total, message]
      properties:
        done: { type: integer }
        total: { type: [integer, 'null'] }
        message: { type: [string, 'null'] }
    CleanupRunSummary:
      type: object
      required: [id, status, trigger, started_at, finished_at, progress, removed, bytes, error]
      properties:
        id: { type: string, description: Run id (one per attempt) }
        status: { type: string, enum: [running, succeeded, failed, dead, interrupted] }
        trigger: { type: string, enum: [schedule, manual] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { type: [string, 'null'], format: date-time }
        progress: { $ref: '#/components/schemas/JobProgress' }
        removed: { type: integer, description: Items removed (assets, tags, manifests, layers) }
        bytes: { type: integer, description: Bytes of the removed assets (blob GC reclaims them unless another asset shares the blob) }
        error: { type: [string, 'null'] }
    CleanupRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CleanupRunSummary' }
    CleanupPolicy:
      type: object
      required: [id, name, description, format, criteria, schedule, enabled, repositories, created_at, updated_at, next_run_at, last_run]
      properties:
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        format: { $ref: '#/components/schemas/CleanupFormat' }
        criteria: { $ref: '#/components/schemas/CleanupCriteria' }
        schedule: { type: [string, 'null'] }
        enabled: { type: boolean }
        repositories:
          type: array
          description: Attached repositories the caller can see
          items: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        next_run_at: { type: [string, 'null'], format: date-time, description: Next scheduled run (null = manual only or disabled) }
        last_run: { oneOf: [{ $ref: '#/components/schemas/CleanupRunSummary' }, { type: 'null' }] }
    CleanupPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CleanupPolicy' }
    CleanupPreviewRequest:
      type: object
      required: [format, criteria]
      additionalProperties: false
      properties:
        format: { $ref: '#/components/schemas/CleanupFormat' }
        criteria: { $ref: '#/components/schemas/CleanupCriteria' }
        policy_id: { type: [string, 'null'], maxLength: 64, description: A saved policy - preview on its attached repositories }
        repositories:
          type: [array, 'null']
          maxItems: 100
          items: { type: string, maxLength: 64 }
        cursor: { type: [string, 'null'], maxLength: 512 }
        limit: { type: integer, minimum: 0, maximum: 500, default: 50 }
    CleanupCandidate:
      type: object
      required: [repository, kind, name, version, path, size, created_at, last_downloaded_at, reason]
      properties:
        repository: { type: string }
        kind:
          type: string
          enum: [asset, tag, manifest, layer]
          description: '`asset` = a cached file; docker - `tag`, `manifest` (no tag reaches it any more), `layer` (no remaining manifest uses it)'
        name: { type: string, description: Component name (docker - the image) }
        version: { type: [string, 'null'], description: Version (docker - tag or digest) }
        path: { type: string }
        size: { type: integer, description: Bytes of the asset removed (0 when only an index record goes) }
        created_at: { type: [string, 'null'], format: date-time }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        reason: { type: string, description: 'Why it matches, e.g. `not downloaded for 120 days`' }
    CleanupRepositoryTotal:
      type: object
      required: [name, format, count, bytes, truncated]
      properties:
        name: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        count: { type: integer }
        bytes: { type: integer }
        truncated: { type: boolean, description: Too large to evaluate completely in a preview (a run evaluates everything) }
    CleanupPreview:
      type: object
      required: [count, bytes, truncated, repositories, items, next_cursor]
      properties:
        count: { type: integer }
        bytes: { type: integer }
        truncated: { type: boolean }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/CleanupRepositoryTotal' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CleanupCandidate' }
        next_cursor: { type: [string, 'null'] }
    RepositoryCleanup:
      type: object
      required: [repository, policies]
      properties:
        repository: { type: string }
        policies:
          type: array
          items: { $ref: '#/components/schemas/CleanupPolicy' }
    RepositoryCleanupUpdate:
      type: object
      required: [policy_ids]
      additionalProperties: false
      properties:
        policy_ids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [enqueued, merged, rerun, running]
          description: '`merged` - joined a pending run; `rerun` - runs once more after the current run'
    GcRun:
      type: object
      required: [id, status, trigger, started_at, finished_at, progress, freed_blobs, freed_bytes, marked, uploads_removed, error]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, succeeded, failed, dead, interrupted] }
        trigger: { type: string, enum: [schedule, manual] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { type: [string, 'null'], format: date-time }
        progress: { $ref: '#/components/schemas/JobProgress' }
        freed_blobs: { type: integer }
        freed_bytes: { type: integer }
        marked: { type: integer, description: Blobs newly found unreferenced (deleted once unreferenced for the grace period) }
        uploads_removed: { type: integer, description: Orphan upload files removed }
        error: { type: [string, 'null'] }
    GcStatus:
      type: object
      required: [enabled, schedule, grace_hours, next_run_at, pending_blobs, pending_bytes, runs]
      properties:
        enabled: { type: boolean }
        schedule: { type: string }
        grace_hours: { type: number, description: A blob is deleted only after being unreferenced this long }
        next_run_at: { type: [string, 'null'], format: date-time }
        pending_blobs: { type: integer, description: Blobs marked unreferenced, waiting out the grace period }
        pending_bytes: { type: integer }
        runs:
          type: array
          description: Recent runs, newest first (up to 20)
          items: { $ref: '#/components/schemas/GcRun' }

    # ---------------------------------------------------------------- tasks and workers (T-O04)
    RunStatus:
      type: string
      description: '`failed` - this attempt failed and the job will retry; `dead` - out of attempts (a dead letter); `interrupted` - the worker was lost (the job runs again)'
      enum: [running, succeeded, failed, dead, interrupted]
    JobQueue:
      type: string
      enum: [index, maintenance, stats, prefetch, import]
    JobRunSummary:
      type: object
      required: [id, job_id, kind, queue, task_id, trigger, attempt, status, started_at, finished_at, duration_ms, progress, worker_id, error, result]
      properties:
        id: { type: string, description: Run id (one per attempt) }
        job_id: { type: string, description: 'The job (the same across its attempts)' }
        kind: { type: string, description: 'Job kind, e.g. `blob.gc`, `cleanup.run`' }
        queue: { type: string }
        task_id: { type: [string, 'null'], description: The scheduled task it belongs to }
        trigger: { type: string, enum: [schedule, manual, retry] }
        attempt: { type: integer }
        status: { $ref: '#/components/schemas/RunStatus' }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [number, 'null'] }
        progress: { $ref: '#/components/schemas/JobProgress' }
        worker_id: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        result:
          type: object
          additionalProperties: true
          description: What the run reported (kind-specific figures)
    JobRun:
      allOf:
        - $ref: '#/components/schemas/JobRunSummary'
        - type: object
          required: [log]
          properties:
            log:
              type: array
              description: The last 500 log lines, oldest first
              items: { type: string }
    JobRunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/JobRunSummary' }
        next_cursor: { type: [string, 'null'] }
    TaskOwner:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, const: cleanup_policy }
        id: { type: string }
        name: { type: [string, 'null'] }
    ScheduledTask:
      type: object
      required: [id, kind, queue, schedule, enabled, routine, params, next_run_at, last_fired_at, last_run, owner]
      properties:
        id: { type: string }
        kind: { type: string }
        queue: { type: string }
        schedule: { type: string, description: '5-field UTC cron, a macro such as `@daily`, or `@every <n>s|m|h`' }
        enabled: { type: boolean }
        routine: { type: boolean, description: Housekeeping that runs every few seconds; its runs are hidden by default }
        params:
          type: object
          additionalProperties: true
        next_run_at: { type: [string, 'null'], format: date-time }
        last_fired_at: { type: [string, 'null'], format: date-time }
        last_run:
          oneOf:
            - $ref: '#/components/schemas/JobRunSummary'
            - type: 'null'
        owner:
          description: Set when another object owns the schedule (edit it there)
          oneOf:
            - $ref: '#/components/schemas/TaskOwner'
            - type: 'null'
    ScheduledTaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScheduledTask' }
    ScheduledTaskUpdate:
      type: object
      additionalProperties: false
      properties:
        schedule: { type: [string, 'null'], maxLength: 100, description: '5-field UTC cron, a macro, or `@every <n>s|m|h` (at least 10 s)' }
        enabled: { type: [boolean, 'null'] }
    QueueFigures:
      type: object
      required: [name, waiting, running, delayed, oldest_waiting_age_s]
      properties:
        name: { type: string }
        waiting: { type: integer }
        running: { type: integer }
        delayed: { type: integer, description: Retry backoff and jobs scheduled for later }
        oldest_waiting_age_s: { type: number }
    WorkerJob:
      type: object
      required: [job_id, run_id, kind, queue, started_at]
      properties:
        job_id: { type: string }
        run_id: { type: [string, 'null'] }
        kind: { type: string }
        queue: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
    Worker:
      type: object
      required: [id, hostname, version, queues, concurrency, leader, started_at, heartbeat_at, heartbeat_age_s, state, running_jobs]
      properties:
        id: { type: string }
        hostname: { type: string }
        version: { type: string }
        queues:
          type: array
          items: { type: string }
        concurrency: { type: [integer, 'null'] }
        leader: { type: boolean, description: Holds the scheduler lease (fires schedules, dispatches the outbox) }
        started_at: { type: [string, 'null'], format: date-time }
        heartbeat_at: { $ref: '#/components/schemas/Timestamp' }
        heartbeat_age_s: { type: number }
        state: { type: string, enum: [ok, late, lost], description: '`late` after 30 s without a heartbeat, `lost` after 90 s' }
        running_jobs:
          type: array
          items: { $ref: '#/components/schemas/WorkerJob' }
    WorkerOverview:
      type: object
      required: [workers, queues, dead_letters]
      properties:
        workers:
          type: array
          items: { $ref: '#/components/schemas/Worker' }
        queues:
          type: array
          items: { $ref: '#/components/schemas/QueueFigures' }
        dead_letters: { type: integer }
    DeadLetter:
      type: object
      required: [id, job_id, kind, queue, task_id, attempts, error, dead_at, enqueued_at, payload, retryable]
      properties:
        id: { type: string, description: Dead-letter entry id }
        job_id: { type: [string, 'null'] }
        kind: { type: [string, 'null'] }
        queue: { type: [string, 'null'] }
        task_id: { type: [string, 'null'] }
        attempts: { type: integer }
        error: { type: string }
        dead_at: { $ref: '#/components/schemas/Timestamp' }
        enqueued_at: { type: [string, 'null'], format: date-time }
        payload:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        retryable: { type: boolean, description: False for a malformed entry or a kind this version does not know }
    DeadLetterPage:
      type: object
      required: [items, total, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeadLetter' }
        total: { type: integer }
        next_cursor: { type: [string, 'null'] }
    JobUpdateEvent:
      type: object
      description: 'Topic `tasks`: a job attempt started, finished or failed'
      required: [type, ts, event, run_id, job_id, kind, queue, attempt, status]
      properties:
        type: { type: string, const: job.update }
        ts: { $ref: '#/components/schemas/Timestamp' }
        event: { type: string, enum: [started, finished, failed] }
        run_id: { type: string }
        job_id: { type: string }
        kind: { type: string }
        queue: { type: string }
        attempt: { type: integer }
        status: { $ref: '#/components/schemas/RunStatus' }
        worker_id: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
    JobProgressEvent:
      type: object
      description: "Topic `tasks`: a running job's progress (at most once a second per run)"
      required: [type, ts, run_id, job_id, kind, done]
      properties:
        type: { type: string, const: job.progress }
        ts: { $ref: '#/components/schemas/Timestamp' }
        run_id: { type: string }
        job_id: { type: string }
        kind: { type: string }
        done: { type: integer }
        total: { type: [integer, 'null'] }
        message: { type: [string, 'null'] }
    JobLogEvent:
      type: object
      description: 'Topic `tasks`: new log lines of a running job'
      required: [type, ts, run_id, job_id, kind, lines]
      properties:
        type: { type: string, const: job.log }
        ts: { $ref: '#/components/schemas/Timestamp' }
        run_id: { type: string }
        job_id: { type: string }
        kind: { type: string }
        lines:
          type: array
          items: { type: string }
    WorkerUpdateEvent:
      type: object
      description: 'Topic `tasks`: a worker came online or stopped'
      required: [type, ts, worker_id, state]
      properties:
        type: { type: string, const: worker.update }
        ts: { $ref: '#/components/schemas/Timestamp' }
        worker_id: { type: string }
        state: { type: string, enum: [online, offline] }

    # ---------------------------------------------------------------- audit (SPEC §4.11, T-S10)
    AuditOutcome:
      type: string
      enum: [success, failure]
    AuditActor:
      type: object
      description: Who acted. `system` = the server or a worker job acting on its own.
      required: [kind, id, name, auth, provider, token_id]
      properties:
        kind: { type: string, enum: [user, service_account, anonymous, system] }
        id: { type: [string, 'null'] }
        name: { type: string, description: 'Username, service account name, `anonymous` or `system`' }
        auth:
          type: string
          description: How the request was authenticated
          enum: [session, api_token, basic, registry_token, none, system]
        provider: { type: [string, 'null'], description: 'Sign-in source of the user (`local`, `ldap:<id>`, `oidc:<id>`)' }
        token_id: { type: [string, 'null'], description: The API token used, when there was one }
    AuditTarget:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
          description: '`user`, `service_account`, `api_token`, `auth_provider`, `repository`, `session`, `settings`...'
        id: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
    AuditChange:
      type: object
      description: One changed field. Secret values are never recorded; `redacted` marks a secret that changed.
      required: [field, before, after, redacted]
      properties:
        field: { type: string, description: 'Dotted path, e.g. `proxy.upstream_url`' }
        before: { description: Previous value (JSON); null when absent }
        after: { description: New value (JSON); null when removed }
        redacted: { type: boolean }
    AuditRecord:
      type: object
      required: [id, ts, action, outcome, actor, target, client_ip, request_id, reason, details, changes]
      properties:
        id: { type: string }
        ts: { $ref: '#/components/schemas/Timestamp' }
        action: { type: string, description: '`<category>.<verb>`, e.g. `auth.login`, `repository.update`' }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        actor: { $ref: '#/components/schemas/AuditActor' }
        target: { oneOf: [{ $ref: '#/components/schemas/AuditTarget' }, { type: 'null' }] }
        client_ip: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: 'Why it failed (`bad_credentials`, `locked`...); null on success' }
        details:
          type: object
          description: Action-specific facts (plain values; never secrets)
          additionalProperties: true
        changes:
          type: array
          items: { $ref: '#/components/schemas/AuditChange' }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditRecord' }
        next_cursor: { type: [string, 'null'] }
    WebhookEventName:
      type: string
      description: An event (`content.upload`), a category (`content.*`) or every event (`*`)
      enum: ['*', 'content.*', 'repository.*', content.upload, content.delete, content.update, repository.create, repository.update, repository.delete]
    WebhookWrite:
      type: object
      required: [name, url, events]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/RepositoryName' }
        description: { type: string, maxLength: 500 }
        url: { type: string, minLength: 8, maxLength: 2048, description: 'Where events are POSTed (http or https; no credentials in the URL)' }
        events:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/WebhookEventName' }
        repositories:
          type: array
          maxItems: 50
          description: Repository name globs (`*`, `?`, case-insensitive); empty = every repository
          items: { type: string, minLength: 1, maxLength: 200 }
        enabled: { type: boolean, default: true }
        secret:
          type: [string, 'null']
          minLength: 16
          maxLength: 256
          writeOnly: true
          description: HMAC-SHA256 signing key. Required when creating; null keeps the stored one
        headers:
          type: [object, 'null']
          writeOnly: true
          additionalProperties: { type: string, maxLength: 1024 }
          description: Extra request headers (values may be credentials). Null keeps the stored ones; `{}` removes them
        allow_private: { type: boolean, default: false, description: Allow targets on private or reserved addresses }
        timeout_s: { type: integer, minimum: 1, maximum: 30, default: 10 }
        max_attempts: { type: integer, minimum: 1, maximum: 20, default: 8 }
    WebhookDeliveryStatus:
      type: string
      enum: [pending, succeeded, dead]
    WebhookDeliverySummary:
      type: object
      required: [id, event, event_id, trigger, repository, status, attempts, created_at, finished_at, next_attempt_at, status_code, latency_ms, error]
      properties:
        id: { type: string, description: 'Delivery id (the `Waystation-Delivery` and `Idempotency-Key` headers)' }
        event: { type: string, description: 'Event type (`content.upload`, `webhook.ping`...)' }
        event_id: { type: string, description: 'The `Waystation-Event-Id` header (the same on a redelivery)' }
        trigger: { type: string, enum: [event, test, redeliver] }
        repository: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/WebhookDeliveryStatus' }
        attempts: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { type: [string, 'null'], format: date-time }
        next_attempt_at: { type: [string, 'null'], format: date-time, description: When a pending delivery is attempted next }
        status_code: { type: [integer, 'null'], description: The last attempt's HTTP status }
        latency_ms: { type: [number, 'null'] }
        error: { type: [string, 'null'], description: 'The last attempt''s failure (connection, timeout, refused target)' }
    Webhook:
      type: object
      required: [id, name, description, url, events, repositories, enabled, secret_set, header_names, allow_private, timeout_s, max_attempts, created_at, updated_at, last_delivery]
      properties:
        managed_by: { $ref: '#/components/schemas/ManagedBy' }
        id: { type: string }
        name: { type: string }
        description: { type: string }
        url: { type: string }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventName' }
        repositories:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        secret_set: { type: boolean, description: A signing secret is stored (never returned) }
        header_names:
          type: array
          description: Custom headers sent (values are never returned)
          items: { type: string }
        allow_private: { type: boolean }
        timeout_s: { type: integer }
        max_attempts: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        last_delivery:
          oneOf:
            - $ref: '#/components/schemas/WebhookDeliverySummary'
            - type: 'null'
    WebhookList:
      type: object
      required: [items, events]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Webhook' }
        events:
          type: array
          description: Events a webhook can subscribe to
          items: { type: string }
    WebhookAttempt:
      type: object
      required: [n, at, outcome, status_code, latency_ms, error, response]
      properties:
        n: { type: integer }
        at: { $ref: '#/components/schemas/Timestamp' }
        outcome: { type: string, enum: [succeeded, failed] }
        status_code: { type: [integer, 'null'] }
        latency_ms: { type: [number, 'null'] }
        error: { type: [string, 'null'] }
        response: { type: [string, 'null'], description: The first KiB of the answer }
    WebhookDelivery:
      allOf:
        - $ref: '#/components/schemas/WebhookDeliverySummary'
        - type: object
          required: [redelivery_of, request_body, request_headers, log]
          properties:
            redelivery_of: { type: [string, 'null'] }
            request_body: { type: string, description: The JSON document sent }
            request_headers:
              type: object
              description: Headers sent (custom header values masked; timestamp and signature differ per attempt)
              additionalProperties: { type: string }
            log:
              type: array
              description: Attempts, newest first (the last 20)
              items: { $ref: '#/components/schemas/WebhookAttempt' }
    WebhookDeliveryList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WebhookDeliverySummary' }
        next_cursor: { type: [string, 'null'] }
    WebhookDeliveryAccepted:
      type: object
      required: [delivery_id]
      properties:
        delivery_id: { type: string }
