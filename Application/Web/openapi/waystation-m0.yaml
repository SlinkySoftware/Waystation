openapi: 3.1.0
info:
  title: Waystation API (M0 contract)
  version: 0.1.0-m0
  summary: Contract-first REST + SSE API for the M0 feedback build.
  description: |
    Contract-first description of the Waystation REST API used by the web UI for milestone M0 (TASKS T-V01).
    The UI is built against MSW mocks generated from this file; the server lane implements the same schema and a
    contract test keeps them in step. Once the server generates its own OpenAPI document (SPEC §7), that document
    must remain compatible with this one.

    Conventions:
    - Everything lives under `/api/v1/`. JSON request and response bodies, UTF-8.
    - **Errors** are RFC 9457 `application/problem+json` (`Problem`). Validation errors carry field-level detail
      in `errors[]`, keyed by a dotted path into the request body (`proxy.upstream_url`).
    - **Authentication**: the UI uses the session cookie set by `POST /auth/login` (HttpOnly, Secure, SameSite=Lax).
      Scripts use `Authorization: Bearer <api-token>`.
    - **CSRF** (session-cookie requests only): double-submit token. Login and `GET /auth/me` return `csrf_token`;
      the server also sets it in the readable cookie `ws_csrf`. Every unsafe method (POST, PUT, PATCH, DELETE)
      sent with a session cookie must carry the same value in `X-CSRF-Token`, otherwise 403. Bearer requests are
      exempt.
    - **Authorization**: every route is checked by the RBAC engine. Objects the principal may not see return 404,
      never 403.
    - **Pagination**: opaque `cursor` + `limit`; responses carry `next_cursor` (null on the last page).
    - **Sizes** are bytes (integers), **rates** bytes or requests per second, **times** RFC 3339 UTC.
    - **Cache states** use one vocabulary everywhere (SPEC §4.7): `HIT`, `FETCHING`, `COALESCED`, `STALE`,
      `REVALIDATED`, `ERROR`.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: config
  - name: tokens
  - name: repositories
  - name: browse
  - name: search
  - name: stats
  - name: live
  - name: cleanup
  - name: tasks
  - name: admin
  - name: import
  - name: webhooks
security:
  - session: []
  - bearer: []

paths:
  /config:
    get:
      tags: [config]
      operationId: getUiConfig
      summary: Public instance settings the UI needs before and after sign-in
      security: []
      responses:
        '200':
          description: Instance configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiConfig' }

  /auth/providers:
    get:
      tags: [auth]
      operationId: listAuthProviders
      summary: Sign-in options shown on the sign-in page
      security: []
      responses:
        '200':
          description: Providers in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthProvider' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Local (and LDAP) username/password sign-in; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. `Set-Cookie` carries the session and `ws_csrf` cookies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '202':
          description: |
            The password was accepted and the account has two-factor sign-in: no session yet. `Set-Cookie` carries the
            pending sign-in (`ws_mfa`, HttpOnly, SameSite=Strict, a few minutes); send the code to `POST /auth/login/totp`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecondFactorRequired' }
        '401':
          description: Bad credentials (generic message; never says which part was wrong)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/login/totp:
    post:
      tags: [auth]
      operationId: loginSecondFactor
      summary: Second sign-in step for accounts with two-factor sign-in; sets the session cookie
      description: |
        Needs the pending sign-in cookie from `POST /auth/login` (202). `code` is the 6-digit code from the
        authenticator app (each code works once) or a recovery code (single use). Wrong codes count towards the
        account lockout; after 5 the pending sign-in ends. Rate limited like sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecondFactorLogin' }
      responses:
        '200':
          description: Signed in. `Set-Cookie` carries the session and `ws_csrf` cookies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Wrong code, or (problem `code` `second_factor_expired`) the pending sign-in is gone; start again
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        For a session that came from an OIDC provider with RP-initiated logout, `end_session_url` is the provider's
        sign-out page; the UI navigates there (the provider sends the browser back to the sign-in page).
      responses:
        '200':
          description: Signed out (also when no session existed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResult' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in principal, its UI capabilities and a fresh CSRF token
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      operationId: updateMyProfile
      summary: Change the display name or e-mail of a local account
      description: Accounts from an LDAP/OIDC provider get their profile from it at every sign-in (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/me/password:
    post:
      tags: [auth]
      operationId: changeMyPassword
      summary: Change the caller's local password (needs a signed-in session and the current password)
      description: |
        At least 12 characters, not the username, different from the current one. Clears `must_change_password`
        and ends the user's other sessions. Rate limited like sign-in. While a one-time password is pending, a
        session may only call this, `GET /auth/me` and sign-out (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/me/totp:
    get:
      tags: [auth]
      operationId: getMyTotp
      summary: The caller's two-factor sign-in (TOTP) state
      responses:
        '200':
          description: State
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/totp/setup:
    post:
      tags: [auth]
      operationId: startMyTotpSetup
      summary: Start setting up two-factor sign-in (local accounts; needs the current password)
      description: |
        Returns a new secret (once) as base32 and as an `otpauth://` URI, which the UI shows as a QR code rendered in
        the browser. It stays pending for 15 minutes until confirmed; starting again replaces it. 409 when it is
        already on or the account signs in through a provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpSetupRequest' }
      responses:
        '200':
          description: The pending secret
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/me/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmMyTotp
      summary: Turn two-factor sign-in on with a code from the app; returns the recovery codes once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
      responses:
        '200':
          description: On. The recovery codes are shown only now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpRecoveryCodes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/me/totp/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateMyRecoveryCodes
      summary: Replace the recovery codes (needs a code from the app); the old ones stop working
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
      responses:
        '200':
          description: The new recovery codes, shown only now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpRecoveryCodes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/me/totp/disable:
    post:
      tags: [auth]
      operationId: disableMyTotp
      summary: Turn two-factor sign-in off (current password and a code from the app or a recovery code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpDisable' }
      responses:
        '204': { description: Off }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/me/permissions:
    get:
      tags: [auth]
      operationId: getMyPermissions
      summary: What the caller may do (roles and where they come from, permissions, per-repository actions)
      responses:
        '200':
          description: Effective permissions (narrowed by the API token used, if any)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions:
    get:
      tags: [auth]
      operationId: listMySessions
      summary: The caller's sessions, newest first
      responses:
        '200':
          description: Sessions (ids are opaque and never usable as cookies)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [auth]
      operationId: revokeMyOtherSessions
      summary: Sign out everywhere else (end every session except the current one)
      responses:
        '200':
          description: How many sessions ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionsRevoked' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    delete:
      tags: [auth]
      operationId: revokeMySession
      summary: End one of the caller's sessions (the current one too, which also clears its cookies)
      responses:
        '204': { description: Ended }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth/me/preferences:
    put:
      tags: [auth]
      operationId: updatePreferences
      summary: Save UI preferences (theme, density) for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/tokens:
    get:
      tags: [tokens]
      operationId: listMyTokens
      summary: The caller's API tokens (newest first; secrets are never returned) and the scopes it may grant
      responses:
        '200':
          description: Tokens, including expired and revoked ones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      operationId: createMyToken
      summary: Create an API token (needs a signed-in session; the secret is in this response only)
      description: |
        Scopes may only be ones the owner holds (`available_scopes`); a token only ever narrows the owner's grants.
        `repositories` limits it further to matching repositories (names, globs, `format:<f>`, `type:<t>`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreate' }
      responses:
        '201':
          description: Created. Show `secret` once; it cannot be retrieved again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/me/tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [tokens]
      operationId: revokeMyToken
      summary: Revoke one of the caller's tokens (refused on every replica within a second)
      responses:
        '204': { description: Revoked (also when it was already revoked) }
        '404': { $ref: '#/components/responses/NotFound' }

  /tokens:
    get:
      tags: [tokens]
      operationId: listAllTokens
      summary: Every API token (newest first, up to 500); needs `user-admin`
      responses:
        '200':
          description: Tokens of all users and service accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke any token; needs `user-admin`
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /service-accounts:
    get:
      tags: [tokens]
      operationId: listServiceAccounts
      summary: Service accounts (non-human principals that authenticate with API tokens); needs `user-admin`
      responses:
        '200':
          description: Service accounts by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [tokens]
      operationId: createServiceAccount
      summary: Create a service account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /service-accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [tokens]
      operationId: getServiceAccount
      summary: One service account
      responses:
        '200':
          description: The service account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [tokens]
      operationId: updateServiceAccount
      summary: Change a service account's description, roles or disabled flag (effective at once)
      description: |
        Added roles must be ones the caller may grant; an account holding more than the caller (e.g. `admin`, for a
        `user-admin`) cannot be changed, deleted or given tokens by it (403).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [tokens]
      operationId: deleteServiceAccount
      summary: Delete a service account and revoke its tokens
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /service-accounts/{account_id}/tokens:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [tokens]
      operationId: listServiceAccountTokens
      summary: A service account's tokens and the scopes it may grant
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tokens]
      operationId: createServiceAccountToken
      summary: Create a token for a service account (the secret is in this response only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /service-accounts/{account_id}/permissions:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [tokens]
      operationId: getServiceAccountPermissions
      summary: What a service account may do
      responses:
        '200':
          description: Effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '404': { $ref: '#/components/responses/NotFound' }

  /service-accounts/{account_id}/tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [tokens]
      operationId: revokeServiceAccountToken
      summary: Revoke a service account's token
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Users by username (keyset paging); needs `user-admin`
      parameters:
        - { name: q, in: query, description: Username prefix, schema: { type: string, maxLength: 128 } }
        - name: source
          in: query
          description: '`local`, `ldap`, `oidc` (every provider of the kind) or one provider (`ldap:<id>`)'
          schema: { type: string, maxLength: 80 }
        - { name: disabled, in: query, schema: { type: boolean } }
        - { name: group, in: query, description: Local group id, schema: { type: string, maxLength: 64 } }
        - { name: role, in: query, description: Role held directly, schema: { type: string, maxLength: 64 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 400 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createUser
      summary: Create a local user
      description: |
        Without a password the account signs in only through an LDAP/OIDC provider with the same username (it is
        linked at the first sign-in), which lets an administrator give roles before then. With a password the user
        must change it at the next sign-in unless `must_change_password` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin]
      operationId: getUser
      summary: A user with its source, linked identities, groups and effective roles
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      operationId: updateUser
      summary: Change a user's profile, disabled flag, roles or local groups
      description: |
        Added roles and groups must be ones the caller may grant; a user holding more than the caller cannot be
        changed by it (403). Nobody can disable their own account, and the last enabled administrator cannot be
        disabled or demoted (409). Disabling ends the user's sessions; API tokens stop working at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Delete a user (its sessions end and its API tokens are revoked)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{user_id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin]
      operationId: resetUserPassword
      summary: Set a local user's password (every session of the user ends)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordReset' }
      responses:
        '204': { description: Set }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/{user_id}/unlock:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [admin]
      operationId: unlockUser
      summary: Clear a sign-in lockout
      responses:
        '200':
          description: Unlocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{user_id}/totp:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [admin]
      operationId: resetUserTotp
      summary: Remove a user's two-factor sign-in (lost device); not one's own
      description: The user signs in with the password alone and can set it up again. Audited (`auth.totp_disable`).
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{user_id}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin]
      operationId: getUserPermissions
      summary: What a user may do (roles and where they come from, permissions, per-repository actions)
      responses:
        '200':
          description: Effective permissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectivePermissions' }
        '404': { $ref: '#/components/responses/NotFound' }

  /groups:
    get:
      tags: [admin]
      operationId: listGroups
      summary: Local groups, then groups mapped from sign-in providers; needs `user-admin`
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [local, ldap, oidc] } }
      responses:
        '200':
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createGroup
      summary: Create a local group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /groups/{group_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [admin]
      operationId: getGroup
      summary: One group
      responses:
        '200':
          description: The group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      operationId: updateGroup
      summary: Rename or describe a local group, or change any group's roles
      description: Mapped groups only take role changes (409 for a name or description).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      operationId: deleteGroup
      summary: Delete a local group (mapped groups go with their provider's mapping)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /groups/{group_id}/members:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [admin]
      operationId: listGroupMembers
      summary: Members of a local group by username (mapped groups have no stored members)
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 400 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: A page of members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      operationId: addGroupMembers
      summary: Add users to a local group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupMembersAdd' }
      responses:
        '204': { description: Added }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /groups/{group_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [admin]
      operationId: removeGroupMember
      summary: Remove a user from a local group
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /anonymous-access:
    get:
      tags: [admin]
      operationId: getAnonymousAccess
      summary: The roles of requests without credentials; needs `user-admin`
      responses:
        '200':
          description: Anonymous access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousAccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: updateAnonymousAccess
      summary: Change what requests without credentials may do (repository permissions only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnonymousAccess' }
      responses:
        '200':
          description: Saved (applied by every replica within seconds)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnonymousAccess' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /users/{user_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [admin]
      operationId: listUserSessions
      summary: A user's sessions, newest first (`current` marks the caller's own session)
      responses:
        '200':
          description: Sessions (ids are opaque and never usable as cookies)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionInfo' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      operationId: revokeUserSessions
      summary: Sign a user out everywhere (every session ends; API tokens are not affected)
      description: A user holding more than the caller cannot be signed out by it (403). Audited as `session.revoke`.
      responses:
        '200':
          description: How many sessions ended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionsRevoked' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: Instance settings, and the limits set in the environment (read-only); needs `settings-admin`
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: updateSettings
      summary: Change the instance settings (applied by every replica within seconds; audited as `settings.update`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstanceSettingsWrite' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstanceSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /system:
    get:
      tags: [admin]
      operationId: getSystem
      summary: Version, MongoDB and Valkey health, and the data directory's usage; needs `admin`
      responses:
        '200':
          description: System status (always 200; a component that does not answer is `unavailable`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemInfo' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth-providers:
    get:
      tags: [admin]
      operationId: listAuthProviderConfigs
      summary: Configured external sign-in providers (LDAP, OIDC), in sign-in order
      description: Needs `settings-admin`. Secrets are never returned (`bind_password_set` / `client_secret_set` instead).
      responses:
        '200':
          description: Providers ordered by `order`, then name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthProviderConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createAuthProvider
      summary: Add an external sign-in provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth-providers/test-connection:
    post:
      tags: [admin]
      operationId: testAuthProviderConnection
      summary: "Check a (possibly unsaved) provider: every LDAP server (connect, TLS, service bind, search bases), or OIDC discovery, keys, PKCE and client credentials"
      description: Always 200 with the findings. Pass `id` to reuse the stored bind password or client secret when it is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderTestRequest' }
      responses:
        '200':
          description: Result per server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConnectionTest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth-providers/test-user:
    post:
      tags: [admin]
      operationId: testAuthProviderUser
      summary: Look a user up (and optionally check a password) with a (possibly unsaved) LDAP provider
      description: |
        Shows the attributes and groups the provider would sync, whether the require-group gate passes and the
        roles the group mapping gives. Needs `username`; `password` is optional (a bind is attempted only when
        given). Always 200 with the findings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderTestRequest' }
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderUserTest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth-providers/{id}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    get:
      tags: [admin]
      operationId: getAuthProviderConfig
      summary: One provider's configuration
      responses:
        '200':
          description: Provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      operationId: updateAuthProvider
      summary: Replace a provider's configuration and group mapping (`kind` cannot change)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      operationId: deleteAuthProvider
      summary: Delete a provider and its group mapping (its users stay but cannot sign in through it)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Roles that can be granted with their permissions (built-in first, then custom by id)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin]
      operationId: createRole
      summary: Create a custom role; needs `user-admin`
      description: |
        Permissions are `(action, scope)`; global actions only on `*`. Global permissions can only be added by a
        caller holding them (`admin`: administrators only).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      tags: [admin]
      operationId: getRole
      summary: A role with who holds it
      responses:
        '200':
          description: The role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      operationId: updateRole
      summary: Change a custom role (built-in roles are read-only, 409)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrite' }
      responses:
        '200':
          description: Updated (applied by every replica within seconds)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      operationId: deleteRole
      summary: Delete a custom role that nobody holds (409 while a user, group or service account does)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Audit log, newest first (needs `audit-read`; `admin` implies it)
      description: |
        Append-only record of security-relevant actions (SPEC §4.11). Filters combine with AND; `action` may be
        repeated (OR) and accepts a category wildcard such as `token.*`. Cursor paging, newest first.
      parameters:
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditTarget'
        - $ref: '#/components/parameters/AuditOutcome'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /audit/export:
    get:
      tags: [admin]
      operationId: exportAudit
      summary: Export the matching audit records (streamed CSV or NDJSON, newest first, at most 100 000 records)
      description: |
        Same filters as `GET /audit`. NDJSON lines are `AuditRecord` objects. CSV has one row per record with
        `changes` and `details` as JSON text; cells a spreadsheet would treat as a formula are prefixed with `'`.
        The response is an attachment. When the limit is reached the export stops and says so: the last NDJSON line
        is `{"truncated": true}`, the last CSV row starts with `# truncated`.
      parameters:
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditTarget'
        - $ref: '#/components/parameters/AuditOutcome'
        - name: format
          in: query
          schema: { type: string, enum: [csv, ndjson], default: csv }
      responses:
        '200':
          description: The export file
          content:
            text/csv:
              schema: { type: string }
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /repositories:
    get:
      tags: [repositories]
      operationId: listRepositories
      summary: Repositories the principal can browse, with 24 h summary stats
      parameters:
        - { name: format, in: query, schema: { $ref: '#/components/schemas/Format' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RepositoryType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RepositoryStatus' } }
        - name: q
          in: query
          description: Case-insensitive substring match on name and description
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of repositories, sorted by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [repositories]
      operationId: createRepository
      summary: Create a repository (M0 supports proxy repositories of docker, npm, apt and raw)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryWrite' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string }, description: URL of the new repository resource }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /repositories/test-upstream:
    post:
      tags: [repositories]
      operationId: testUpstream
      summary: Check an upstream before saving (reachability, authentication, sample latency)
      description: The URL passes the SSRF guard first; private targets fail unless `allow_private_upstream` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamTestRequest' }
      responses:
        '200':
          description: Result of the probe (a failing upstream is still a 200 with `reachable=false`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamTestResult' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /repositories/{name}:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [repositories]
      operationId: getRepository
      summary: One repository with configuration and summary stats
      responses:
        '200':
          description: Repository
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [repositories]
      operationId: updateRepository
      summary: Replace a repository's configuration (format and type are immutable; name may not change)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [repositories]
      operationId: deleteRepository
      summary: Delete a repository (its blobs are reclaimed later by GC)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/setup:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [repositories]
      operationId: getSetupGuide
      summary: '"Set me up" snippets per client for this repository'
      description: |
        Snippets are generated by the format plugin (`setup_snippets(repo, user)`) from `WAYSTATION_BASE_URL`.
        Credentials are never included: `{{TOKEN}}` and `{{USERNAME}}` placeholders mark where the user's own
        API token and username go (the UI masks and can fill them).
      responses:
        '200':
          description: Setup guide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupGuide' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/stats/traffic:
    parameters:
      - $ref: '#/components/parameters/RepoName'
      - $ref: '#/components/parameters/Range'
      - $ref: '#/components/parameters/TrafficMetric'
    get:
      tags: [stats]
      operationId: getRepositoryTraffic
      summary: Traffic for one repository, split hit vs upstream
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSeries' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/browse:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: browsePath
      summary: Generic folder listing of a repository's assets (raw repos, and the tree view of every format)
      parameters:
        - name: path
          in: query
          description: Folder path relative to the repository root, without leading slash; empty = root
          schema: { type: string, default: '', maxLength: 1024 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Folder entries, folders first then files, each sorted by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderListing' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/docker/images:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listDockerImages
      summary: Images cached or stored in a docker repository
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DockerImagePage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/docker/tags:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listDockerTags
      summary: Tags of one image
