openapi: 3.1.0
info:
  title: Waystation API (M0 contract)
  version: 0.1.0-m0
  summary: Contract-first REST + SSE API for the M0 feedback build.
  description: |
    Contract-first description of the Waystation REST API used by the web UI for milestone M0 (TASKS T-V01).
    The UI is built against MSW mocks generated from this file; the server lane implements the same schema and a
    contract test keeps them in step. Once the server generates its own OpenAPI document (SPEC §7), that document
    must remain compatible with this one.

    Conventions:
    - Everything lives under `/api/v1/`. JSON request and response bodies, UTF-8.
    - **Errors** are RFC 9457 `application/problem+json` (`Problem`). Validation errors carry field-level detail
      in `errors[]`, keyed by a dotted path into the request body (`proxy.upstream_url`).
    - **Authentication**: the UI uses the session cookie set by `POST /auth/login` (HttpOnly, Secure, SameSite=Lax).
      Scripts use `Authorization: Bearer <api-token>`.
    - **CSRF** (session-cookie requests only): double-submit token. Login and `GET /auth/me` return `csrf_token`;
      the server also sets it in the readable cookie `ws_csrf`. Every unsafe method (POST, PUT, PATCH, DELETE)
      sent with a session cookie must carry the same value in `X-CSRF-Token`, otherwise 403. Bearer requests are
      exempt.
    - **Authorization**: every route is checked by the RBAC engine. Objects the principal may not see return 404,
      never 403.
    - **Pagination**: opaque `cursor` + `limit`; responses carry `next_cursor` (null on the last page).
    - **Sizes** are bytes (integers), **rates** bytes or requests per second, **times** RFC 3339 UTC.
    - **Cache states** use one vocabulary everywhere (SPEC §4.7): `HIT`, `FETCHING`, `COALESCED`, `STALE`,
      `REVALIDATED`, `ERROR`.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: config
  - name: tokens
  - name: repositories
  - name: browse
  - name: search
  - name: stats
  - name: live
  - name: cleanup
  - name: admin
security:
  - session: []
  - bearer: []

paths:
  /config:
    get:
      tags: [config]
      operationId: getUiConfig
      summary: Public instance settings the UI needs before and after sign-in
      security: []
      responses:
        '200':
          description: Instance configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiConfig' }

  /auth/providers:
    get:
      tags: [auth]
      operationId: listAuthProviders
      summary: Sign-in options shown on the sign-in page
      security: []
      responses:
        '200':
          description: Providers in display order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthProvider' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Local (and LDAP) username/password sign-in; sets the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in. `Set-Cookie` carries the session and `ws_csrf` cookies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: Bad credentials (generic message; never says which part was wrong)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Too many attempts; `Retry-After` header set
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      description: |
        For a session that came from an OIDC provider with RP-initiated logout, `end_session_url` is the provider's
        sign-out page; the UI navigates there (the provider sends the browser back to the sign-in page).
      responses:
        '200':
          description: Signed out (also when no session existed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogoutResult' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in principal, its UI capabilities and a fresh CSRF token
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/preferences:
    put:
      tags: [auth]
      operationId: updatePreferences
      summary: Save UI preferences (theme, density) for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: Saved preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/tokens:
    get:
      tags: [tokens]
      operationId: listMyTokens
      summary: The caller's API tokens (newest first; secrets are never returned) and the scopes it may grant
      responses:
        '200':
          description: Tokens, including expired and revoked ones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      operationId: createMyToken
      summary: Create an API token (needs a signed-in session; the secret is in this response only)
      description: |
        Scopes may only be ones the owner holds (`available_scopes`); a token only ever narrows the owner's grants.
        `repositories` limits it further to matching repositories (names, globs, `format:<f>`, `type:<t>`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreate' }
      responses:
        '201':
          description: Created. Show `secret` once; it cannot be retrieved again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth/me/tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [tokens]
      operationId: revokeMyToken
      summary: Revoke one of the caller's tokens (refused on every replica within a second)
      responses:
        '204': { description: Revoked (also when it was already revoked) }
        '404': { $ref: '#/components/responses/NotFound' }

  /tokens:
    get:
      tags: [tokens]
      operationId: listAllTokens
      summary: Every API token (newest first, up to 500); needs `user-admin`
      responses:
        '200':
          description: Tokens of all users and service accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke any token; needs `user-admin`
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /service-accounts:
    get:
      tags: [tokens]
      operationId: listServiceAccounts
      summary: Service accounts (non-human principals that authenticate with API tokens); needs `user-admin`
      responses:
        '200':
          description: Service accounts by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [tokens]
      operationId: createServiceAccount
      summary: Create a service account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /service-accounts/{account_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    patch:
      tags: [tokens]
      operationId: updateServiceAccount
      summary: Change a service account's description, roles or disabled flag (effective at once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceAccountUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceAccount' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [tokens]
      operationId: deleteServiceAccount
      summary: Delete a service account and revoke its tokens
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /service-accounts/{account_id}/tokens:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [tokens]
      operationId: listServiceAccountTokens
      summary: A service account's tokens and the scopes it may grant
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [tokens]
      operationId: createServiceAccountToken
      summary: Create a token for a service account (the secret is in this response only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiTokenCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /service-accounts/{account_id}/tokens/{token_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [tokens]
      operationId: revokeServiceAccountToken
      summary: Revoke a service account's token
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /auth-providers:
    get:
      tags: [admin]
      operationId: listAuthProviderConfigs
      summary: Configured external sign-in providers (LDAP, OIDC), in sign-in order
      description: Needs `settings-admin`. Secrets are never returned (`bind_password_set` / `client_secret_set` instead).
      responses:
        '200':
          description: Providers ordered by `order`, then name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthProviderConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: createAuthProvider
      summary: Add an external sign-in provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth-providers/test-connection:
    post:
      tags: [admin]
      operationId: testAuthProviderConnection
      summary: "Check a (possibly unsaved) provider: every LDAP server (connect, TLS, service bind, search bases), or OIDC discovery, keys, PKCE and client credentials"
      description: Always 200 with the findings. Pass `id` to reuse the stored bind password or client secret when it is omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderTestRequest' }
      responses:
        '200':
          description: Result per server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConnectionTest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth-providers/test-user:
    post:
      tags: [admin]
      operationId: testAuthProviderUser
      summary: Look a user up (and optionally check a password) with a (possibly unsaved) LDAP provider
      description: |
        Shows the attributes and groups the provider would sync, whether the require-group gate passes and the
        roles the group mapping gives. Needs `username`; `password` is optional (a bind is attempted only when
        given). Always 200 with the findings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderTestRequest' }
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderUserTest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /auth-providers/{id}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    get:
      tags: [admin]
      operationId: getAuthProviderConfig
      summary: One provider's configuration
      responses:
        '200':
          description: Provider
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      operationId: updateAuthProvider
      summary: Replace a provider's configuration and group mapping (`kind` cannot change)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthProviderWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthProviderConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [admin]
      operationId: deleteAuthProvider
      summary: Delete a provider and its group mapping (its users stay but cannot sign in through it)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /roles:
    get:
      tags: [admin]
      operationId: listRoles
      summary: Roles that can be granted (built-in roles; custom roles come later)
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Audit log, newest first (needs `audit-read`; `admin` implies it)
      description: |
        Append-only record of security-relevant actions (SPEC §4.11). Filters combine with AND; `action` may be
        repeated (OR) and accepts a category wildcard such as `token.*`. Cursor paging, newest first.
      parameters:
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditTarget'
        - $ref: '#/components/parameters/AuditOutcome'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /audit/export:
    get:
      tags: [admin]
      operationId: exportAudit
      summary: Export the matching audit records (streamed CSV or NDJSON, newest first, at most 100 000 records)
      description: |
        Same filters as `GET /audit`. NDJSON lines are `AuditRecord` objects. CSV has one row per record with
        `changes` and `details` as JSON text; cells a spreadsheet would treat as a formula are prefixed with `'`.
        The response is an attachment. When the limit is reached the export stops and says so: the last NDJSON line
        is `{"truncated": true}`, the last CSV row starts with `# truncated`.
      parameters:
        - $ref: '#/components/parameters/AuditFrom'
        - $ref: '#/components/parameters/AuditTo'
        - $ref: '#/components/parameters/AuditActor'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditTarget'
        - $ref: '#/components/parameters/AuditOutcome'
        - name: format
          in: query
          schema: { type: string, enum: [csv, ndjson], default: csv }
      responses:
        '200':
          description: The export file
          content:
            text/csv:
              schema: { type: string }
            application/x-ndjson:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /repositories:
    get:
      tags: [repositories]
      operationId: listRepositories
      summary: Repositories the principal can browse, with 24 h summary stats
      parameters:
        - { name: format, in: query, schema: { $ref: '#/components/schemas/Format' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RepositoryType' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RepositoryStatus' } }
        - name: q
          in: query
          description: Case-insensitive substring match on name and description
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of repositories, sorted by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [repositories]
      operationId: createRepository
      summary: Create a repository (M0 supports proxy repositories of docker, npm, apt and raw)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryWrite' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string }, description: URL of the new repository resource }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /repositories/test-upstream:
    post:
      tags: [repositories]
      operationId: testUpstream
      summary: Check an upstream before saving (reachability, authentication, sample latency)
      description: The URL passes the SSRF guard first; private targets fail unless `allow_private_upstream` is set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpstreamTestRequest' }
      responses:
        '200':
          description: Result of the probe (a failing upstream is still a 200 with `reachable=false`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpstreamTestResult' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /repositories/{name}:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [repositories]
      operationId: getRepository
      summary: One repository with configuration and summary stats
      responses:
        '200':
          description: Repository
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [repositories]
      operationId: updateRepository
      summary: Replace a repository's configuration (format and type are immutable; name may not change)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [repositories]
      operationId: deleteRepository
      summary: Delete a repository (its blobs are reclaimed later by GC)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/setup:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [repositories]
      operationId: getSetupGuide
      summary: '"Set me up" snippets per client for this repository'
      description: |
        Snippets are generated by the format plugin (`setup_snippets(repo, user)`) from `WAYSTATION_BASE_URL`.
        Credentials are never included: `{{TOKEN}}` and `{{USERNAME}}` placeholders mark where the user's own
        API token and username go (the UI masks and can fill them).
      responses:
        '200':
          description: Setup guide
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupGuide' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/stats/traffic:
    parameters:
      - $ref: '#/components/parameters/RepoName'
      - $ref: '#/components/parameters/Range'
      - $ref: '#/components/parameters/TrafficMetric'
    get:
      tags: [stats]
      operationId: getRepositoryTraffic
      summary: Traffic for one repository, split hit vs upstream
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSeries' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/browse:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: browsePath
      summary: Generic folder listing of a repository's assets (raw repos, and the tree view of every format)
      parameters:
        - name: path
          in: query
          description: Folder path relative to the repository root, without leading slash; empty = root
          schema: { type: string, default: '', maxLength: 1024 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Folder entries, folders first then files, each sorted by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderListing' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/docker/images:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listDockerImages
      summary: Images cached or stored in a docker repository
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Images
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DockerImagePage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/docker/tags:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listDockerTags
      summary: Tags of one image
      parameters:
        - $ref: '#/components/parameters/DockerImage'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tags, most recently updated first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DockerTagPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/docker/manifest:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: getDockerManifest
      summary: Manifest (or index) for a tag or digest, with platforms and layers
      parameters:
        - $ref: '#/components/parameters/DockerImage'
        - name: reference
          in: query
          required: true
          description: Tag or `sha256:` digest
          schema: { type: string, maxLength: 200 }
        - name: platform
          in: query
          description: For an index, select one platform (`os/arch[/variant]`); default is the first
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Manifest detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DockerManifest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/npm/packages:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listNpmPackages
      summary: Packages cached or stored in an npm repository
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 214 } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NpmPackagePage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/npm/versions:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listNpmVersions
      summary: One package and its versions (newest first)
      parameters:
        - name: package
          in: query
          required: true
          description: Package name, scoped names as `@scope/name`
          schema: { type: string, maxLength: 214 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NpmVersionPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/apt/suites:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listAptSuites
      summary: Suites seen through an apt repository, with components and architectures
      responses:
        '200':
          description: Suites
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AptSuite' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/apt/packages:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [browse]
      operationId: listAptPackages
      summary: Packages listed by a cached index (suite/component/arch), with cache state per package
      parameters:
        - { name: suite, in: query, required: true, schema: { type: string, maxLength: 100 } }
        - { name: component, in: query, schema: { type: string, maxLength: 100 } }
        - { name: arch, in: query, schema: { type: string, maxLength: 32 } }
        - name: cached
          in: query
          description: Only packages whose `.deb` is in the cache
          schema: { type: boolean }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AptPackagePage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /repositories/{name}/cleanup:
    parameters:
      - $ref: '#/components/parameters/RepoName'
    get:
      tags: [cleanup]
      operationId: getRepositoryCleanup
      summary: Cleanup policies attached to a repository (needs `manage` on it)
      responses:
        '200':
          description: Attached policies, in run order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryCleanup' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [cleanup]
      operationId: setRepositoryCleanup
      summary: Attach cleanup policies to a repository (replaces the list; needs `manage` on it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepositoryCleanupUpdate' }
      responses:
        '200':
          description: Attached policies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RepositoryCleanup' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /cleanup-policies:
    get:
      tags: [cleanup]
      operationId: listCleanupPolicies
      summary: Cleanup policies by name (needs `admin`, or `manage` on a repository to pick policies to attach)
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicyList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [cleanup]
      operationId: createCleanupPolicy
      summary: Create a cleanup policy (needs `admin`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupPolicyWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /cleanup-policies/preview:
    post:
      tags: [cleanup]
      operationId: previewCleanup
      summary: Dry run of a (saved or draft) policy - what a run would remove now, with sizes; removes nothing
      description: |
        Evaluates the criteria against the repositories exactly as a run does (the same code), so the preview
        equals the result of running the policy now. `limit: 0` returns only the totals (live counts in the editor).
        Repositories: the request's list; else the saved policy's attached repositories (`policy_id`); else every
        repository of the policy's format. Needs `admin`, or `manage` on every listed repository.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupPreviewRequest' }
      responses:
        '200':
          description: What would be removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /cleanup-policies/{policy_id}:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [cleanup]
      operationId: getCleanupPolicy
      summary: One cleanup policy
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicy' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [cleanup]
      operationId: updateCleanupPolicy
      summary: Replace a cleanup policy (needs `admin`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupPolicyWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [cleanup]
      operationId: deleteCleanupPolicy
      summary: Delete a cleanup policy (detaches it from every repository; needs `admin`)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /cleanup-policies/{policy_id}/run:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    post:
      tags: [cleanup]
      operationId: runCleanupPolicy
      summary: Run a policy now on its attached repositories (a worker job; needs `admin`)
      responses:
        '202':
          description: Queued (or merged into a pending run of the same policy)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cleanup-policies/{policy_id}/runs:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [cleanup]
      operationId: listCleanupRuns
      summary: The policy's recent runs (newest first, up to 50) with progress and what they removed
      responses:
        '200':
          description: Runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupRunList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /maintenance/gc:
    get:
      tags: [cleanup]
      operationId: getBlobGc
      summary: Blob garbage collection status - schedule, grace period, pending and recent runs (needs `admin`)
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GcStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /maintenance/gc/run:
    post:
      tags: [cleanup]
      operationId: runBlobGc
      summary: Run blob garbage collection now (a worker job; needs `admin`)
      responses:
        '202':
          description: Queued (or merged into a pending run)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /search:
    get:
      tags: [search]
      operationId: search
      summary: Search packages, images and files across every repository the principal can browse
      description: |
        Name search: `q` is `<name prefix>[ <version prefix>]`, case-insensitive; the name prefix matches a full name
        or its last `/` segment (`nginx` finds `library/nginx`, `node` finds `@types/node`). Sources: docker tags,
        npm packages, apt and yum index listings, cached files (by file name; not docker layers). Results are ordered
        by the matched name. An empty `q` lists everything.
        Digest search: `sha256:<8-64 hex digits>` or 64 hex digits finds every cached file with that blob in any
        repository and format, and the docker tags pointing at it.
        Hidden repositories are never searched: they appear in no result, count or facet value.
        Facets (first page): counts per value with every other filter applied.
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 256, default: '' }
        - name: format
          in: query
          description: Repeat to select several (OR)
          schema:
            type: array
            maxItems: 20
            items: { $ref: '#/components/schemas/Format' }
        - name: repository
          in: query
          description: Repository names; repeat to select several (OR)
          schema:
            type: array
            maxItems: 50
            items: { type: string }
        - name: kind
          in: query
          schema:
            type: array
            maxItems: 3
            items: { $ref: '#/components/schemas/SearchKind' }
        - name: type
          in: query
          description: Repository types
          schema:
            type: array
            maxItems: 3
            items: { $ref: '#/components/schemas/RepositoryType' }
        - name: cached
          in: query
          description: Only what is in the cache (leaves out apt/yum index listings; downloaded packages are still found as files)
          schema: { type: boolean, default: false }
        - name: facets
          in: query
          description: Facet counts on the first page
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: One page of results (and facets on the first page)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400':
          description: Invalid cursor
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /stats/summary:
    get:
      tags: [stats]
      operationId: getStatsSummary
      summary: Dashboard KPIs with a sparkline per KPI over the range
      parameters:
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          description: KPI summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsSummary' }

  /stats/traffic:
    get:
      tags: [stats]
      operationId: getTraffic
      summary: Traffic over time, split by cache (hit vs upstream) or by format
      parameters:
        - $ref: '#/components/parameters/Range'
        - $ref: '#/components/parameters/TrafficMetric'
        - name: split
          in: query
          schema: { type: string, enum: [cache, format], default: cache }
        - name: repo
          in: query
          description: Restrict to one repository
          schema: { type: string }
      responses:
        '200':
          description: Time series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeSeries' }

  /stats/storage:
    get:
      tags: [stats]
      operationId: getStorage
      summary: Data directory usage and stored bytes by format and repository
      responses:
        '200':
          description: Storage summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageSummary' }

  /stats/upstreams:
    get:
      tags: [stats]
      operationId: listUpstreamHealth
      summary: Health of every proxy repository's upstream (incl. Docker Hub rate limit)
      responses:
        '200':
          description: One entry per proxy repository
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UpstreamHealth' }

  /transfers:
    get:
      tags: [live]
      operationId: listTransfers
      summary: Current in-flight transfers (the state a client loads before following the event stream)
      parameters:
        - { name: repo, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { $ref: '#/components/schemas/Format' } }
      responses:
        '200':
          description: Active transfers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransferList' }

  /activity:
    get:
      tags: [live]
      operationId: listActivity
      summary: Recent activity, newest first
      description: |
        Filters combine (AND). A page holds at most `limit` events; with a sparse filter it may hold fewer while
        `next_cursor` is still set (the server bounds how much history one call reads), so keep paging until
        `next_cursor` is null. Only repositories the caller may see are included.
      parameters:
        - $ref: '#/components/parameters/ActivityRepo'
        - $ref: '#/components/parameters/ActivityKindParam'
        - $ref: '#/components/parameters/ActivityFormat'
        - $ref: '#/components/parameters/ActivityPrincipal'
        - $ref: '#/components/parameters/ActivityCache'
        - $ref: '#/components/parameters/ActivityOutcome'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /activity/export:
    get:
      tags: [live]
      operationId: exportActivity
      summary: The filtered activity as CSV (download)
      description: |
        Same filters as `GET /activity`, streamed newest first as `text/csv` (UTF-8, CRLF, header row:
        `time,kind,outcome,repository,format,artifact,path,principal,cache,bytes,duration_ms,summary,id`), at most
        100,000 rows. Text cells that a spreadsheet would read as a formula are prefixed with `'`.
      parameters:
        - $ref: '#/components/parameters/ActivityRepo'
        - $ref: '#/components/parameters/ActivityKindParam'
        - $ref: '#/components/parameters/ActivityFormat'
        - $ref: '#/components/parameters/ActivityPrincipal'
        - $ref: '#/components/parameters/ActivityCache'
        - $ref: '#/components/parameters/ActivityOutcome'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
      responses:
        '200':
          description: 'CSV file, sent as an attachment'
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /events/stream:
    get:
      tags: [live]
      operationId: streamEvents
      summary: Server-Sent Events stream (live transfers, stats ticks, activity)
      description: |
        One long-lived `text/event-stream` per browser tab. Topics (comma-separated `topics` query parameter):
        `transfers` (live transfer state), `stats` (1 Hz KPI ticks), `activity` (durable events),
        `repo:<name>` (all of the above restricted to one repository). Every topic is RBAC-filtered per subscriber.

        Framing: each message has `event: <LiveEvent.type>` and `data: <JSON LiveEvent>`. Only events from the
        durable activity stream carry an `id:`; send it back as `Last-Event-ID` on reconnect to resume. Live
        transfer state is not replayed: on (re)connect the server first sends one `transfers.snapshot` event with the
        current state of every in-flight transfer. `transfer.progress` is coalesced to at most 4 Hz per transfer.
        A comment line (`: hb`) is sent every 15 s as a heartbeat. The server suggests `retry: 3000`.
      parameters:
        - name: topics
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, pattern: '^(transfers|stats|activity|repo:[A-Za-z0-9][A-Za-z0-9._-]{1,62})$' }
        - name: Last-Event-ID
          in: header
          description: Sent by the browser on automatic reconnects
          schema: { type: string }
        - name: last_event_id
          in: query
          description: Same as the header, for clients that reopen the stream themselves (EventSource cannot set headers)
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Event stream. The payload of each `data:` line is a `LiveEvent`.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/LiveEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: ws_session
      description: Session cookie set by `POST /auth/login`; unsafe methods also need `X-CSRF-Token`.
    bearer:
      type: http
      scheme: bearer
      description: API token

  parameters:
    RepoName:
      name: name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RepositoryName' }
    ProviderId:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    Range:
      name: range
      in: query
      schema: { $ref: '#/components/schemas/StatsRange' }
    ActivityRepo:
      name: repo
      in: query
      description: Repository name (exact)
      schema: { type: string }
    ActivityKindParam:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/ActivityKind' }
    ActivityFormat:
      name: format
      in: query
      schema: { $ref: '#/components/schemas/Format' }
    ActivityPrincipal:
      name: principal
      in: query
      description: User name or client address (case-insensitive substring)
      schema: { type: string, maxLength: 128 }
    ActivityCache:
      name: cache
      in: query
      schema: { $ref: '#/components/schemas/CacheState' }
    ActivityOutcome:
      name: outcome
      in: query
      schema: { type: string, enum: [success, failure, info] }
    Since:
      name: since
      in: query
      description: Only events at or after this time (RFC 3339)
      schema: { type: string, format: date-time }
    Until:
      name: until
      in: query
      description: Only events at or before this time (RFC 3339)
      schema: { type: string, format: date-time }
    TrafficMetric:
      name: metric
      in: query
      schema: { type: string, enum: [bytes, requests], default: bytes }
    PolicyId:
      name: policy_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    TokenId:
      name: token_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    DockerImage:
      name: image
      in: query
      required: true
      description: Image name within the repository, e.g. `library/nginx`
      schema: { type: string, maxLength: 255 }

    AuditFrom:
      name: from
      in: query
      description: Records at or after this time (RFC 3339)
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: Records before this time (RFC 3339)
      schema: { type: string, format: date-time }
    AuditActor:
      name: actor
      in: query
      description: Who acted, by name (`admin`, `ci-bot`, `anonymous`) or id
      schema: { type: string, maxLength: 256 }
    AuditAction:
      name: action
      in: query
      description: An action (`token.create`) or a category wildcard (`token.*`); repeat for several
      style: form
      explode: true
      schema:
        type: array
        maxItems: 20
        items: { type: string, maxLength: 64 }
    AuditTarget:
      name: target
      in: query
      description: The object acted on, by name (`dockerhub-proxy`) or id
      schema: { type: string, maxLength: 256 }
    AuditOutcome:
      name: outcome
      in: query
      schema: { $ref: '#/components/schemas/AuditOutcome' }

  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Signed in but not allowed (only for objects the principal can see)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Does not exist or is not visible to the principal
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with an existing object (e.g. repository name taken, case-insensitively)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationFailed:
      description: Request body failed validation; `errors[]` has field-level detail
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---------------------------------------------------------------- common
    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type: { type: string, description: 'URI reference identifying the problem type; `about:blank` when generic' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string, description: 'Dotted path into the request body, e.g. `proxy.upstream_url`' }
        message: { type: string }
        code: { type: string, description: 'Machine-readable reason, e.g. `required`, `pattern`, `taken`' }
    Format:
      type: string
      description: Package format. M0 implements docker, npm, apt and raw; the rest are reserved.
      enum: [docker, npm, apt, raw, yum, pypi, maven, go, helm, terraform, galaxy, swift, nuget, cargo, rubygems, composer, conda, apk, huggingface]
    RepositoryType:
      type: string
      enum: [proxy, hosted, group]
    RepositoryStatus:
      type: string
      description: '`ok`, `degraded` (serving stale / errors), `blocked` (auto-blocked upstream), `offline` (offline mode or disabled)'
      enum: [ok, degraded, blocked, offline]
    CacheState:
      type: string
      enum: [HIT, FETCHING, COALESCED, STALE, REVALIDATED, ERROR]
    StatsRange:
      type: string
      enum: [15m, 1h, 24h, 7d, 30d]
      default: 24h
    RepositoryName:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,62}$'
    Timestamp:
      type: string
      format: date-time

    # ---------------------------------------------------------------- config & auth
    UiConfig:
      type: object
      required: [instance_name, base_url, version, docker]
      properties:
        instance_name: { type: string, description: Shown in the top bar and the sign-in page }
        base_url: { type: string, format: uri, description: '`WAYSTATION_BASE_URL`, used to build client URLs' }
        version: { type: string }
        docker:
          type: object
          required: [registry_host, default_repo]
          properties:
            registry_host: { type: string, description: 'Host (and port) docker clients use, e.g. `registry.example.com`' }
            default_repo: { type: [string, 'null'], description: Repository receiving unprefixed names and mirror-mode pulls }
    AuthProvider:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string }
        kind: { type: string, enum: [local, ldap, oidc] }
        name: { type: string, description: 'Display name ("Continue with <name>" for OIDC)' }
        login_url: { type: [string, 'null'], description: 'OIDC only; the browser navigates here (append `?next=<SPA path>`)' }
    LogoutResult:
      type: object
      required: [end_session_url]
      properties:
        end_session_url: { type: [string, 'null'], description: "The OIDC provider's sign-out page (RP-initiated logout), if any" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 256 }
        password: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
        provider: { type: string, description: 'Provider id when several password providers exist; default: resolved automatically' }
    Preferences:
      type: object
      required: [theme, density]
      properties:
        theme: { type: string, enum: [light, dark, system] }
        density: { type: string, enum: [comfortable, compact] }
    User:
      type: object
      required: [id, username, display_name, source]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        source: { type: string, description: '`local`, `ldap:<provider>` or `oidc:<provider>`' }
    Session:
      type: object
      required: [user, csrf_token, capabilities, preferences, expires_at]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrf_token: { type: string, description: Echo in `X-CSRF-Token` on unsafe methods }
        capabilities:
          type: array
          description: |
            Coarse UI hints derived from the principal's grants (which menu items and buttons to show). They never
            replace server-side checks. M0 values: `repositories.create`, `repositories.manage`, `stats.read`, `audit.read`,
            `admin`.
          items: { type: string }
        preferences: { $ref: '#/components/schemas/Preferences' }
        expires_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------------------------------------------------------------- API tokens and service accounts
    TokenScope:
      type: string
      description: |
        What a token may be used for; it never exceeds the owner's own grants. `read`: browse, pull, download,
        install. `write`: + push/upload. `delete`: + delete. `manage`: + repository settings. `stats-read`:
        dashboards and stats API. `metrics`: the Prometheus `/metrics` endpoint. `admin`: everything the owner may do.
      enum: [read, write, delete, manage, stats-read, metrics, admin]
    TokenOwnerRef:
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [user, service_account] }
        id: { type: string }
        name: { type: string }
    ApiToken:
      type: object
      required: [id, name, prefix, owner, scopes, repositories, status, expires_at, created_at, last_used_at, last_used_ip, revoked_at]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: 'The first characters of the token, for recognising it (`wst_` + 8)' }
        owner: { $ref: '#/components/schemas/TokenOwnerRef' }
        scopes:
          type: array
          items: { $ref: '#/components/schemas/TokenScope' }
        repositories:
          type: array
          description: Repository patterns the token is limited to; empty = all
          items: { type: string }
        status: { type: string, enum: [active, expired, revoked] }
        expires_at: { type: [string, 'null'], format: date-time, description: null = never expires }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        last_used_at: { type: [string, 'null'], format: date-time, description: Recorded at most once a minute }
        last_used_ip: { type: [string, 'null'] }
        revoked_at: { type: [string, 'null'], format: date-time }
    ApiTokenList:
      type: object
      required: [items, available_scopes]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApiToken' }
        available_scopes:
          type: array
          description: Scopes the owner may put on a new token
          items: { $ref: '#/components/schemas/TokenScope' }
    ApiTokenCreate:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64, description: 'What the token is for, e.g. `CI pipeline`' }
        scopes:
          type: array
          minItems: 1
          maxItems: 7
          items: { $ref: '#/components/schemas/TokenScope' }
        repositories:
          type: array
          maxItems: 20
          description: 'Limit the token to these repositories: names, globs (`docker-*`), `format:<f>`, `type:<t>`'
          items: { type: string }
        expires_at: { type: [string, 'null'], format: date-time, description: null = never expires }
    ApiTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: { $ref: '#/components/schemas/ApiToken' }
        secret: { type: string, description: The token. Shown only in this response; store it now }
    ServiceAccount:
      type: object
      required: [id, name, description, roles, disabled, active_tokens, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        roles:
          type: array
          items: { type: string }
        disabled: { type: boolean }
        active_tokens: { type: integer }
        created_at: { $ref: '#/components/schemas/Timestamp' }
    ServiceAccountCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 63, description: 'Lower case letters, digits, `.`, `_`, `-`' }
        description: { type: string, maxLength: 500, default: '' }
        roles:
          type: array
          maxItems: 20
          items: { type: string, description: 'Built-in roles: `admin`, `reader`, `deployer`, `viewer`' }
    ServiceAccountUpdate:
      type: object
      additionalProperties: false
      properties:
        description: { type: [string, 'null'], maxLength: 500 }
        roles:
          type: [array, 'null']
          maxItems: 20
          items: { type: string }
        disabled: { type: [boolean, 'null'] }

    # ---------------------------------------------------------------- administration: sign-in providers, roles
    Role:
      type: object
      required: [id, name, description, builtin]
      properties:
        id: { type: string, description: 'Role id used in grants and group mappings, e.g. `deployer`' }
        name: { type: string }
        description: { type: string }
        builtin: { type: boolean }
    LdapConnection:
      type: object
      required: [servers, security]
      description: Servers are tried in order; one that cannot be reached is skipped for 30 s (failover).
      properties:
        servers:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 512 }
          description: '`host`, `host:port`, `ldap://host[:port]` or `ldaps://host[:port]`'
        security: { type: string, enum: [ldaps, starttls, none], description: '`none` sends passwords in clear text (testing only)' }
        ca_pem: { type: [string, 'null'], maxLength: 65536, description: 'PEM CA bundle to trust instead of the system store' }
        bind_dn: { type: [string, 'null'], maxLength: 1024, description: 'Service account for searches; empty = anonymous search' }
        bind_password: { type: [string, 'null'], writeOnly: true, maxLength: 1024, description: 'Omit or null on update to keep the stored password' }
        bind_password_set: { type: boolean, readOnly: true }
        connect_timeout_s: { type: number, minimum: 1, maximum: 30, default: 5 }
        timeout_s: { type: number, minimum: 1, maximum: 60, default: 10 }
    LdapUsers:
      type: object
      required: [base_dn]
      properties:
        base_dn: { type: string, minLength: 1, maxLength: 1024 }
        filter: { type: string, maxLength: 1024, default: '(objectClass=person)', description: 'ANDed with `(<username_attribute>=<name>)`' }
        username_attribute: { type: string, maxLength: 128, default: uid }
        display_name_attribute: { type: string, maxLength: 128, default: cn }
        email_attribute: { type: string, maxLength: 128, default: mail }
    LdapGroups:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [none, member_of, search], description: '`member_of` reads the user''s `member_of_attribute`; `search` finds groups that list the user' }
        base_dn: { type: [string, 'null'], maxLength: 1024, description: Needed for `search` }
        filter: { type: string, maxLength: 1024, default: '(objectClass=groupOfNames)' }
        member_attribute: { type: string, maxLength: 128, default: member }
        member_value: { type: string, enum: [dn, username], default: dn, description: '`username` for `posixGroup` / `memberUid`' }
        name_attribute: { type: string, maxLength: 128, default: cn }
        member_of_attribute: { type: string, maxLength: 128, default: memberOf }
        nested: { type: boolean, default: false, description: Also follow groups that are members of groups }
        require_group: { type: [string, 'null'], maxLength: 1024, description: 'Only members of this group (DN or name) may sign in' }
    LdapConfig:
      type: object
      required: [connection, users, groups]
      properties:
        connection: { $ref: '#/components/schemas/LdapConnection' }
        users: { $ref: '#/components/schemas/LdapUsers' }
        groups: { $ref: '#/components/schemas/LdapGroups' }
        cache_ttl_s: { type: integer, minimum: 0, maximum: 900, default: 60, description: 'How long a successful password check is reused by format clients (0 = never)' }
    GroupMapping:
      type: object
      required: [external_group, roles]
      properties:
        external_group: { type: string, minLength: 1, maxLength: 1024, description: 'Group DN or name (case-insensitive)' }
        roles:
          type: array
          maxItems: 20
          items: { type: string }
    OidcConfig:
      type: object
      required: [issuer, client_id]
      description: |
        OpenID Connect provider (authorization code + PKCE S256). Register `redirect_uri` (and
        `post_logout_redirect_uri` for RP-initiated logout) at the provider.
      properties:
        issuer: { type: string, minLength: 1, maxLength: 2048, description: 'Issuer URL exactly as the provider states it; discovery reads `<issuer>/.well-known/openid-configuration`. http only with `allow_private`.' }
        client_id: { type: string, minLength: 1, maxLength: 256 }
        client_secret: { type: [string, 'null'], writeOnly: true, maxLength: 4096, description: 'Omit or null on update to keep the stored secret' }
        client_secret_set: { type: boolean, readOnly: true }
        client_auth: { type: string, enum: [client_secret_basic, client_secret_post, none], default: client_secret_basic, description: '`none` = public client (PKCE only)' }
        scopes:
          type: array
          maxItems: 20
          default: [openid, profile, email]
          items: { type: string, minLength: 1, maxLength: 128 }
          description: '`openid` is always sent'
        username_claim: { type: string, minLength: 1, maxLength: 256, default: preferred_username }
        display_name_claim: { type: string, minLength: 1, maxLength: 256, default: name }
        email_claim: { type: string, minLength: 1, maxLength: 256, default: email }
        groups_claim: { type: [string, 'null'], minLength: 1, maxLength: 256, default: groups, description: 'Claim listing the groups (dotted path allowed, e.g. `realm_access.roles`); null = no group sync' }
        require_group: { type: [string, 'null'], maxLength: 1024, description: Only members of this group may sign in }
        auto_provision: { type: boolean, default: true, description: Create a Waystation user at the first sign-in }
        use_userinfo: { type: boolean, default: false, description: Also read claims from the userinfo endpoint }
        rp_logout: { type: boolean, default: true, description: Also sign out at the provider when it supports RP-initiated logout }
        allow_private: { type: boolean, default: false, description: 'The provider may resolve to private addresses (SSRF guard)' }
        signing_algs:
          type: array
          minItems: 1
          maxItems: 12
          items: { type: string, enum: [RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512, EdDSA, Ed25519] }
          description: 'Accepted ID token algorithms (asymmetric only; `none` and HMAC are never accepted)'
        timeout_s: { type: number, minimum: 1, maximum: 60, default: 10 }
        redirect_uri: { type: string, readOnly: true, description: Register at the provider }
        post_logout_redirect_uri: { type: string, readOnly: true, description: Register at the provider }
    AuthProviderWrite:
      type: object
      required: [kind, name]
      description: '`ldap` for kind `ldap`, `oidc` for kind `oidc` (the other one omitted or null)'
      properties:
        kind: { type: string, enum: [ldap, oidc] }
        name: { type: string, minLength: 1, maxLength: 64, description: Shown on the sign-in page }
        enabled: { type: boolean, default: true }
        order: { type: integer, minimum: 0, maximum: 1000, default: 100, description: Sign-in order (lowest first) }
        ldap: { oneOf: [{ $ref: '#/components/schemas/LdapConfig' }, { type: 'null' }] }
        oidc: { oneOf: [{ $ref: '#/components/schemas/OidcConfig' }, { type: 'null' }] }
        group_mapping:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/GroupMapping' }
    AuthProviderConfig:
      type: object
      required: [id, kind, name, enabled, order, ldap, oidc, group_mapping, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ldap, oidc] }
        name: { type: string }
        enabled: { type: boolean }
        order: { type: integer }
        ldap: { oneOf: [{ $ref: '#/components/schemas/LdapConfig' }, { type: 'null' }] }
        oidc: { oneOf: [{ $ref: '#/components/schemas/OidcConfig' }, { type: 'null' }] }
        group_mapping:
          type: array
          items: { $ref: '#/components/schemas/GroupMapping' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
    AuthProviderTestRequest:
      type: object
      required: [provider]
      properties:
        id: { type: [string, 'null'], maxLength: 64, description: 'Saved provider whose bind password is reused when `provider` omits it' }
        provider: { $ref: '#/components/schemas/AuthProviderWrite' }
        username: { type: [string, 'null'], maxLength: 256, description: Needed by test-user }
        password: { type: [string, 'null'], writeOnly: true, maxLength: 1024, description: 'test-user only; also check this password' }
    ProviderCheck:
      type: object
      required: [name, ok, message]
      properties:
        name: { type: string, description: '`connect`, `tls`, `bind`, `user_base`, `group_base`, `search`, `password`, `groups`, `require_group`' }
        ok: { type: boolean }
        message: { type: string }
    LdapServerTest:
      type: object
      required: [server, ok, latency_ms, checks]
      properties:
        server: { type: string }
        ok: { type: boolean }
        latency_ms: { type: [number, 'null'] }
        tls: { type: [string, 'null'], description: 'Negotiated protocol and certificate subject' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ProviderCheck' }
    AuthProviderConnectionTest:
      type: object
      required: [ok, servers]
      properties:
        ok: { type: boolean, description: Every server passed }
        servers:
          type: array
          description: 'LDAP: one entry per server. OIDC: one entry (the issuer) with the discovery checks'
          items: { $ref: '#/components/schemas/LdapServerTest' }
        discovery: { oneOf: [{ $ref: '#/components/schemas/OidcDiscovery' }, { type: 'null' }], description: 'OIDC: what discovery found' }
    OidcDiscovery:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri, userinfo_endpoint, end_session_endpoint, signing_algs, scopes_supported, keys, redirect_uri, post_logout_redirect_uri]
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        jwks_uri: { type: string }
        userinfo_endpoint: { type: [string, 'null'] }
        end_session_endpoint: { type: [string, 'null'], description: 'RP-initiated logout; null = sign-out stays local' }
        signing_algs:
          type: [array, 'null']
          items: { type: string }
          description: '`id_token_signing_alg_values_supported`'
        scopes_supported:
          type: [array, 'null']
          items: { type: string }
        keys: { type: integer, description: Signing keys usable with the accepted algorithms }
        redirect_uri: { type: string, description: Register this redirect URI at the provider }
        post_logout_redirect_uri: { type: string }
    ExternalGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: Group DN (LDAP) or claim value (OIDC) }
        name: { type: string }
    DirectoryUser:
      type: object
      required: [dn, username, display_name, email]
      properties:
        dn: { type: string }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'] }
    AuthProviderUserTest:
      type: object
      required: [ok, found, server, user, groups, require_group_ok, password, roles, checks]
      properties:
        ok: { type: boolean, description: 'Found, the password matched (when given) and the require-group gate passed' }
        found: { type: boolean }
        server: { type: [string, 'null'], description: The server that answered }
        user: { oneOf: [{ $ref: '#/components/schemas/DirectoryUser' }, { type: 'null' }] }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ExternalGroup' }
        require_group_ok: { type: [boolean, 'null'], description: null when no group is required }
        password: { type: string, enum: [not_tested, ok, failed] }
        roles:
          type: array
          description: Roles the group mapping gives this user
          items: { type: string }
        checks:
          type: array
          items: { $ref: '#/components/schemas/ProviderCheck' }

    # ---------------------------------------------------------------- repositories
    UpstreamAuth:
      type: object
      required: [kind]
      description: Upstream credentials. Secrets are write-only; reads return `secret_set` instead.
      properties:
        kind: { type: string, enum: [none, basic, bearer] }
        username: { type: [string, 'null'], maxLength: 256 }
        secret: { type: [string, 'null'], writeOnly: true, maxLength: 4096, description: 'Password or token. Omit or null on update to keep the stored secret.' }
        secret_set: { type: boolean, readOnly: true }
    ProxyConfig:
      type: object
      required: [upstream_url]
      properties:
        upstream_url: { type: string, format: uri, maxLength: 2048 }
        auth: { $ref: '#/components/schemas/UpstreamAuth' }
        metadata_max_age_s: { type: integer, minimum: 0, default: 1800 }
        content_max_age_s: { type: [integer, 'null'], minimum: 0, description: 'null = forever (immutable content)' }
        negative_ttl_s: { type: integer, minimum: 0, default: 600 }
        stale_on_error: { type: boolean, default: true }
        offline: { type: boolean, default: false }
        allow_private_upstream: { type: boolean, default: false }
    WritePolicy:
      type: string
      enum: [allow_redeploy, disable_redeploy, read_only]
      description: '`allow_redeploy`: versions/tags may be overwritten; `disable_redeploy`: never; `read_only`: no uploads at all'
    HostedConfig:
      type: object
      description: Hosted repositories only (defaults when omitted)
      properties:
        write_policy: { $ref: '#/components/schemas/WritePolicy' }
        immutable_tag_patterns:
          type: array
          maxItems: 50
          description: 'Docker: regular expressions (full match); a matching tag never moves once pushed, e.g. `v[0-9]+\.[0-9]+\.[0-9]+`'
          items: { type: string, minLength: 1, maxLength: 256 }
    DockerOptions:
      type: object
      properties:
        aliases:
          type: array
          description: 'Upstream aliases routed to this repo, e.g. `docker.io`, `ghcr.io` (SPEC §4.4)'
          items: { type: string, maxLength: 253 }
        docker_hub: { type: boolean, description: 'Upstream is Docker Hub: token auth, `library/` prefix, rate-limit tracking', default: false }
        default_repo: { type: boolean, description: 'Make this the default docker repository (mirror mode, unprefixed names)', default: false }
    NpmOptions:
      type: object
      properties:
        audit_passthrough: { type: boolean, default: true, description: Proxy npm audit requests to the upstream }
    AptOptions:
      type: object
      required: [distribution]
      properties:
        distribution: { type: string, maxLength: 100, description: 'Informational default suite, e.g. `trixie`' }
        flat: { type: boolean, default: false, description: Flat repository layout (no `dists/`) }
    RawOptions:
      type: object
      properties:
        metadata_path_regex: { type: [string, 'null'], maxLength: 512, description: 'Paths matching this regex are mutable metadata (revalidated)' }
        content_disposition: { type: string, enum: [inline, attachment], default: attachment }
    YumOptions:
      type: object
      properties:
        repo_path: { type: string, maxLength: 200, default: '', description: 'Path of the yum repository (the directory holding `repodata/`) below the upstream URL, e.g. `$releasever/BaseOS/$basearch/os/`. Empty: derived for well-known upstreams, else the repository root. Only used by "Set me up" and "test upstream"' }
        gpg_key: { type: [string, 'null'], maxLength: 500, description: '`gpgkey` for the "Set me up" `.repo` file. Empty: the distribution key for well-known upstreams' }
    FormatOptions:
      description: Format-specific options; the shape follows the repository's `format`
      oneOf:
        - $ref: '#/components/schemas/DockerOptions'
        - $ref: '#/components/schemas/NpmOptions'
        - $ref: '#/components/schemas/AptOptions'
        - $ref: '#/components/schemas/RawOptions'
        - $ref: '#/components/schemas/YumOptions'
    RepositoryWrite:
      type: object
      required: [name, format, type, online]
      properties:
        name: { $ref: '#/components/schemas/RepositoryName' }
        format: { $ref: '#/components/schemas/Format' }
        type: { $ref: '#/components/schemas/RepositoryType' }
        online: { type: boolean, description: Accepts requests }
        description: { type: string, maxLength: 500 }
        proxy: { $ref: '#/components/schemas/ProxyConfig' }
        hosted: { $ref: '#/components/schemas/HostedConfig' }
        format_options: { $ref: '#/components/schemas/FormatOptions' }
    RepositorySummaryStats:
      type: object
      required: [size_bytes, artifact_count, hit_ratio_24h, requests_24h, bytes_served_24h, requests_spark_24h, last_activity_at]
      properties:
        size_bytes: { type: integer }
        artifact_count: { type: integer }
        hit_ratio_24h: { type: [number, 'null'], minimum: 0, maximum: 1, description: null when there were no requests }
        requests_24h: { type: integer }
        bytes_served_24h: { type: integer }
        bytes_saved_24h: { type: integer }
        requests_spark_24h:
          type: array
          description: Requests per hour, oldest first (24 values)
          items: { type: integer }
        last_activity_at: { type: [string, 'null'], format: date-time }
    Repository:
      type: object
      required: [name, format, type, online, status, url, created_at, updated_at, stats]
      properties:
        name: { $ref: '#/components/schemas/RepositoryName' }
        format: { $ref: '#/components/schemas/Format' }
        type: { $ref: '#/components/schemas/RepositoryType' }
        online: { type: boolean }
        description: { type: string }
        status: { $ref: '#/components/schemas/RepositoryStatus' }
        url: { type: string, format: uri, description: 'Client URL, `<base>/repository/<name>/`' }
        proxy: { $ref: '#/components/schemas/ProxyConfig' }
        hosted: { $ref: '#/components/schemas/HostedConfig' }
        format_options: { $ref: '#/components/schemas/FormatOptions' }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        stats: { $ref: '#/components/schemas/RepositorySummaryStats' }
    RepositoryPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Repository' }
        next_cursor: { type: [string, 'null'] }
        total: { type: integer, description: Matching repositories across all pages }
    UpstreamTestRequest:
      type: object
      required: [format, proxy]
      properties:
        format: { $ref: '#/components/schemas/Format' }
        repository: { type: string, description: 'Existing repository name: reuse its stored secret when `proxy.auth.secret` is omitted' }
        proxy: { $ref: '#/components/schemas/ProxyConfig' }
        format_options: { $ref: '#/components/schemas/FormatOptions' }
    UpstreamTestResult:
      type: object
      required: [reachable, latency_ms, checks]
      properties:
        reachable: { type: boolean }
        http_status: { type: [integer, 'null'] }
        latency_ms: { type: [number, 'null'] }
        auth: { type: string, enum: [anonymous, authenticated, failed, not_required] }
        tls: { type: [string, 'null'], description: 'Negotiated protocol and certificate subject, e.g. `TLSv1.3, CN=registry-1.docker.io`' }
        checks:
          type: array
          items:
            type: object
            required: [name, ok, message]
            properties:
              name: { type: string, description: 'e.g. `dns`, `ssrf`, `tls`, `http`, `auth`, `protocol`' }
              ok: { type: boolean }
              message: { type: string }
        rate_limit: { oneOf: [{ $ref: '#/components/schemas/RateLimit' }, { type: 'null' }] }
    SetupSnippet:
      type: object
      required: [id, title, language, content]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        language: { type: string, description: 'Highlighting hint: `shell`, `json`, `ini`, `toml`, `yaml`, `text`' }
        filename: { type: [string, 'null'], description: 'Where the snippet goes, e.g. `/etc/docker/daemon.json`' }
        os: { type: [string, 'null'], enum: [linux, macos, windows, null] }
        content: { type: string, description: 'May contain `{{TOKEN}}` / `{{USERNAME}}` placeholders' }
    SetupClient:
      type: object
      required: [id, label, snippets]
      properties:
        id: { type: string, description: 'e.g. `docker`, `podman`, `containerd`, `npm`, `pnpm`, `yarn`, `apt`, `curl`' }
        label: { type: string }
        snippets:
          type: array
          items: { $ref: '#/components/schemas/SetupSnippet' }
    SetupGuide:
      type: object
      required: [repository, format, clients]
      properties:
        repository: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        clients:
          type: array
          items: { $ref: '#/components/schemas/SetupClient' }
        notes:
          type: array
          items: { type: string }

    # ---------------------------------------------------------------- browse
    FolderEntry:
      type: object
      required: [name, path, kind]
      properties:
        name: { type: string }
        path: { type: string }
        kind: { type: string, enum: [folder, file] }
        size: { type: [integer, 'null'] }
        content_type: { type: [string, 'null'] }
        sha256: { type: [string, 'null'] }
        last_modified: { type: [string, 'null'], format: date-time }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        download_count: { type: [integer, 'null'] }
        child_count: { type: [integer, 'null'], description: Folders only }
    FolderListing:
      type: object
      required: [path, entries, next_cursor]
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: '#/components/schemas/FolderEntry' }
        next_cursor: { type: [string, 'null'] }
    Platform:
      type: object
      required: [os, architecture]
      properties:
        os: { type: string }
        architecture: { type: string }
        variant: { type: [string, 'null'] }
    DockerImage:
      type: object
      required: [name, tag_count, size_bytes]
      properties:
        name: { type: string }
        tag_count: { type: integer }
        size_bytes: { type: integer, description: Unique bytes stored for this image }
        last_pulled_at: { type: [string, 'null'], format: date-time }
        pulls: { type: integer }
    DockerImagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DockerImage' }
        next_cursor: { type: [string, 'null'] }
    DockerTag:
      type: object
      required: [tag, digest, media_type, platforms, size_bytes, updated_at]
      properties:
        tag: { type: string }
        digest: { type: string }
        media_type: { type: string }
        platforms:
          type: array
          items: { $ref: '#/components/schemas/Platform' }
        size_bytes: { type: integer }
        created_at: { type: [string, 'null'], format: date-time, description: Image config `created` }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        last_pulled_at: { type: [string, 'null'], format: date-time }
        pulls: { type: integer }
    DockerTagPage:
      type: object
      required: [image, items, next_cursor]
      properties:
        image: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/DockerTag' }
        next_cursor: { type: [string, 'null'] }
    DockerLayer:
      type: object
      required: [digest, size, media_type]
      properties:
        digest: { type: string }
        size: { type: integer }
        media_type: { type: string }
        cached: { type: boolean, description: Blob present in the blob store }
        created_by: { type: [string, 'null'], description: 'History entry (`created_by`) for this layer' }
    DockerPlatformManifest:
      type: object
      required: [platform, digest, size]
      properties:
        platform: { $ref: '#/components/schemas/Platform' }
        digest: { type: string }
        size: { type: integer }
    DockerManifest:
      type: object
      required: [image, reference, digest, media_type, is_index, manifests, layers, total_size]
      properties:
        image: { type: string }
        reference: { type: string }
        digest: { type: string, description: Digest of the requested reference (index digest for multi-arch) }
        media_type: { type: string }
        is_index: { type: boolean }
        manifests:
          type: array
          description: Index entries (empty for a single-platform manifest)
          items: { $ref: '#/components/schemas/DockerPlatformManifest' }
        platform: { oneOf: [{ $ref: '#/components/schemas/Platform' }, { type: 'null' }], description: Platform whose layers are listed }
        platform_digest: { type: [string, 'null'] }
        config_digest: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        layers:
          type: array
          items: { $ref: '#/components/schemas/DockerLayer' }
        total_size: { type: integer, description: Sum of layer sizes for the selected platform }
        labels:
          type: object
          additionalProperties: { type: string }
        pull_by_tag: { type: string }
        pull_by_digest: { type: string }
    NpmPackage:
      type: object
      required: [name, latest, version_count, cached_versions, size_bytes]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        latest: { type: string }
        version_count: { type: integer, description: Versions in the upstream packument }
        cached_versions: { type: integer, description: Versions whose tarball is cached }
        size_bytes: { type: integer }
        license: { type: [string, 'null'] }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    NpmPackagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NpmPackage' }
        next_cursor: { type: [string, 'null'] }
    NpmVersion:
      type: object
      required: [version, published_at, cached]
      properties:
        version: { type: string }
        published_at: { $ref: '#/components/schemas/Timestamp' }
        size_bytes: { type: [integer, 'null'], description: Tarball size }
        unpacked_size: { type: [integer, 'null'] }
        cached: { type: boolean }
        downloads: { type: integer }
        deprecated: { type: [string, 'null'], description: Deprecation message }
        integrity: { type: [string, 'null'] }
        dist_tags:
          type: array
          items: { type: string }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
    NpmVersionPage:
      type: object
      required: [package, items, next_cursor]
      properties:
        package: { $ref: '#/components/schemas/NpmPackage' }
        dist_tags:
          type: object
          additionalProperties: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/NpmVersion' }
        next_cursor: { type: [string, 'null'] }
    AptSuite:
      type: object
      required: [suite, components, architectures]
      properties:
        suite: { type: string }
        origin: { type: [string, 'null'] }
        codename: { type: [string, 'null'] }
        components:
          type: array
          items: { type: string }
        architectures:
          type: array
          items: { type: string }
        release_date: { type: [string, 'null'], format: date-time }
        last_refreshed_at: { type: [string, 'null'], format: date-time }
        package_count: { type: integer }
        cached_package_count: { type: integer }
    AptPackage:
      type: object
      required: [name, version, architecture, component, filename, cached]
      properties:
        name: { type: string }
        version: { type: string }
        architecture: { type: string }
        component: { type: string }
        section: { type: [string, 'null'] }
        size: { type: [integer, 'null'] }
        filename: { type: string, description: 'Path under the repository, `pool/...`' }
        sha256: { type: [string, 'null'] }
        cached: { type: boolean }
        verified: { type: [boolean, 'null'], description: Cached file matched the index hash; null if not cached }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        downloads: { type: integer }
    AptPackagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AptPackage' }
        next_cursor: { type: [string, 'null'] }

    # ---------------------------------------------------------------- search
    SearchKind:
      type: string
      enum: [package, image, file]
    SearchBrowseLink:
      type: object
      required: [repository, query]
      properties:
        repository: { type: string }
        query:
          type: object
          description: 'Query of the repository Browse view: `image` + `ref` (docker), `package` (npm), `suite` + `arch` + `q` (apt), `path` (the folder listing of every other format)'
          additionalProperties: { type: string }
    SearchHit:
      type: object
      required: [kind, format, repository, repository_type, name, version, qualifier, path, size, sha256, updated_at, cached, browse]
      properties:
        kind: { $ref: '#/components/schemas/SearchKind' }
        format: { $ref: '#/components/schemas/Format' }
        repository: { type: string }
        repository_type: { $ref: '#/components/schemas/RepositoryType' }
        name: { type: string, description: 'Package, image or file name' }
        version: { type: [string, 'null'], description: Version (packages) or tag (images) }
        qualifier: { type: [string, 'null'], description: 'Where it is listed: suite/component and architecture (apt), arch (yum)' }
        path: { type: [string, 'null'], description: File path in the repository (files, apt/yum packages) }
        size: { type: [integer, 'null'] }
        sha256: { type: [string, 'null'], description: Blob sha256 (files) or manifest digest (images) }
        updated_at: { type: [string, 'null'], format: date-time }
        cached: { type: [boolean, 'null'], description: In the cache (a listed apt/yum package may not be); null if unknown }
        browse: { $ref: '#/components/schemas/SearchBrowseLink' }
    SearchFacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    SearchFacets:
      type: object
      required: [format, repository, kind, type, total, capped]
      properties:
        format:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        repository:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        kind:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        type:
          type: array
          items: { $ref: '#/components/schemas/SearchFacetValue' }
        total: { type: integer, description: Matches with every filter applied }
        capped: { type: boolean, description: 'Counting stopped early: counts are lower bounds' }
    SearchPage:
      type: object
      required: [mode, items, next_cursor, facets]
      properties:
        mode: { type: string, enum: [name, digest], description: '`digest` when the query is a sha256 digest (or a prefix of one)' }
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        next_cursor: { type: [string, 'null'] }
        facets: { oneOf: [{ $ref: '#/components/schemas/SearchFacets' }, { type: 'null' }], description: 'First page only, unless `facets=false`' }

    # ---------------------------------------------------------------- stats
    Sparks:
      type: object
      description: Sparkline values per KPI over the range, oldest first, equally spaced (`step_s`)
      required: [requests_per_s, hit_ratio, bytes_served, bytes_saved, storage_used, artifacts, active_transfers]
      properties:
        requests_per_s: { type: array, items: { type: number } }
        hit_ratio: { type: array, items: { type: [number, 'null'] } }
        bytes_served: { type: array, items: { type: number } }
        bytes_saved: { type: array, items: { type: number } }
        storage_used: { type: array, items: { type: number } }
        artifacts: { type: array, items: { type: number } }
        active_transfers: { type: array, items: { type: number } }
    StatsSummary:
      type: object
      required: [range, step_s, generated_at, requests_per_s, requests, hit_ratio, bytes_served, bytes_saved, bytes_upstream, storage, artifacts_cached, active_transfers, sparks]
      properties:
        range: { $ref: '#/components/schemas/StatsRange' }
        step_s: { type: integer }
        generated_at: { $ref: '#/components/schemas/Timestamp' }
        requests_per_s: { type: number, description: Current rate (last 10 s) }
        requests: { type: integer, description: Requests in the range }
        hit_ratio: { type: [number, 'null'], description: Hits / (hits + misses) in the range }
        bytes_served: { type: integer, description: Bytes sent to clients in the range }
        bytes_saved: { type: integer, description: Bytes served from cache in the range (upstream traffic avoided) }
        bytes_upstream: { type: integer, description: Bytes fetched from upstreams in the range }
        storage:
          type: object
          required: [used_bytes, free_bytes, total_bytes]
          properties:
            used_bytes: { type: integer, description: Bytes held by blobs }
            free_bytes: { type: integer, description: Free space on the data directory filesystem }
            total_bytes: { type: integer }
        artifacts_cached: { type: integer }
        active_transfers: { type: integer }
        sparks: { $ref: '#/components/schemas/Sparks' }
    TimeSeries:
      type: object
      required: [range, step_s, unit, timestamps, series]
      properties:
        range: { $ref: '#/components/schemas/StatsRange' }
        step_s: { type: integer, description: 'Bucket width: 15m→10 s, 1h→1 min, 24h→10 min, 7d→1 h, 30d→6 h' }
        unit: { type: string, enum: [bytes, requests] }
        timestamps:
          type: array
          description: Bucket start times, oldest first
          items: { $ref: '#/components/schemas/Timestamp' }
        series:
          type: array
          items:
            type: object
            required: [key, label, values]
            properties:
              key: { type: string, description: '`hit`/`upstream` (split=cache) or a format name (split=format)' }
              label: { type: string }
              values: { type: array, items: { type: number } }
    StorageSummary:
      type: object
      required: [used_bytes, free_bytes, total_bytes, blob_count, dedup_saved_bytes, by_format, by_repository]
      properties:
        used_bytes: { type: integer }
        free_bytes: { type: integer }
        total_bytes: { type: integer }
        blob_count: { type: integer }
        dedup_saved_bytes: { type: integer }
        by_format:
          type: array
          items:
            type: object
            required: [format, bytes, artifacts]
            properties:
              format: { $ref: '#/components/schemas/Format' }
              bytes: { type: integer }
              artifacts: { type: integer }
        by_repository:
          type: array
          items:
            type: object
            required: [repository, format, bytes, artifacts]
            properties:
              repository: { type: string }
              format: { $ref: '#/components/schemas/Format' }
              bytes: { type: integer }
              artifacts: { type: integer }
    RateLimit:
      type: object
      required: [limit, remaining]
      properties:
        limit: { type: integer }
        remaining: { type: integer }
        window_s: { type: [integer, 'null'] }
        reset_at: { type: [string, 'null'], format: date-time }
        source: { type: string, description: 'e.g. `docker-hub`' }
    UpstreamHealth:
      type: object
      required: [repository, format, upstream_url, status, error_rate, requests_1h]
      properties:
        repository: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        upstream_url: { type: string }
        status: { $ref: '#/components/schemas/RepositoryStatus' }
        error_rate: { type: number, minimum: 0, maximum: 1, description: Upstream errors / upstream requests, last hour }
        requests_1h: { type: integer, description: Upstream requests in the last hour }
        p95_latency_ms: { type: [number, 'null'] }
        last_error: { type: [string, 'null'] }
        last_error_at: { type: [string, 'null'], format: date-time }
        blocked_until: { type: [string, 'null'], format: date-time, description: Auto-block ends (status `blocked`) }
        rate_limit: { oneOf: [{ $ref: '#/components/schemas/RateLimit' }, { type: 'null' }] }

    # ---------------------------------------------------------------- live
    Transfer:
      type: object
      description: One in-flight (or just finished) transfer
      required: [id, repository, format, direction, artifact, client, cache, bytes_done, bytes_total, rate_bps, started_at, updated_at, state]
      properties:
        id: { type: string }
        repository: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        direction: { type: string, enum: [download, upload] }
        artifact: { type: string, description: 'Display name, e.g. `library/nginx@sha256:…` layer, `lodash-4.17.21.tgz`, `pool/main/c/curl/curl_8.14.1-2_amd64.deb`' }
        path: { type: string, description: Asset path within the repository }
        component: { type: [string, 'null'], description: 'Component coordinates when known, e.g. `nginx:1.27`' }
        client:
          type: object
          required: [ip]
          properties:
            ip: { type: string }
            user: { type: [string, 'null'] }
            agent: { type: [string, 'null'], description: 'Client product, e.g. `docker/27.3`, `npm/11.6`, `apt/3.0`' }
        cache: { $ref: '#/components/schemas/CacheState' }
        followers: { type: integer, description: 'FETCHING: requests coalesced onto this fetch. COALESCED: 0', default: 0 }
        bytes_done: { type: integer }
        bytes_total: { type: [integer, 'null'], description: null when the upstream sends no length }
        rate_bps: { type: number, description: Bytes per second (smoothed) }
        upstream_latency_ms: { type: [number, 'null'], description: Time to first byte from the upstream (misses only) }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        state: { type: string, enum: [active, finished, failed] }
        error: { type: [string, 'null'] }
    TransferList:
      type: object
      required: [items, as_of]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
        as_of: { $ref: '#/components/schemas/Timestamp' }
    ActivityKind:
      type: string
      enum: [download, upload, delete, cache_miss, upstream_state, repository, cleanup, auth, error]
    ActivityEvent:
      type: object
      required: [id, ts, kind, summary, outcome]
      properties:
        id: { type: string, description: Stream id; also the SSE `id:` }
        ts: { $ref: '#/components/schemas/Timestamp' }
        kind: { $ref: '#/components/schemas/ActivityKind' }
        summary: { type: string, description: Plain-text one-liner (never rendered as HTML) }
        outcome: { type: string, enum: [success, failure, info] }
        repository: { type: [string, 'null'] }
        format: { oneOf: [{ $ref: '#/components/schemas/Format' }, { type: 'null' }] }
        artifact: { type: [string, 'null'] }
        path: { type: [string, 'null'], description: Full path of the asset in the repository, when there is one }
        principal: { type: [string, 'null'], description: 'Username, `anonymous`, or a client IP' }
        cache: { oneOf: [{ $ref: '#/components/schemas/CacheState' }, { type: 'null' }] }
        bytes: { type: [integer, 'null'] }
        duration_ms: { type: [number, 'null'] }
    ActivityPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityEvent' }
        next_cursor: { type: [string, 'null'] }

    # ---------------------------------------------------------------- SSE events (ARCH §8)
    LiveEvent:
      description: One SSE message; `type` equals the SSE `event:` field.
      oneOf:
        - $ref: '#/components/schemas/TransfersSnapshotEvent'
        - $ref: '#/components/schemas/TransferStartedEvent'
        - $ref: '#/components/schemas/TransferProgressEvent'
        - $ref: '#/components/schemas/TransferFinishedEvent'
        - $ref: '#/components/schemas/TransferFailedEvent'
        - $ref: '#/components/schemas/StatsTickEvent'
        - $ref: '#/components/schemas/UpstreamStateEvent'
        - $ref: '#/components/schemas/ActivityStreamEvent'
      discriminator:
        propertyName: type
        mapping:
          transfers.snapshot: '#/components/schemas/TransfersSnapshotEvent'
          transfer.started: '#/components/schemas/TransferStartedEvent'
          transfer.progress: '#/components/schemas/TransferProgressEvent'
          transfer.finished: '#/components/schemas/TransferFinishedEvent'
          transfer.failed: '#/components/schemas/TransferFailedEvent'
          stats.tick: '#/components/schemas/StatsTickEvent'
          upstream.state: '#/components/schemas/UpstreamStateEvent'
          activity: '#/components/schemas/ActivityStreamEvent'
    TransfersSnapshotEvent:
      type: object
      required: [type, ts, transfers]
      properties:
        type: { type: string, const: transfers.snapshot }
        ts: { $ref: '#/components/schemas/Timestamp' }
        transfers:
          type: array
          items: { $ref: '#/components/schemas/Transfer' }
    TransferStartedEvent:
      type: object
      required: [type, ts, transfer]
      properties:
        type: { type: string, const: transfer.started }
        ts: { $ref: '#/components/schemas/Timestamp' }
        transfer: { $ref: '#/components/schemas/Transfer' }
    TransferProgressEvent:
      type: object
      description: Coalesced to ≤ 4 Hz per transfer. Carries only the fields that change.
      required: [type, ts, id, bytes_done, rate_bps]
      properties:
        type: { type: string, const: transfer.progress }
        ts: { $ref: '#/components/schemas/Timestamp' }
        id: { type: string }
        bytes_done: { type: integer }
        bytes_total: { type: [integer, 'null'] }
        rate_bps: { type: number }
        cache: { $ref: '#/components/schemas/CacheState' }
        followers: { type: integer }
        upstream_latency_ms: { type: [number, 'null'] }
    TransferFinishedEvent:
      type: object
      required: [type, ts, id, bytes_done, duration_ms]
      properties:
        type: { type: string, const: transfer.finished }
        ts: { $ref: '#/components/schemas/Timestamp' }
        id: { type: string }
        bytes_done: { type: integer }
        duration_ms: { type: number }
        cache: { $ref: '#/components/schemas/CacheState' }
    TransferFailedEvent:
      type: object
      required: [type, ts, id, error]
      properties:
        type: { type: string, const: transfer.failed }
        ts: { $ref: '#/components/schemas/Timestamp' }
        id: { type: string }
        bytes_done: { type: integer }
        error: { type: string }
    StatsTickEvent:
      type: object
      description: 1 Hz rolling counters for the KPI tiles (last 10 s window for rates)
      required: [type, ts, requests_per_s, bytes_out_per_s, bytes_upstream_per_s, hit_ratio_1m, active_transfers]
      properties:
        type: { type: string, const: stats.tick }
        ts: { $ref: '#/components/schemas/Timestamp' }
        requests_per_s: { type: number }
        bytes_out_per_s: { type: number, description: Bytes per second sent to clients }
        bytes_upstream_per_s: { type: number, description: Bytes per second fetched from upstreams }
        bytes_saved_per_s: { type: number, description: Bytes per second served from cache }
        hit_ratio_1m: { type: [number, 'null'] }
        active_transfers: { type: integer }
        storage_used_bytes: { type: integer }
        artifacts_cached: { type: integer }
    UpstreamStateEvent:
      type: object
      required: [type, ts, health]
      properties:
        type: { type: string, const: upstream.state }
        ts: { $ref: '#/components/schemas/Timestamp' }
        health: { $ref: '#/components/schemas/UpstreamHealth' }
    ActivityStreamEvent:
      type: object
      description: A durable activity event (SSE `id:` = `event.id`, resumable with `Last-Event-ID`)
      required: [type, ts, event]
      properties:
        type: { type: string, const: activity }
        ts: { $ref: '#/components/schemas/Timestamp' }
        event: { $ref: '#/components/schemas/ActivityEvent' }

    # ---------------------------------------------------------------- cleanup and blob GC (T-O01, T-O02)
    CleanupFormat:
      type: string
      description: The format a policy applies to, or `*` for every format
      enum: ['*', docker, npm, apt, raw, yum, pypi, maven, go, helm, terraform, galaxy, swift, nuget, cargo, rubygems, composer, conda, apk, huggingface]
    CleanupCriteria:
      type: object
      description: |
        Every criterion that is set must match (AND); at least one selecting criterion is required. Docker policies
        select tags (name = image, version = tag); `untagged_older_than_days` also removes manifests no tag reaches.
        Only content is removed (never indexes or packuments); blob GC reclaims the space later.
      additionalProperties: false
      properties:
        last_downloaded_older_than_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Not downloaded for this many days (never downloaded = counted from when it was cached)
        published_older_than_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Cached or published more than this many days ago (docker - tag last updated)
        keep_latest_n_versions:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: Always keep the newest N versions of each component (format version order; docker - tags by recency)
        name_include: { type: [string, 'null'], maxLength: 256, description: Regular expression the component name must contain a match of }
        name_exclude: { type: [string, 'null'], maxLength: 256, description: Regular expression that protects matching names }
        version_include: { type: [string, 'null'], maxLength: 256, description: Regular expression the version or tag must contain a match of }
        version_exclude: { type: [string, 'null'], maxLength: 256, description: Regular expression that protects matching versions or tags }
        prerelease_only: { type: boolean, default: false, description: 'Only pre-release versions (semver `-rc.1`, Debian `~beta`, tags such as `nightly`)' }
        untagged_older_than_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 36500
          description: Docker only - manifests no tag reaches, updated more than this many days ago
    CleanupPolicyWrite:
      type: object
      required: [name, format, criteria]
      additionalProperties: false
      properties:
        name: { $ref: '#/components/schemas/RepositoryName' }
        description: { type: string, maxLength: 500 }
        format: { $ref: '#/components/schemas/CleanupFormat' }
        criteria: { $ref: '#/components/schemas/CleanupCriteria' }
        schedule:
          type: [string, 'null']
          maxLength: 100
          description: 'When it runs: 5-field UTC cron (`0 3 * * *`) or a macro such as `@daily`; null = manual only'
        enabled: { type: boolean, default: true, description: Scheduled runs happen only while enabled }
    JobProgress:
      type: object
      required: [done, total, message]
      properties:
        done: { type: integer }
        total: { type: [integer, 'null'] }
        message: { type: [string, 'null'] }
    CleanupRunSummary:
      type: object
      required: [id, status, trigger, started_at, finished_at, progress, removed, bytes, error]
      properties:
        id: { type: string, description: Run id (one per attempt) }
        status: { type: string, enum: [running, succeeded, failed, dead, interrupted] }
        trigger: { type: string, enum: [schedule, manual] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { type: [string, 'null'], format: date-time }
        progress: { $ref: '#/components/schemas/JobProgress' }
        removed: { type: integer, description: Items removed (assets, tags, manifests, layers) }
        bytes: { type: integer, description: Bytes of the removed assets (blob GC reclaims them unless another asset shares the blob) }
        error: { type: [string, 'null'] }
    CleanupRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CleanupRunSummary' }
    CleanupPolicy:
      type: object
      required: [id, name, description, format, criteria, schedule, enabled, repositories, created_at, updated_at, next_run_at, last_run]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        format: { $ref: '#/components/schemas/CleanupFormat' }
        criteria: { $ref: '#/components/schemas/CleanupCriteria' }
        schedule: { type: [string, 'null'] }
        enabled: { type: boolean }
        repositories:
          type: array
          description: Attached repositories the caller can see
          items: { type: string }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }
        next_run_at: { type: [string, 'null'], format: date-time, description: Next scheduled run (null = manual only or disabled) }
        last_run: { oneOf: [{ $ref: '#/components/schemas/CleanupRunSummary' }, { type: 'null' }] }
    CleanupPolicyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CleanupPolicy' }
    CleanupPreviewRequest:
      type: object
      required: [format, criteria]
      additionalProperties: false
      properties:
        format: { $ref: '#/components/schemas/CleanupFormat' }
        criteria: { $ref: '#/components/schemas/CleanupCriteria' }
        policy_id: { type: [string, 'null'], maxLength: 64, description: A saved policy - preview on its attached repositories }
        repositories:
          type: [array, 'null']
          maxItems: 100
          items: { type: string, maxLength: 64 }
        cursor: { type: [string, 'null'], maxLength: 512 }
        limit: { type: integer, minimum: 0, maximum: 500, default: 50 }
    CleanupCandidate:
      type: object
      required: [repository, kind, name, version, path, size, created_at, last_downloaded_at, reason]
      properties:
        repository: { type: string }
        kind:
          type: string
          enum: [asset, tag, manifest, layer]
          description: '`asset` = a cached file; docker - `tag`, `manifest` (no tag reaches it any more), `layer` (no remaining manifest uses it)'
        name: { type: string, description: Component name (docker - the image) }
        version: { type: [string, 'null'], description: Version (docker - tag or digest) }
        path: { type: string }
        size: { type: integer, description: Bytes of the asset removed (0 when only an index record goes) }
        created_at: { type: [string, 'null'], format: date-time }
        last_downloaded_at: { type: [string, 'null'], format: date-time }
        reason: { type: string, description: 'Why it matches, e.g. `not downloaded for 120 days`' }
    CleanupRepositoryTotal:
      type: object
      required: [name, format, count, bytes, truncated]
      properties:
        name: { type: string }
        format: { $ref: '#/components/schemas/Format' }
        count: { type: integer }
        bytes: { type: integer }
        truncated: { type: boolean, description: Too large to evaluate completely in a preview (a run evaluates everything) }
    CleanupPreview:
      type: object
      required: [count, bytes, truncated, repositories, items, next_cursor]
      properties:
        count: { type: integer }
        bytes: { type: integer }
        truncated: { type: boolean }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/CleanupRepositoryTotal' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CleanupCandidate' }
        next_cursor: { type: [string, 'null'] }
    RepositoryCleanup:
      type: object
      required: [repository, policies]
      properties:
        repository: { type: string }
        policies:
          type: array
          items: { $ref: '#/components/schemas/CleanupPolicy' }
    RepositoryCleanupUpdate:
      type: object
      required: [policy_ids]
      additionalProperties: false
      properties:
        policy_ids:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 64 }
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string }
        status:
          type: string
          enum: [enqueued, merged, rerun, running]
          description: '`merged` - joined a pending run; `rerun` - runs once more after the current run'
    GcRun:
      type: object
      required: [id, status, trigger, started_at, finished_at, progress, freed_blobs, freed_bytes, marked, uploads_removed, error]
      properties:
        id: { type: string }
        status: { type: string, enum: [running, succeeded, failed, dead, interrupted] }
        trigger: { type: string, enum: [schedule, manual] }
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at: { type: [string, 'null'], format: date-time }
        progress: { $ref: '#/components/schemas/JobProgress' }
        freed_blobs: { type: integer }
        freed_bytes: { type: integer }
        marked: { type: integer, description: Blobs newly found unreferenced (deleted once unreferenced for the grace period) }
        uploads_removed: { type: integer, description: Orphan upload files removed }
        error: { type: [string, 'null'] }
    GcStatus:
      type: object
      required: [enabled, schedule, grace_hours, next_run_at, pending_blobs, pending_bytes, runs]
      properties:
        enabled: { type: boolean }
        schedule: { type: string }
        grace_hours: { type: number, description: A blob is deleted only after being unreferenced this long }
        next_run_at: { type: [string, 'null'], format: date-time }
        pending_blobs: { type: integer, description: Blobs marked unreferenced, waiting out the grace period }
        pending_bytes: { type: integer }
        runs:
          type: array
          description: Recent runs, newest first (up to 20)
          items: { $ref: '#/components/schemas/GcRun' }

    # ---------------------------------------------------------------- audit (SPEC §4.11, T-S10)
    AuditOutcome:
      type: string
      enum: [success, failure]
    AuditActor:
      type: object
      description: Who acted. `system` = the server or a worker job acting on its own.
      required: [kind, id, name, auth, provider, token_id]
      properties:
        kind: { type: string, enum: [user, service_account, anonymous, system] }
        id: { type: [string, 'null'] }
        name: { type: string, description: 'Username, service account name, `anonymous` or `system`' }
        auth:
          type: string
          description: How the request was authenticated
          enum: [session, api_token, basic, registry_token, none, system]
        provider: { type: [string, 'null'], description: 'Sign-in source of the user (`local`, `ldap:<id>`, `oidc:<id>`)' }
        token_id: { type: [string, 'null'], description: The API token used, when there was one }
    AuditTarget:
      type: object
      required: [kind, id, name]
      properties:
        kind:
          type: string
          description: '`user`, `service_account`, `api_token`, `auth_provider`, `repository`, `session`, `settings`...'
        id: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
    AuditChange:
      type: object
      description: One changed field. Secret values are never recorded; `redacted` marks a secret that changed.
      required: [field, before, after, redacted]
      properties:
        field: { type: string, description: 'Dotted path, e.g. `proxy.upstream_url`' }
        before: { description: Previous value (JSON); null when absent }
        after: { description: New value (JSON); null when removed }
        redacted: { type: boolean }
    AuditRecord:
      type: object
      required: [id, ts, action, outcome, actor, target, client_ip, request_id, reason, details, changes]
      properties:
        id: { type: string }
        ts: { $ref: '#/components/schemas/Timestamp' }
        action: { type: string, description: '`<category>.<verb>`, e.g. `auth.login`, `repository.update`' }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        actor: { $ref: '#/components/schemas/AuditActor' }
        target: { oneOf: [{ $ref: '#/components/schemas/AuditTarget' }, { type: 'null' }] }
        client_ip: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        reason: { type: [string, 'null'], description: 'Why it failed (`bad_credentials`, `locked`...); null on success' }
        details:
          type: object
          description: Action-specific facts (plain values; never secrets)
          additionalProperties: true
        changes:
          type: array
          items: { $ref: '#/components/schemas/AuditChange' }
    AuditPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditRecord' }
        next_cursor: { type: [string, 'null'] }
