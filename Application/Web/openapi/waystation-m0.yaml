  # ---------------------------------------------------------------- import from Nexus (T-M01; needs `admin`)
  /import/nexus/preview:
    post:
      tags: [import]
      operationId: previewNexusImport
      summary: Dry run of an import from Nexus Repository 3 (nothing is written; needs `admin`)
      description: |
        Reads the repository configuration of the Nexus at `url` through its REST API (basic auth with a Nexus
        administrator; the credentials are used for this request only, never stored, logged or returned) and plans
        every repository: `create` (with the repository it would create), `exists` (name taken; never changed;
        field-level `differences`), `unsupported` or `invalid` (with the reason). Nexus errors (unreachable, refused
        credentials, private address without `allow_private`) answer 502 with the reason in `detail`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NexusImportRequest' }
      responses:
        '200':
          description: The plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NexusImportReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /import/nexus/apply:
    post:
      tags: [import]
      operationId: applyNexusImport
      summary: Import repositories from Nexus Repository 3 (needs `admin`)
      description: |
        Reads Nexus again (nothing is kept from a preview) and creates the selected `create` repositories (members
        before groups), each audited as `repository.create`. Idempotent: names that exist by then are reported
        `exists` and left alone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NexusApplyRequest' }
      responses:
        '200':
          description: What happened to each repository
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NexusImportReport' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /cleanup-policies:
    get:
      tags: [cleanup]
      operationId: listCleanupPolicies
      summary: Cleanup policies by name (needs `admin`, or `manage` on a repository to pick policies to attach)
      responses:
        '200':
          description: Policies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicyList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [cleanup]
      operationId: createCleanupPolicy
      summary: Create a cleanup policy (needs `admin`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupPolicyWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicy' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /cleanup-policies/preview:
    post:
      tags: [cleanup]
      operationId: previewCleanup
      summary: Dry run of a (saved or draft) policy - what a run would remove now, with sizes; removes nothing
      description: |
        Evaluates the criteria against the repositories exactly as a run does (the same code), so the preview
        equals the result of running the policy now. `limit: 0` returns only the totals (live counts in the editor).
        Repositories: the request's list; else the saved policy's attached repositories (`policy_id`); else every
        repository of the policy's format. Needs `admin`, or `manage` on every listed repository.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupPreviewRequest' }
      responses:
        '200':
          description: What would be removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPreview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /cleanup-policies/{policy_id}:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [cleanup]
      operationId: getCleanupPolicy
      summary: One cleanup policy
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicy' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [cleanup]
      operationId: updateCleanupPolicy
      summary: Replace a cleanup policy (needs `admin`)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CleanupPolicyWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CleanupPolicy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [cleanup]
      operationId: deleteCleanupPolicy
      summary: Delete a cleanup policy (detaches it from every repository; needs `admin`)
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /cleanup-policies/{policy_id}/run:
